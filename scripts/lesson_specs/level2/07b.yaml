id: "07b"
title: "Повторение: семья (Ponavljanje)"
subtitle: "родные, «у меня есть», мой и твой вместе"
teaches: []
steps:
  - practice:
      title: "Послушай и выбери"
      also_ok: ["brata", "sestru", "sestre", "decu"]
      ex:
        - {type: choice, say: "Imam brata i sestru.", options: ["У меня есть брат и сестра.", "У меня есть брат.", "У меня нет брата и сестры."], answer: "У меня есть брат и сестра."}
        - {type: choice, say: "Ovo je moja baba.", options: ["Это моя бабушка.", "Это моя мама.", "Это твоя бабушка."], answer: "Это моя бабушка."}
        - {type: choice, say: "Nemam sestre.", options: ["У меня нет сестры.", "У меня нет брата.", "У меня есть сестра."], answer: "У меня нет сестры."}
        - {type: choice, say: "Imaš li decu?", options: ["У тебя есть дети?", "У тебя есть брат?", "У меня есть дети."], answer: "У тебя есть дети?"}
  - reading:
      name: porodica
      title: "Моя семья"
      text: |
        — Marko, imaš li brata ili sestru?
        — Imam brata i sestru. A ti, Ana?
        — Imam sestru. Nemam brata. Evo, ovo je moja sestra. Ona radi kao lekar.
        — A ovo je tvoj tata?
        — Da, ovo je moj tata. A ovo je moja mama.

        ---

        — Марко, у тебя есть брат или сестра?
        — У меня есть брат и сестра. А у тебя, Ана?
        — У меня есть сестра. Брата нет. Вот, это моя сестра. Она работает врачом.
        — А это твой папа?
        — Да, это мой папа. А это моя мама.
      ex:
        - {type: choice, prompt: "Есть ли у Аны брат?", options: ["Нет, только сестра", "Да, и брат, и сестра", "Нет ни брата, ни сестры"], answer: "Нет, только сестра"}
        - {type: choice, prompt: "Кем работает сестра Аны?", options: ["Врачом", "Программистом", "Официантом"], answer: "Врачом"}
  - practice:
      title: "Соедини"
      also_ok: ["brata", "sestre", "njena"]
      ex:
        - type: match
          prompt: "Соедини фразу и перевод"
          pairs:
            - ["moj tata", "мой папа"]
            - ["moja mama", "моя мама"]
            - ["tvoj brat", "твой брат"]
            - ["njena sestra", "её сестра"]
            - ["Imam sina", "У меня есть сын"]
            - ["Nemam brata", "У меня нет брата"]
  - practice:
      title: "Диктант"
      also_ok: ["brata", "sestru", "sestre"]
      ex:
        - {type: listen, say: "Imam brata i sestru.", prompt: "Запиши, что слышишь.", accept: ["Imam brata i sestru."], ru: ["У меня есть брат и сестра."]}
        - {type: listen, say: "Ovo je moja mama.", prompt: "Запиши, что слышишь.", accept: ["Ovo je moja mama.", "To je moja mama."], ru: ["Это моя мама."]}
        - {type: listen, say: "Nemam sestre.", prompt: "Запиши, что слышишь.", accept: ["Nemam sestre."], ru: ["У меня нет сестры."]}
  - practice:
      title: "Собери"
      also_ok: ["brata", "sestru", "sestre"]
      ex:
        - {type: word_bank, prompt: "Собери: «мой папа и моя мама»", bank: ["Moj", "tata", "i", "moja", "mama", "moje"], accept: ["Moj tata i moja mama."]}
        - {type: word_bank, prompt: "Собери: «у меня есть брат и сестра»", bank: ["Imam", "brata", "i", "sestru", "sestre"], accept: ["Imam brata i sestru."]}
  - practice:
      title: "Переведи"
      also_ok: ["brata", "sestre"]
      ex:
        - {type: translate, prompt: "У меня нет сестры.", accept: ["Nemam sestre."]}
        - {type: translate, prompt: "У тебя есть брат?", accept: ["Imaš li brata?"]}
        - {type: translate, prompt: "Это моя бабушка.", accept: ["Ovo je moja baba.", "To je moja baba."]}
  - dialogue:
      title: "Семейное фото"
      scene: "Ты в гостях у Марко. На полке стоит семейная фотография, и он показывает её."
      voice: m
      also_ok: ["brata", "sestru", "sestre"]
      turns:
        - {who: npc, sr: "Zdravo! Ovo je moja porodica. Ovo je moj tata.", ru: "Привет! Это моя семья. Это мой папа."}
        - who: me
          sr: "A ovo je tvoja mama?"
          ru: "А это твоя мама?"
          ex: {type: choice, prompt: "Спроси, это ли его мама", options: ["A ovo je tvoja mama?", "A ovo je moja mama?", "A ovo je tvoj mama?"], answer: "A ovo je tvoja mama?"}
        - {who: npc, sr: "Da, ovo je moja mama. Imam brata i sestru. A ti?", ru: "Да, это моя мама. У меня есть брат и сестра. А у тебя?"}
        - who: me
          sr: "Imam sestru. Nemam brata."
          ru: "У меня есть сестра. Брата нет."
          ex: {type: choice, prompt: "Скажи, что у тебя есть сестра, а брата нет", options: ["Imam sestru. Nemam brata.", "Nemam sestre. Imam brata.", "Imam sestru i brata."], answer: "Imam sestru. Nemam brata."}
        - {who: npc, sr: "Dobro, razumem.", ru: "Хорошо, понятно."}
