id: "12b"
title: "Оплата (Plaćanje)"
subtitle: "наличные или карта, мелочь, чек, пакет, скидки"
teaches: [kartica, kes, svejedno, sitno-04, kusur, racun-04, kesa-05, akcija]
steps:
  - slide:
      name: kesom-karticom
      title: "Наличными или картой?"
      md: |
        Продавец: `Kešom ili karticom?` [кэ́шом и́ли ка́ртицом?] *(кешом или картицом — наличными или картой?)*

        Ты: `Karticom.` [ка́ртицом.] *(картой)* или `Kešom.` [кэ́шом.] *(наличными)*

        `kartica` [ка́ртица] *(картица — карта)*, `keš` [кэш] *(наличные)*. В ответе слово чуть меняется, запоминай готовыми.

        Если всё равно: `Svejedno.` [свэе́дно.] *(свеједно — всё равно)*
      check:
        prompt: "Ты платишь картой —"
        options: ["Karticom.", "Kešom.", "Hvala."]
        answer: "Karticom."
        also_ok: ["karticom", "kešom"]
  - slide:
      name: moze-karticom
      title: "Можно картой?"
      md: |
        `Može karticom?` [мо́жэ ка́ртицом?] *(може картицом — можно картой?)*

        `može` [мо́жэ] *(може — можно)*. Ответ: `Može.` *(можно)* или `Samo keš.` [са́мо кэш.] *(само кеш — только наличные)*

        > `samo` — «только» и «просто» (`Samo gledam`).
      check:
        prompt: "«Можно картой?» —"
        options: ["Može karticom?", "Karticom.", "Svejedno."]
        answer: "Može karticom?"
        also_ok: ["karticom"]
  - slide:
      name: sitno
      title: "Мелочь и сдача"
      md: |
        `sitno` [си́тно] *(ситно — мелочь)*: `Imate li sitno?` [и́матэ ли си́тно?] *(есть ли у вас мелочь?)*

        Отвечаешь: `Nemam, izvinite.` [нэ́мам, изви́нитэ.] *(нет, извините)* или `Evo, tačno.` [э́во, та́чно.] *(вот, ровно)*

        `kusur` [ку́сур] *(кусур — сдача)*: `Izvolite kusur.` [изво́литэ ку́сур.] *(вот ваша сдача)*
      check:
        prompt: "Слово «сдача» —"
        options: ["kusur", "sitno", "kartica"]
        answer: "kusur"
  - slide:
      name: racun-kesa
      title: "Чек и пакет"
      md: |
        `račun` [ра́чун] *(рачун — чек, счёт)*: `Račun, molim.` [ра́чун, мо́лим.] *(чек, пожалуйста)* · `Izvolite račun.` [изво́литэ ра́чун.] *(вот ваш чек)*

        `kesa` [кэ́са] *(кеса — пакет)*: `Kesa?` [кэ́са?] *(пакет?)* — `Ne treba, hvala.` [нэ трэ́ба, хва́ла.] *(не нужно, спасибо)*
      check:
        prompt: "Слово «чек» —"
        options: ["račun", "kusur", "kesa"]
        answer: "račun"
  - slide:
      name: akcija
      title: "Скидки"
      md: |
        `akcija` [а́кция] *(акција — акция, скидка)*: `Danas je akcija.` [да́нас е а́кция.] *(сегодня скидки)*

        Ещё говорят `popust` [по́пуст] *(попуст — скидка)* и `sniženje` [сни́жэне] *(снижење — снижение цен)*.
      check:
        prompt: "«Сегодня скидки» —"
        options: ["Danas je akcija.", "Danas sam umoran.", "Danas je pekara."]
        answer: "Danas je akcija."
        also_ok: ["popust", "sniženje"]
  - practice:
      title: "Послушай и выбери"
      also_ok: ["karticom", "kešom"]
      ex:
        - {type: choice, say: "Kešom ili karticom?", options: ["Наличными или картой?", "Мелочь есть?", "Чек нужен?"], answer: "Наличными или картой?"}
        - {type: choice, say: "Imate li sitno?", options: ["У вас есть мелочь?", "У вас есть чек?", "Наличными или картой?"], answer: "У вас есть мелочь?"}
        - {type: choice, say: "Izvolite račun.", options: ["Вот ваш чек.", "Вот ваша сдача.", "Вот ваш пакет."], answer: "Вот ваш чек."}
        - {type: choice, say: "Danas je akcija.", options: ["Сегодня скидки.", "Сегодня закрыто.", "Сегодня дорого."], answer: "Сегодня скидки."}
  - practice:
      title: "Что скажешь?"
      also_ok: ["karticom", "kešom"]
      ex:
        - {type: choice, prompt: "Ты платишь наличными —", options: ["Kešom.", "Karticom.", "Svejedno."], answer: "Kešom."}
        - {type: choice, prompt: "Тебе нужен чек —", options: ["Račun, molim.", "Kesa?", "Izvolite račun."], answer: "Račun, molim."}
        - {type: choice, prompt: "Продавец: «Kesa?» Пакет не нужен —", options: ["Ne treba, hvala.", "Evo, tačno.", "Svejedno."], answer: "Ne treba, hvala."}
  - practice:
      title: "Соедини"
      also_ok: ["karticom", "kešom"]
      ex:
        - type: match
          prompt: "Соедини слово и перевод"
          pairs:
            - ["Karticom", "картой"]
            - ["Kešom", "наличными"]
            - ["sitno", "мелочь"]
            - ["kusur", "сдача"]
            - ["račun", "чек"]
            - ["kesa", "пакет"]
  - practice:
      title: "Собери"
      ex:
        - {type: word_bank, prompt: "Собери: «чек, пожалуйста»", bank: ["Račun", "molim", "kusur", "hvala"], accept: ["Račun, molim."]}
        - {type: word_bank, prompt: "Собери: «вот, ровно»", bank: ["Evo", "tačno", "kusur"], accept: ["Evo, tačno."]}
  - practice:
      title: "Напиши"
      also_ok: ["karticom", "kešom"]
      ex:
        - {type: fill_blank, prompt: "«Наличными или картой?» → Kešom ___ karticom?", accept: ["ili"]}
        - {type: fill_blank, prompt: "«У вас есть мелочь?» → Imate li ___?", accept: ["sitno"]}
        - {type: translate, prompt: "Чек, пожалуйста.", accept: ["Račun, molim."]}
        - {type: translate, prompt: "Не нужно, спасибо.", accept: ["Ne treba, hvala."]}
