lesson: "08"
title: "Бројеви"
subtitle: "числа 0–100 и число+существительное"
teaches:
  [
    sest, sedam, osam, devet, jedanaest, dvanaest, petnaest, trideset,
    cetrdeset, pedeset, dvesta, trista, godina, kafa,
  ]

steps:
  - id: "08.1"
    kind: teach
    title: "Числа 0–10"
    md: "08/1-nula-deset.md"

  - id: "08.2"
    kind: practice
    title: "Узнай число"
    exercises:
      - id: "08.2.1"
        type: choice
        prompt: "«7» —"
        options: ["sedam", "šest", "osam"]
        answer: "sedam"
      - id: "08.2.2"
        type: choice
        prompt: "«четыре» —"
        options: ["četiri", "četrdeset", "tri"]
        answer: "četiri"
      - id: "08.2.3"
        type: match
        prompt: "Соедини число и цифру"
        pairs:
          - ["jedan", "один"]
          - ["tri", "три"]
          - ["pet", "пять"]
          - ["deset", "десять"]
      - id: "08.2.4"
        type: fill_blank
        prompt: "Запиши словом: 6 → ___"
        accept: ["šest"]

  - id: "08.3"
    kind: teach
    title: "Числа 11–100"
    md: "08/3-do-sto.md"

  - id: "08.4"
    kind: practice
    title: "Считаем дальше"
    exercises:
      - id: "08.4.1"
        type: choice
        prompt: "«30» —"
        options: ["trideset", "trinaest", "tri"]
        answer: "trideset"
      - id: "08.4.2"
        type: choice
        prompt: "«15» —"
        options: ["petnaest", "pedeset", "pet"]
        answer: "petnaest"
      - id: "08.4.3"
        type: match
        prompt: "Соедини"
        pairs:
          - ["dvadeset", "двадцать"]
          - ["trideset", "тридцать"]
          - ["pedeset", "пятьдесят"]
          - ["sto", "сто"]
      - id: "08.4.4"
        type: fill_blank
        prompt: "«40» словом — ___"
        accept: ["četrdeset"]
      - id: "08.4.5"
        type: word_bank
        prompt: "Собери «35»"
        bank: ["trideset", "pet"]
        accept: ["trideset pet"]

  - id: "08.5"
    kind: teach
    title: "Число + существительное"
    md: "08/5-broj-imenica.md"

  - id: "08.6"
    kind: practice
    title: "Сколько чего"
    also_ok: ["kafe", "kafu"]
    exercises:
      - id: "08.6.1"
        type: choice
        prompt: "«два динара» —"
        options: ["dva dinara", "dva dinar", "dve dinara"]
        answer: "dva dinara"
      - id: "08.6.2"
        type: choice
        prompt: "«пять кофе» —"
        options: ["pet kafa", "pet kafe", "pet kafu"]
        answer: "pet kafa"
      - id: "08.6.3"
        type: match
        prompt: "Соедини"
        pairs:
          - ["jedan dinar", "1 динар"]
          - ["dva dinara", "2 динара"]
          - ["pet dinara", "5 динаров"]
      - id: "08.6.4"
        type: fill_blank
        prompt: "Дополни: «tri ___» (kafa, женский род)"
        accept: ["kafe"]
