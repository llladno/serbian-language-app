lesson: "11"
title: "У продавницу"
subtitle: "магазин, первые слова"
teaches: [mleko, jaja, voda, samo-gledam]

steps:
  - id: "11.1"
    kind: teach
    title: "Куда идёшь"
    md: "11/1-gde-kupujem.md"

  - id: "11.2"
    kind: practice
    title: "Какой магазин"
    exercises:
      - id: "11.2.1"
        type: choice
        prompt: "Где купить хлеб?"
        options: ["pekara", "apoteka", "trafika"]
        answer: "pekara"
      - id: "11.2.2"
        type: choice
        prompt: "Где купить лекарство?"
        options: ["apoteka", "pijaca", "mesara"]
        answer: "apoteka"
      - id: "11.2.3"
        type: match
        prompt: "Соедини"
        pairs:
          - ["pekara", "пекарня"]
          - ["pijaca", "рынок"]
          - ["apoteka", "аптека"]
          - ["mesara", "мясная лавка"]
      - id: "11.2.4"
        type: fill_blank
        prompt: "Магазин самообслуживания — ___"
        accept: ["samoposluga"]

  - id: "11.3"
    kind: teach
    title: "Заходишь"
    md: "11/3-ulazim.md"

  - id: "11.4"
    kind: practice
    title: "Первые слова"
    exercises:
      - id: "11.4.1"
        type: choice
        prompt: "«Мне нужен хлеб» —"
        options: ["Treba mi hleb.", "Treba hleb mi.", "Mi treba hleb."]
        answer: "Treba mi hleb."
      - id: "11.4.2"
        type: choice
        prompt: "Продавец: «Recite?» Ты отвечаешь —"
        options: ["Treba mi hleb.", "Hvala, doviđenja.", "Laku noć."]
        answer: "Treba mi hleb."
      - id: "11.4.3"
        type: fill_blank
        prompt: "«У вас есть молоко?» → Da li ___ mleko?"
        accept: ["imate"]
      - id: "11.4.4"
        type: word_bank
        prompt: "Собери: «мне нужно молоко»"
        bank: ["Treba", "mi", "mleko"]
        accept: ["Treba mi mleko."]
