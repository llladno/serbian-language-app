lesson: "14"
title: "Проверка: первый контакт (Provera)"
subtitle: "приветствия, знакомство, язык и работа вместе"
teaches: []

steps:
  - id: "14.11"
    kind: reading
    title: "Один день"
    md: "14/11-jedan-dan.md"
    exercises:
      - id: "14.11.1"
        type: choice
        prompt: "Где живёт Иван?"
        options: ["В Нови-Саде", "В Белграде", "В России"]
        answer: "В Нови-Саде"
      - id: "14.11.2"
        type: choice
        prompt: "Какой язык Иван учит?"
        options: ["Сербский", "Английский", "Русский"]
        answer: "Сербский"

  - id: "14.12"
    kind: practice
    title: "Привет и как дела"
    exercises:
      - id: "14.12.1"
        type: choice
        prompt: "Утро, заходишь в пекарню —"
        options: ["Dobro jutro!", "Laku noć!", "Prijatno!"]
        answer: "Dobro jutro!"
      - id: "14.12.2"
        type: choice
        prompt: "Соседу, который старше тебя, говоришь —"
        options: ["Kako ste?", "Kako si?", "Kako ide?"]
        answer: "Kako ste?"
      - id: "14.12.3"
        type: choice
        prompt: "«Kako si?» — «___»"
        options: ["Ne žalim se.", "Dobro jutro.", "Molim vas."]
        answer: "Ne žalim se."
      - id: "14.12.4"
        type: match
        prompt: "Соедини фразу и перевод"
        pairs:
          - ["Dobar dan", "Добрый день"]
          - ["Laku noć", "Спокойной ночи"]
          - ["Doviđenja", "До свидания"]
          - ["Vidimo se", "Увидимся"]

  - id: "14.13"
    kind: practice
    title: "Вежливость и знакомство"
    exercises:
      - id: "14.13.1"
        type: choice
        prompt: "Тебе сказали «Hvala lepo». Отвечаешь —"
        options: ["Nema na čemu.", "Izvolite.", "Takođe."]
        answer: "Nema na čemu."
      - id: "14.13.2"
        type: choice
        prompt: "«Drago mi je.» — «___»"
        options: ["Takođe.", "Nema problema.", "Molim?"]
        answer: "Takođe."
      - id: "14.13.3"
        type: word_bank
        prompt: "Собери: «меня зовут Ана»"
        bank: ["Zovem", "se", "Ana"]
        accept: ["Zovem se Ana."]

  - id: "14.14"
    kind: checkpoint
    title: "Большая проверка"
    also_ok: ["rusije", "srbije"]
    exercises:
      - id: "14.14.1"
        type: choice
        say: "Odakle ste?"
        prompt: "Послушай и выбери перевод."
        options: ["Откуда вы?", "Как вас зовут?", "Как у вас дела?"]
        answer: "Откуда вы?"
      - id: "14.14.2"
        type: match
        prompt: "Соедини фразу и перевод"
        pairs:
          - ["Dobro jutro", "Доброе утро"]
          - ["Hvala lepo", "Большое спасибо"]
          - ["Zovem se Ana", "Меня зовут Ана"]
          - ["Govorim ruski", "Говорю по-русски"]
          - ["Radim kao lekar", "Работаю врачом"]
          - ["Ne žalim se", "Не жалуюсь"]
      - id: "14.14.3"
        hint: "Начинается на ve-; внутри буква č («ч»), не ć."
        type: fill_blank
        prompt: "Вечер: «Dobro ___!»"
        accept: ["veče"]
        explain: "«veče» — через č. «veće» (через ć) — другое слово, «совет/собрание»."
      - id: "14.14.4"
        type: word_bank
        prompt: "Собери: «я не из Сербии»"
        bank: ["Ja", "nisam", "iz", "Srbije", "sam"]
        accept: ["Ja nisam iz Srbije."]
      - id: "14.14.5"
        type: listen
        say: "Ne razumem. Polako, molim."
        prompt: "Запиши, что слышишь."
        accept: ["Ne razumem. Polako, molim.", "Ne razumem, polako, molim."]
        ru: ["Не понимаю. Помедленнее, пожалуйста.", "Не понимаю, помедленнее, пожалуйста."]
      - id: "14.14.6"
        type: translate
        prompt: "Добрый день! Как у вас дела?"
        accept: ["Dobar dan! Kako ste?"]
      - id: "14.14.7"
        type: translate
        prompt: "Я из России, живу в Нови-Саде."
        accept: ["Ja sam iz Rusije. Živim u Novom Sadu.", "Ja sam iz Rusije, živim u Novom Sadu."]
      - id: "14.14.8"
        type: translate
        prompt: "Говорю по-русски и немного по-сербски."
        accept: ["Govorim ruski i malo srpski.", "Ja govorim ruski i malo srpski."]
