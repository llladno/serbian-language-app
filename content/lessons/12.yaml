lesson: "12"
title: "Количина и плаћање"
subtitle: "сколько, ещё что-нибудь, оплата"
teaches: [sir, litar, deka]

steps:
  - id: "12.1"
    kind: teach
    title: "Сколько"
    md: "12/1-koliko.md"

  - id: "12.2"
    kind: practice
    title: "Мера"
    exercises:
      - id: "12.2.1"
        type: choice
        prompt: "«полкило сыра» —"
        options: ["pola kile sira", "pola kilo sir", "pola kile sir"]
        answer: "pola kile sira"
      - id: "12.2.2"
        type: choice
        prompt: "«два куска» —"
        options: ["dva komada", "dve komada", "dva komad"]
        answer: "dva komada"
      - id: "12.2.3"
        type: match
        prompt: "Соедини"
        pairs:
          - ["kilo", "килограмм"]
          - ["pola kile", "полкило"]
          - ["komad", "штука"]
          - ["pakovanje", "упаковка"]
      - id: "12.2.4"
        type: fill_blank
        prompt: "«литр молока» → litar ___."
        accept: ["mleka"]
      - id: "12.2.5"
        type: word_bank
        prompt: "Собери: «дайте мне кило»"
        bank: ["Dajte", "mi", "kilo"]
        accept: ["Dajte mi kilo."]

  - id: "12.3"
    kind: teach
    title: "Ещё что-нибудь"
    md: "12/3-jos-nesto.md"

  - id: "12.4"
    kind: practice
    title: "Заканчиваем"
    exercises:
      - id: "12.4.1"
        type: choice
        prompt: "Продавец: «Još nešto?» Тебе больше ничего не нужно —"
        options: ["To je sve, hvala.", "Još ovo.", "Koliko košta?"]
        answer: "To je sve, hvala."
      - id: "12.4.2"
        type: choice
        prompt: "«Больше ничего» —"
        options: ["Ništa, hvala.", "Još nešto.", "Da li imate?"]
        answer: "Ništa, hvala."
      - id: "12.4.3"
        type: fill_blank
        prompt: "«Это всё» → To je ___."
        accept: ["sve"]
      - id: "12.4.4"
        type: word_bank
        prompt: "Собери: «это всё, спасибо»"
        bank: ["To", "je", "sve", "hvala"]
        accept: ["To je sve, hvala."]

  - id: "12.5"
    kind: teach
    title: "Оплата"
    md: "12/5-placanje.md"

  - id: "12.6"
    kind: practice
    title: "Плачу"
    exercises:
      - id: "12.6.1"
        type: choice
        prompt: "Продавец: «Kešom ili karticom?» Ты платишь картой —"
        options: ["Karticom.", "Kešom.", "Kusur."]
        answer: "Karticom."
      - id: "12.6.2"
        type: choice
        prompt: "«У вас есть мелочь?» —"
        options: ["Imate li sitno?", "Koliko sitno?", "Sitno je."]
        answer: "Imate li sitno?"
      - id: "12.6.3"
        type: fill_blank
        prompt: "«Сколько с меня?» → Koliko ___?"
        accept: ["dugujem"]
      - id: "12.6.4"
        type: word_bank
        prompt: "Собери: «чек, пожалуйста»"
        bank: ["Račun", "molim"]
        accept: ["Račun, molim."]
