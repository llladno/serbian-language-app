lesson: "08d"
title: "Повторение: числа (Ponavljanje)"
subtitle: "от нуля до тысячи, на слух и на письме"
teaches: []

steps:
  - id: "08d.1"
    kind: practice
    title: "Послушай и выбери"
    also_ok: ["sedamnaest", "šezdeset", "hiljade"]
    exercises:
      - id: "08d.1.1"
        type: choice
        say: "Sedamnaest."
        prompt: "Послушай и выбери перевод."
        options: ["Семнадцать.", "Семьдесят.", "Семь."]
        answer: "Семнадцать."
      - id: "08d.1.2"
        type: choice
        say: "Šezdeset pet."
        prompt: "Послушай и выбери перевод."
        options: ["Шестьдесят пять.", "Шестнадцать.", "Пятьдесят шесть."]
        answer: "Шестьдесят пять."
      - id: "08d.1.3"
        type: choice
        say: "Trista dinara."
        prompt: "Послушай и выбери перевод."
        options: ["Триста динаров.", "Тридцать динаров.", "Двести динаров."]
        answer: "Триста динаров."
      - id: "08d.1.4"
        type: choice
        say: "Dve hiljade dinara."
        prompt: "Послушай и выбери перевод."
        options: ["Две тысячи динаров.", "Тысяча динаров.", "Двести динаров."]
        answer: "Две тысячи динаров."

  - id: "08d.2"
    kind: practice
    title: "Считаем"
    exercises:
      - id: "08d.2.1"
        type: choice
        prompt: "2 + 3 = ?"
        options: ["pet", "šest", "četiri"]
        answer: "pet"
      - id: "08d.2.2"
        type: choice
        prompt: "10 + 10 = ?"
        options: ["dvadeset", "dvanaest", "sto"]
        answer: "dvadeset"
      - id: "08d.2.3"
        type: choice
        prompt: "50 + 50 = ?"
        options: ["sto", "pedeset", "hiljadu"]
        answer: "sto"

  - id: "08d.3"
    kind: practice
    title: "Соедини"
    also_ok: ["sedamnaest", "šezdeset", "osamsto"]
    exercises:
      - id: "08d.3.1"
        type: match
        prompt: "Соедини число и цифру"
        pairs:
          - ["sedamnaest", "семнадцать (17)"]
          - ["šezdeset", "шестьдесят (60)"]
          - ["osamsto", "восемьсот (800)"]
          - ["hiljadu", "тысяча (1000)"]
          - ["dvadeset jedan", "двадцать один (21)"]
          - ["sto dvadeset", "сто двадцать (120)"]

  - id: "08d.4"
    kind: practice
    title: "Диктант"
    exercises:
      - id: "08d.4.1"
        type: listen
        say: "Petnaest."
        prompt: "Запиши, что слышишь."
        accept: ["Petnaest."]
        ru: ["Пятнадцать."]
      - id: "08d.4.2"
        type: listen
        say: "Dvadeset osam."
        prompt: "Запиши, что слышишь."
        accept: ["Dvadeset osam.", "Dvadeset i osam."]
        ru: ["Двадцать восемь."]
      - id: "08d.4.3"
        type: listen
        say: "Sto pedeset dinara."
        prompt: "Запиши, что слышишь."
        accept: ["Sto pedeset dinara."]
        ru: ["Сто пятьдесят динаров."]
      - id: "08d.4.4"
        type: listen
        say: "Pet hiljada dinara."
        prompt: "Запиши, что слышишь."
        accept: ["Pet hiljada dinara."]
        ru: ["Пять тысяч динаров."]

  - id: "08d.5"
    kind: practice
    title: "Собери"
    exercises:
      - id: "08d.5.1"
        type: word_bank
        prompt: "Собери: «двести пятьдесят динаров»"
        bank: ["Dvesta", "pedeset", "dinara", "trista"]
        accept: ["Dvesta pedeset dinara."]
      - id: "08d.5.2"
        type: word_bank
        prompt: "Собери: «семьдесят три»"
        bank: ["Sedamdeset", "tri", "trideset", "sedam", "i"]
        accept: ["Sedamdeset tri.", "Sedamdeset i tri."]

  - id: "08d.6"
    kind: practice
    title: "Переведи"
    exercises:
      - id: "08d.6.1"
        type: translate
        prompt: "Сорок два."
        accept: ["Četrdeset dva.", "Četrdeset i dva."]
      - id: "08d.6.2"
        type: translate
        prompt: "Девяносто девять."
        accept: ["Devedeset devet.", "Devedeset i devet."]
      - id: "08d.6.3"
        type: translate
        prompt: "Четыреста динаров."
        accept: ["Četiristo dinara."]
