lesson: "06"
title: "Породица"
subtitle: "семья, imam / nemam"
teaches:
  [
    porodica, mama, tata, brat, sestra, muz, zena, sin, cerka, dete,
    roditelji, baba, deda, imam,
  ]

steps:
  - id: "06.1"
    kind: teach
    title: "Семья"
    md: "06/1-porodica.md"

  - id: "06.2"
    kind: practice
    title: "Кто есть кто"
    also_ok: ["deca"]
    exercises:
      - id: "06.2.1"
        type: choice
        prompt: "«Бабушка» —"
        options: ["baba", "deda", "dete"]
        answer: "baba"
      - id: "06.2.2"
        type: choice
        prompt: "«Родители» —"
        options: ["roditelji", "deca", "porodica"]
        answer: "roditelji"
      - id: "06.2.3"
        type: match
        prompt: "Соедини"
        pairs:
          - ["mama", "мама"]
          - ["tata", "папа"]
          - ["brat", "брат"]
          - ["sestra", "сестра"]
      - id: "06.2.4"
        type: match
        prompt: "Соедини"
        pairs:
          - ["muž", "муж"]
          - ["žena", "жена"]
          - ["sin", "сын"]
          - ["ćerka", "дочь"]

  - id: "06.3"
    kind: teach
    title: "У меня есть / нет"
    md: "06/3-imam.md"

  - id: "06.4"
    kind: practice
    title: "imam / nemam"
    also_ok: ["brata", "sestru", "sina", "ženu"]
    exercises:
      - id: "06.4.1"
        type: choice
        prompt: "«У меня есть брат» —"
        options: ["Imam brata.", "Imam brat.", "Nemam brata."]
        answer: "Imam brata."
      - id: "06.4.2"
        type: choice
        prompt: "«У меня нет сестры» —"
        options: ["Nemam sestru.", "Nemam sestra.", "Imam sestru."]
        answer: "Nemam sestru."
      - id: "06.4.3"
        type: fill_blank
        prompt: "У меня есть сын: «Imam ___.»"
        accept: ["sina"]
      - id: "06.4.4"
        type: word_bank
        prompt: "Собери: «у меня есть жена»"
        bank: ["Imam", "ženu"]
        accept: ["Imam ženu."]
      - id: "06.4.5"
        type: fix_error
        prompt: "Imam brat."
        accept: ["Imam brata."]
      - id: "06.4.6"
        type: conjugate
        prompt: "imati — иметь"
        forms: ["ja", "ti", "on/ona/ono", "mi", "vi", "oni/one/ona"]
        accept:
          - ["imam"]
          - ["imaš"]
          - ["ima"]
          - ["imamo"]
          - ["imate"]
          - ["imaju"]
        meta: "nemati — так же, + nemam/nemaš/nema…"
