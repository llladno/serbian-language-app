lesson: "10"
title: "Град око мене"
subtitle: "где что, ima/nema, локатив базово, вопросы 2"
teaches:
  [
    ko, sta, koji, kakav, ciji, kuda, zasto, zato-sto, jer, zbog, naravno,
    grad, ulica, trg, park, posta, banka, bolnica, skola, fakultet,
    bioskop, pozoriste, muzej, stanica, autobus, most, reka, centar,
    raskrsnica, semafor, cosak, levo, desno, pravo, blizu, daleko, pored,
    iza, ispred, preko-puta, kod-prep, skrenuti, stici, kako-da-dodjem,
    gde-je,
  ]

steps:
  - id: "10.1"
    kind: teach
    title: "Да / нет-вопрос"
    md: "10/1-da-li.md"

  - id: "10.2"
    kind: practice
    title: "Спроси да / нет"
    exercises:
      - id: "10.2.1"
        type: choice
        prompt: "«У вас есть вода?» (literary) —"
        options: ["Da li imate vodu?", "Li imate vodu?", "Imate vodu li?"]
        answer: "Da li imate vodu?"
      - id: "10.2.2"
        type: choice
        prompt: "То же самое, разговорно —"
        options: ["Jel' imate vodu?", "Jel imate li vodu?", "Da imate vodu?"]
        answer: "Jel' imate vodu?"
      - id: "10.2.3"
        type: fill_blank
        prompt: "«Далеко ли?» → Da ___ je daleko?"
        accept: ["li"]
      - id: "10.2.4"
        type: word_bank
        prompt: "Собери: «работает ли в воскресенье?»"
        bank: ["Da", "li", "radi", "u", "nedelju"]
        accept: ["Da li radi u nedelju?"]

  - id: "10.3"
    kind: teach
    title: "Вопросительные слова"
    md: "10/3-upitne-reci.md"

  - id: "10.4"
    kind: practice
    title: "Какое слово"
    exercises:
      - id: "10.4.1"
        type: choice
        prompt: "«___ ты идёшь?» (направление)"
        options: ["Kuda", "Gde", "Ko"]
        answer: "Kuda"
      - id: "10.4.2"
        type: choice
        prompt: "«___ это?» (о человеке)"
        options: ["Ko je to?", "Šta je to?", "Gde je to?"]
        answer: "Ko je to?"
      - id: "10.4.3"
        type: match
        prompt: "Соедини"
        pairs:
          - ["ko", "кто"]
          - ["šta", "что"]
          - ["gde", "где"]
          - ["kada", "когда"]
      - id: "10.4.4"
        type: fill_blank
        prompt: "«Что ты делаешь?» → ___ radiš?"
        accept: ["šta", "Šta"]

  - id: "10.5"
    kind: teach
    title: "koji / kakav / čiji"
    md: "10/5-koji-kakav-ciji.md"

  - id: "10.6"
    kind: practice
    title: "koji или kakav"
    also_ok: ["koja", "kakvo"]
    exercises:
      - id: "10.6.1"
        type: choice
        prompt: "«___ автобус идёт в центр?» (выбор из ряда)"
        options: ["Koji", "Kakav", "Čiji"]
        answer: "Koji"
      - id: "10.6.2"
        type: choice
        prompt: "«___ погода?» (свойство)"
        options: ["Kakvo je vreme?", "Koje je vreme?", "Čije je vreme?"]
        answer: "Kakvo je vreme?"
      - id: "10.6.3"
        type: fill_blank
        prompt: "«Чей это ключ?» → ___ je ovo ključ?"
        accept: ["čiji", "Čiji"]
      - id: "10.6.4"
        type: word_bank
        prompt: "Собери: «какая это улица?»"
        bank: ["Koja", "je", "ovo", "ulica"]
        accept: ["Koja je ovo ulica?"]

  - id: "10.7"
    kind: teach
    title: "Почему / потому что"
    md: "10/7-zasto-jer.md"

  - id: "10.8"
    kind: practice
    title: "Почему"
    also_ok: ["kiše"]
    exercises:
      - id: "10.8.1"
        type: choice
        prompt: "«Почему не работаешь?» —"
        options: ["Zašto ne radiš?", "Zato što ne radiš?", "Jer ne radiš?"]
        answer: "Zašto ne radiš?"
      - id: "10.8.2"
        type: choice
        prompt: "«Потому что воскресенье» —"
        options: ["Zato što je nedelja.", "Zašto je nedelja.", "Zbog je nedelja."]
        answer: "Zato što je nedelja."
      - id: "10.8.3"
        type: fill_blank
        prompt: "«Не иду, потому что идёт дождь» → Ne idem ___ pada kiša."
        accept: ["jer"]
      - id: "10.8.4"
        type: word_bank
        prompt: "Собери: «из-за дождя» (+ сущ.)"
        bank: ["zbog", "kiše"]
        accept: ["zbog kiše"]

  - id: "10.9"
    kind: teach
    title: "Не понял"
    md: "10/9-ne-razumem.md"

  - id: "10.10"
    kind: practice
    title: "Переспрос"
    also_ok: ["ponovite", "razumeo", "sporije", "brzo"]
    exercises:
      - id: "10.10.1"
        type: choice
        prompt: "Не расслышал — просишь повторить —"
        options: ["Možete ponoviti?", "Možete sporije ponoviti li?", "Ponoviti možete da?"]
        answer: "Možete ponoviti?"
      - id: "10.10.2"
        type: choice
        prompt: "«Можно медленнее?» —"
        options: ["Možete sporije, molim vas?", "Možete brzo, molim vas?", "Sporije možete li da vas?"]
        answer: "Možete sporije, molim vas?"
      - id: "10.10.3"
        type: match
        prompt: "Соедини"
        pairs:
          - ["Molim?", "что-что?"]
          - ["Nisam razumeo.", "я не понял"]
          - ["Šta znači?", "что значит?"]
          - ["Kako se kaže?", "как будет?"]
      - id: "10.10.4"
        type: fill_blank
        prompt: "«Я не понял» → Nisam ___."
        accept: ["razumeo"]

  - id: "10.11"
    kind: teach
    title: "Город"
    md: "10/11-grad.md"

  - id: "10.12"
    kind: practice
    title: "Что где"
    also_ok: ["trgu", "autobusom"]
    exercises:
      - id: "10.12.1"
        type: choice
        prompt: "«остановка» —"
        options: ["stanica", "raskrsnica", "semafor"]
        answer: "stanica"
      - id: "10.12.2"
        type: choice
        prompt: "«я еду в центр на автобусе» —"
        options: ["Idem u centar autobusom.", "Idem u centar autobus.", "Idem centar u autobusom."]
        answer: "Idem u centar autobusom."
      - id: "10.12.3"
        type: match
        prompt: "Соедини"
        pairs:
          - ["pošta", "почта"]
          - ["banka", "банк"]
          - ["most", "мост"]
          - ["park", "парк"]
      - id: "10.12.4"
        type: fill_blank
        prompt: "«почта на площади» → Pošta je na ___."
        accept: ["trgu"]

  - id: "10.13"
    kind: teach
    title: "Как пройти"
    md: "10/13-kako-da-dodjem.md"

  - id: "10.14"
    kind: practice
    title: "Направление"
    also_ok: ["skrenite", "poste", "stanice", "banke"]
    exercises:
      - id: "10.14.1"
        type: choice
        prompt: "«Извините, где почта?» —"
        options: ["Izvinite, gde je pošta?", "Izvinite, gde pošta je?", "Izvinite, pošta gde?"]
        answer: "Izvinite, gde je pošta?"
      - id: "10.14.2"
        type: choice
        prompt: "«Поверните налево» —"
        options: ["Skrenite levo.", "Skrenite pravo.", "Idite levo skrenite."]
        answer: "Skrenite levo."
      - id: "10.14.3"
        type: match
        prompt: "Соедини"
        pairs:
          - ["levo", "налево"]
          - ["desno", "направо"]
          - ["pravo", "прямо"]
          - ["blizu", "близко"]
      - id: "10.14.4"
        type: word_bank
        prompt: "Собери: «как пройти к остановке?»"
        bank: ["Kako", "da", "dođem", "do", "stanice"]
        accept: ["Kako da dođem do stanice?"]

  - id: "10.15"
    kind: reading
    title: "Спрашиваю дорогу"
    md: "10/15-citanje.md"
    also_ok: ["poste", "skrenite", "banke", "ovom", "ulicom", "raskrsnice", "minuta", "nedeljom", "subotom", "puno"]
    exercises:
      - id: "10.15.1"
        type: choice
        prompt: "Далеко ли до почты?"
        options: ["Ne, pet minuta.", "Da, daleko je.", "Ne radi danas."]
        answer: "Ne, pet minuta."
      - id: "10.15.2"
        type: choice
        prompt: "Когда работает почта?"
        options: ["Radnim danima i subotom.", "Samo nedeljom.", "Svaki dan."]
        answer: "Radnim danima i subotom."

  - id: "10.16"
    kind: practice
    title: "Диктант"
    mixed: true
    exercises:
      - id: "10.16.1"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "Gde je stanica?"
        accept: ["Gde je stanica?"]
      - id: "10.16.2"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "Da li je daleko?"
        accept: ["Da li je daleko?"]
      - id: "10.16.3"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "Skrenite levo."
        accept: ["Skrenite levo."]

  - id: "10.17"
    kind: checkpoint
    title: "Проверка"
    also_ok: ["banke", "stanice"]
    exercises:
      - id: "10.17.1"
        type: choice
        prompt: "«У вас есть вода?» (разговорно) —"
        options: ["Jel' imate vodu?", "Li imate vodu?", "Vodu imate da?"]
        answer: "Jel' imate vodu?"
      - id: "10.17.2"
        type: match
        prompt: "Соедини"
        pairs:
          - ["ko", "кто"]
          - ["zašto", "почему"]
          - ["pošta", "почта"]
          - ["desno", "направо"]
      - id: "10.17.3"
        type: fill_blank
        prompt: "«Не иду, потому что дождь» → Ne idem ___ pada kiša."
        accept: ["jer"]
      - id: "10.17.4"
        type: word_bank
        prompt: "Собери: «где банк?»"
        bank: ["Gde", "je", "banka"]
        accept: ["Gde je banka?"]
      - id: "10.17.5"
        type: translate
        prompt: "Извините, где почта?"
        accept: ["Izvinite, gde je pošta?"]
      - id: "10.17.6"
        type: free
        prompt: "Останови прохожего и спроси дорогу до рынка, уточни, далеко ли — 3–4 фразы."
        sample: "Izvinite, kako da dođem do pijace? Da li je daleko? Hvala vam puno!"

  - id: "10.18"
    kind: dialogue
    title: "Где је станица"
    scene: "Ты вышел не на той остановке и ищешь автобусную станцию. Спрашиваешь прохожую."
    voice: f
    also_ok: ["autobuska", "semafora", "pošte", "idite"]
    turns:
      - who: me
        sr: "Izvinite, gde je autobuska stanica?"
        ru: "Извините, где автобусная станция?"
        exercise:
          id: "10.18.1"
          type: choice
          prompt: "Вежливо спроси, где автобусная станция"
          options:
            - "Izvinite, gde je autobuska stanica?"
            - "Izvinite, kada je autobuska stanica?"
            - "Izvinite, kako je autobuska stanica?"
          answer: "Izvinite, gde je autobuska stanica?"
          explain: "«gde» — про место. «kada» — про время, «kako» — про способ."

      - who: npc
        sr: "Idite pravo do semafora, pa levo."
        ru: "Идите прямо до светофора, потом налево."

      - who: me
        sr: "Pravo, pa levo?"
        ru: "Прямо, потом налево?"
        exercise:
          id: "10.18.2"
          type: fill_blank
          prompt: "Pravo, pa ___?"
          accept: ["levo"]
          explain: "Повторить услышанное — лучший способ проверить, что понял правильно."

      - who: npc
        sr: "Da. Ulica desno, kod pošte."
        ru: "Да. Улица направо, у почты."

      - who: me
        sr: "Je li daleko?"
        ru: "Это далеко?"
        exercise:
          id: "10.18.3"
          type: choice
          prompt: "Спроси, далеко ли это"
          options:
            - "Je li daleko?"
            - "Je li blizu pošta?"
            - "Je li levo?"
          answer: "Je li daleko?"

      - who: npc
        sr: "Ne, blizu je."
        ru: "Нет, близко."

      - who: me
        sr: "Hvala! Doviđenja!"
        ru: "Спасибо! До свидания!"
        exercise:
          id: "10.18.4"
          type: translate
          prompt: "Поблагодари и попрощайся"
          accept: ["Hvala! Doviđenja!", "Hvala, doviđenja!", "Hvala. Doviđenja."]

      - who: npc
        sr: "Nema na čemu. Prijatno!"
        ru: "Не за что. Всего доброго!"
