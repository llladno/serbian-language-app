lesson: "10"
title: "Сати и телефон"
subtitle: "часы, телефон, текст, проверка"
teaches:
  [
    sat, koliko-je-sati, u-koliko-sati, pola-sata, podne, ponoc, ujutru,
    popodne, uvece, tacno,
  ]

steps:
  - id: "10.1"
    kind: teach
    title: "Который час"
    md: "10/1-sati.md"

  - id: "10.2"
    kind: practice
    title: "Сколько времени"
    exercises:
      - id: "10.2.1"
        type: choice
        prompt: "«Который час?» —"
        options: ["Koliko je sati?", "U koliko sati?", "Koliko košta?"]
        answer: "Koliko je sati?"
      - id: "10.2.2"
        type: choice
        prompt: "«Во сколько?» —"
        options: ["U koliko sati?", "Koliko je sati?", "Koliko sati imaš?"]
        answer: "U koliko sati?"
      - id: "10.2.3"
        type: match
        prompt: "Соедини время и запись"
        pairs:
          - ["pola tri", "половина третьего"]
          - ["tri i petnaest", "четверть четвёртого"]
          - ["podne", "полдень"]
          - ["ponoć", "полночь"]
      - id: "10.2.4"
        type: fill_blank
        prompt: "«полдень» по-сербски — ___"
        accept: ["podne"]
      - id: "10.2.5"
        type: word_bank
        prompt: "Собери: «во сколько?»"
        bank: ["U", "koliko", "sati"]
        accept: ["U koliko sati?"]

  - id: "10.3"
    kind: teach
    title: "Телефон"
    md: "10/3-telefon.md"

  - id: "10.4"
    kind: practice
    title: "Номер и связь"
    also_ok: ["koji", "gde"]
    exercises:
      - id: "10.4.1"
        type: choice
        prompt: "«Напиши / позвони мне» —"
        options: ["Javi mi se.", "Javiću ti se.", "Koji je broj?"]
        answer: "Javi mi se."
      - id: "10.4.2"
        type: choice
        prompt: "«Какой у тебя номер?» —"
        options: ["Koji je tvoj broj?", "Koliko je broj?", "Gde je broj?"]
        answer: "Koji je tvoj broj?"
      - id: "10.4.3"
        type: fill_blank
        prompt: "«Пришлю тебе сообщение» → Poslaću ti ___."
        accept: ["poruku"]
      - id: "10.4.4"
        type: word_bank
        prompt: "Собери: «напиши мне»"
        bank: ["Javi", "mi", "se"]
        accept: ["Javi mi se."]

  - id: "10.5"
    kind: reading
    title: "В пекаре"
    md: "10/5-citanje.md"
    exercises:
      - id: "10.5.1"
        type: choice
        prompt: "Сколько стоит один кофе?"
        options: ["Sto pedeset dinara.", "Trista dinara.", "Sto dinara."]
        answer: "Sto pedeset dinara."
      - id: "10.5.2"
        type: choice
        prompt: "Чем платит покупатель?"
        options: ["Karticom.", "Kešom.", "Sitno."]
        answer: "Karticom."

  - id: "10.6"
    kind: practice
    title: "Диктант"
    mixed: true
    exercises:
      - id: "10.6.1"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "Koliko košta?"
        accept: ["Koliko košta?"]
      - id: "10.6.2"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "Imam trideset godina."
        accept: ["Imam trideset godina."]
      - id: "10.6.3"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "U koliko sati?"
        accept: ["U koliko sati?"]

  - id: "10.7"
    kind: checkpoint
    title: "Проверка"
    also_ok: ["kafe", "kafu"]
    exercises:
      - id: "10.7.1"
        type: choice
        prompt: "«8» —"
        options: ["osam", "sedam", "šest"]
        answer: "osam"
      - id: "10.7.2"
        type: match
        prompt: "Соедини"
        pairs:
          - ["sedam", "семь"]
          - ["dvanaest", "двенадцать"]
          - ["trideset", "тридцать"]
          - ["sto", "сто"]
      - id: "10.7.3"
        type: fill_blank
        prompt: "«мне 25 лет» → Imam dvadeset pet ___."
        accept: ["godina"]
      - id: "10.7.4"
        type: word_bank
        prompt: "Собери: «сколько стоит кофе?»"
        bank: ["Koliko", "košta", "kafa"]
        accept: ["Koliko košta kafa?"]
      - id: "10.7.5"
        type: translate
        prompt: "Сколько с меня?"
        accept: ["Koliko dugujem?"]
      - id: "10.7.6"
        type: free
        prompt: "Ты в пекаре: спроси цену кофе, скажи, сколько тебе лет, и спроси который час — 3 фразы."
        sample: "Koliko košta kafa? Imam trideset godina. Koliko je sati?"
