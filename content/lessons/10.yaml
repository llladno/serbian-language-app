lesson: "10"
title: "Который час (Koliko je sati?)"
subtitle: "часы, во сколько, утро и вечер"
teaches: [sat, koliko-je-sati, tacno, podne, ponoc, u-koliko-sati, sutra, ujutru, popodne, uvece]

steps:
  - id: "10.11"
    kind: teach
    title: "Который час?"
    md: "10/11-koliko-je-sati.md"

  - id: "10.12"
    kind: practice
    title: "Запомним: Который час?"
    exercises:
      - id: "10.12.1"
        type: choice
        prompt: "«Который час?» —"
        options: ["Koliko je sati?", "Koliko košta?", "Koliko imaš godina?"]
        answer: "Koliko je sati?"

  - id: "10.13"
    kind: teach
    title: "Ровно, полдень, полночь"
    md: "10/13-tacno-podne.md"

  - id: "10.14"
    kind: practice
    title: "Запомним: Ровно, полдень, полночь"
    exercises:
      - id: "10.14.1"
        type: choice
        prompt: "«Полдень» —"
        options: ["podne", "ponoć", "tačno"]
        answer: "podne"

  - id: "10.15"
    kind: teach
    title: "Во сколько?"
    md: "10/15-u-koliko-sati.md"

  - id: "10.16"
    kind: practice
    title: "Запомним: Во сколько?"
    exercises:
      - id: "10.16.1"
        type: choice
        prompt: "«Во сколько?» —"
        options: ["U koliko sati?", "Koliko je sati?", "Koliko košta?"]
        answer: "U koliko sati?"

  - id: "10.17"
    kind: teach
    title: "Утром, днём, вечером"
    md: "10/17-ujutru.md"

  - id: "10.18"
    kind: practice
    title: "Запомним: Утром, днём, вечером"
    exercises:
      - id: "10.18.1"
        type: choice
        prompt: "«В восемь вечера» —"
        options: ["U osam uveče.", "U osam ujutru.", "U osam popodne."]
        answer: "U osam uveče."

  - id: "10.19"
    kind: teach
    title: "С … до …"
    md: "10/19-od-do.md"

  - id: "10.20"
    kind: practice
    title: "Запомним: С … до …"
    exercises:
      - id: "10.20.1"
        type: choice
        prompt: "«С восьми до пяти» —"
        options: ["Od osam do pet.", "Od pet do osam.", "U osam ujutru."]
        answer: "Od osam do pet."

  - id: "10.21"
    kind: practice
    title: "Послушай и выбери"
    exercises:
      - id: "10.21.1"
        type: choice
        say: "Koliko je sati?"
        prompt: "Послушай и выбери перевод."
        options: ["Который час?", "Во сколько?", "Сколько стоит?"]
        answer: "Который час?"
      - id: "10.21.2"
        type: choice
        say: "Tri sata."
        prompt: "Послушай и выбери перевод."
        options: ["Три часа.", "Тридцать часов.", "Пять часов."]
        answer: "Три часа."
      - id: "10.21.3"
        type: choice
        say: "U sedam ujutru."
        prompt: "Послушай и выбери перевод."
        options: ["В семь утра.", "В семь вечера.", "В восемь утра."]
        answer: "В семь утра."
      - id: "10.21.4"
        type: choice
        say: "Tačno podne."
        prompt: "Послушай и выбери перевод."
        options: ["Ровно полдень.", "Ровно полночь.", "Ровно пять часов."]
        answer: "Ровно полдень."
      - id: "10.21.5"
        type: choice
        say: "Sutra u sedam."
        prompt: "Послушай и выбери перевод."
        options: ["Завтра в семь.", "Утром в семь.", "Сегодня в семь."]
        answer: "Завтра в семь."

  - id: "10.22"
    kind: practice
    title: "Что скажешь?"
    exercises:
      - id: "10.22.1"
        type: choice
        prompt: "«Ровно пять часов» —"
        options: ["Tačno pet sati.", "Tačno podne.", "Tačno ponoć."]
        answer: "Tačno pet sati."
      - id: "10.22.2"
        type: choice
        prompt: "«Два часа» —"
        options: ["Dva sata.", "Dva sati.", "Dva sat."]
        answer: "Dva sata."
      - id: "10.22.3"
        type: choice
        prompt: "«В полночь» —"
        options: ["U ponoć.", "U podne.", "U osam."]
        answer: "U ponoć."

  - id: "10.23"
    kind: practice
    title: "Соедини"
    exercises:
      - id: "10.23.1"
        type: match
        prompt: "Соедини слово и перевод"
        pairs:
          - ["Koliko je sati?", "Который час?"]
          - ["U koliko sati?", "Во сколько?"]
          - ["podne", "полдень"]
          - ["ponoć", "полночь"]
          - ["ujutru", "утром"]
          - ["uveče", "вечером"]

  - id: "10.24"
    kind: practice
    title: "Собери"
    exercises:
      - id: "10.24.1"
        type: word_bank
        prompt: "Собери: «во сколько?»"
        bank: ["U", "koliko", "sati", "je"]
        accept: ["U koliko sati?"]
      - id: "10.24.2"
        type: word_bank
        prompt: "Собери: «в семь утра»"
        bank: ["U", "sedam", "ujutru", "uveče"]
        accept: ["U sedam ujutru."]

  - id: "10.25"
    kind: practice
    title: "Напиши"
    exercises:
      - id: "10.25.1"
        type: fill_blank
        prompt: "«Который час?» → Koliko je ___?"
        accept: ["sati"]
      - id: "10.25.2"
        type: fill_blank
        prompt: "«В полдень» → U ___."
        accept: ["podne"]
      - id: "10.25.3"
        type: translate
        prompt: "Который час?"
        accept: ["Koliko je sati?"]
      - id: "10.25.4"
        type: translate
        prompt: "В пять дня."
        accept: ["U pet popodne."]
