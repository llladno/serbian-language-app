lesson: "15"
title: "Проверка уровня 2 (Provera)"
subtitle: "семья, числа, цена, время, магазин"
teaches: []

steps:
  - id: "15.11"
    kind: practice
    title: "Послушай и выбери"
    mixed: true
    exercises:
      - id: "15.11.1"
        type: choice
        say: "Imam brata i sestru."
        prompt: "Послушай и выбери перевод."
        options: ["У меня есть брат и сестра.", "У меня нет брата.", "Это мой брат."]
        answer: "У меня есть брат и сестра."
      - id: "15.11.2"
        type: choice
        say: "Dvesta pedeset dinara."
        prompt: "Послушай и выбери перевод."
        options: ["Двести пятьдесят динаров.", "Двести пятнадцать динаров.", "Триста пятьдесят динаров."]
        answer: "Двести пятьдесят динаров."
      - id: "15.11.3"
        type: choice
        say: "Pola osam."
        prompt: "Послушай и выбери перевод."
        options: ["Половина восьмого (7:30).", "Без пятнадцати восемь (7:45).", "Восемь часов (8:00)."]
        answer: "Половина восьмого (7:30)."
      - id: "15.11.4"
        type: choice
        say: "Mogu li da vratim?"
        prompt: "Послушай и выбери перевод."
        options: ["Могу вернуть?", "Могу поменять?", "Можно картой?"]
        answer: "Могу вернуть?"

  - id: "15.12"
    kind: reading
    title: "В пекарне очередь"
    md: "15/12-pekara.md"
    exercises:
      - id: "15.12.1"
        type: choice
        prompt: "Сколько стоят хлеб и молоко?"
        options: ["Сто десять динаров", "Сто динаров", "Двести десять динаров"]
        answer: "Сто десять динаров"
      - id: "15.12.2"
        type: choice
        prompt: "Чем платит покупатель?"
        options: ["Наличными, без сдачи", "Картой", "Он ничего не платит"]
        answer: "Наличными, без сдачи"

  - id: "15.13"
    kind: checkpoint
    title: "Большая проверка"
    exercises:
      - id: "15.13.1"
        type: choice
        prompt: "«Мой папа» —"
        options: ["moj tata", "moja tata", "moje tata"]
        answer: "moj tata"
      - id: "15.13.2"
        type: choice
        prompt: "«У меня нет сестры» —"
        options: ["Nemam sestre.", "Imam sestru.", "Nemam brata."]
        answer: "Nemam sestre."
      - id: "15.13.3"
        type: match
        prompt: "Соедини число и слово"
        pairs:
          - ["sedam", "семь"]
          - ["petnaest", "пятнадцать"]
          - ["trideset", "тридцать"]
          - ["dvesta", "двести"]
      - id: "15.13.4"
        type: choice
        prompt: "«Мне 22 года» —"
        options: ["Imam dvadeset dve godine.", "Imam dvadeset dve godina.", "Imam dvadeset dve godinu."]
        answer: "Imam dvadeset dve godine."
      - id: "15.13.5"
        type: choice
        prompt: "2:30 —"
        options: ["pola tri", "pola dva", "tri i petnaest"]
        answer: "pola tri"
      - id: "15.13.6"
        type: match
        prompt: "Соедини магазин и перевод"
        pairs:
          - ["pekara", "пекарня"]
          - ["apoteka", "аптека"]
          - ["pijaca", "рынок"]
          - ["prodavnica", "магазин"]
      - id: "15.13.7"
        type: word_bank
        prompt: "Собери: «сколько стоит кофе?»"
        bank: ["Koliko", "košta", "kafa", "dugujem"]
        accept: ["Koliko košta kafa?"]
      - id: "15.13.8"
        type: fill_blank
        prompt: "«Это всё» → To je ___."
        accept: ["sve"]
      - id: "15.13.9"
        type: fill_blank
        prompt: "«Наличными или картой?» → Kešom ___ karticom?"
        accept: ["ili"]
      - id: "15.13.10"
        type: translate
        prompt: "Мне нужен хлеб."
        accept: ["Treba mi hleb."]
      - id: "15.13.11"
        type: translate
        prompt: "Сколько с меня?"
        accept: ["Koliko dugujem?"]
      - id: "15.13.12"
        type: translate
        prompt: "Какой у тебя номер телефона?"
        accept: ["Koji je tvoj broj telefona?"]

  - id: "15.14"
    kind: dialogue
    title: "Первый день"
    scene: "Ты только приехал и снял квартиру. Хозяин, Марко, встречает тебя у подъезда, чтобы отдать ключи."
    voice: m
    turns:
      - who: npc
        sr: "Dobar dan! Vi ste iz Rusije?"
        ru: "Добрый день! Вы из России?"

      - who: me
        sr: "Dobar dan. Da, ja sam iz Rusije."
        ru: "Добрый день. Да, я из России."
        exercise:
          id: "15.14.1"
          type: choice
          prompt: "Поздоровайся и подтверди, что ты из России"
          options: ["Dobar dan. Da, ja sam iz Rusije.", "Dobro veče. Da, ja sam iz Rusije.", "Dobar dan. Ne, ja sam iz Rusije."]
          answer: "Dobar dan. Da, ja sam iz Rusije."

      - who: npc
        sr: "Drago mi je. Ja sam Marko."
        ru: "Приятно познакомиться. Я Марко."

      - who: me
        sr: "Drago mi je takođe."
        ru: "Мне тоже приятно."
        exercise:
          id: "15.14.2"
          type: choice
          prompt: "Ответь вежливо"
          options: ["Drago mi je takođe.", "Nema na čemu.", "Ne žalim se."]
          answer: "Drago mi je takođe."

      - who: npc
        sr: "Evo, ovo je za vas."
        ru: "Вот, это вам."

      - who: me
        sr: "Hvala. Koliko dugujem?"
        ru: "Спасибо. Сколько с меня?"
        exercise:
          id: "15.14.3"
          hint: "Сначала «спасибо», потом вопрос из урока про цену: нужное слово там кончалось на -ujem."
          type: translate
          prompt: "Поблагодари и спроси, сколько с тебя"
          accept: ["Hvala. Koliko dugujem?", "Hvala, koliko dugujem?", "Koliko dugujem?"]
          explain: "«Koliko dugujem?» — «сколько я должен»: так спрашивают и в кафе, и при оплате жилья."

      - who: npc
        sr: "Pet hiljada dinara."
        ru: "Пять тысяч динаров."

      - who: me
        sr: "Može karticom?"
        ru: "Можно картой?"
        exercise:
          id: "15.14.4"
          type: choice
          prompt: "Спроси, можно ли картой"
          options: ["Može karticom?", "Može kešom?", "Koliko je sati?"]
          answer: "Može karticom?"

      - who: npc
        sr: "Ne, samo keš."
        ru: "Нет, только наличные."

      - who: me
        sr: "Dobro. Izvolite."
        ru: "Хорошо. Вот, пожалуйста."
        exercise:
          id: "15.14.5"
          type: choice
          prompt: "Согласись и протяни деньги"
          options: ["Dobro. Izvolite.", "Dobro. Molim?", "Dobro. Doviđenja."]
          answer: "Dobro. Izvolite."
          explain: "«Izvolite» — «пожалуйста, вот»: так протягивают деньги или вещь (и ещё «слушаю вас» — когда спрашивают). «Molim?» — «что, простите?», а «doviđenja» — «до свидания»: здесь они не подходят."

      - who: npc
        sr: "Hvala. Vidimo se sutra u pet?"
        ru: "Спасибо. Увидимся завтра в пять?"

      - who: me
        sr: "Da, sutra u pet. Doviđenja!"
        ru: "Да, завтра в пять. До свидания!"
        exercise:
          id: "15.14.6"
          type: fill_blank
          prompt: "Da, sutra ___ pet. Doviđenja!"
          accept: ["u"]
          explain: "Время — с предлогом «u»: u pet, u osam, u podne."

      - who: npc
        sr: "Prijatno!"
        ru: "Всего доброго!"
