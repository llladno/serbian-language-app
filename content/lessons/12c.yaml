lesson: "12c"
title: "Повторение: в магазине (Ponavljanje)"
subtitle: "заказать, взвесить, заплатить"
teaches: []

steps:
  - id: "12c.1"
    kind: practice
    title: "Послушай и выбери"
    also_ok: ["sira", "karticom"]
    exercises:
      - id: "12c.1.1"
        type: choice
        say: "Dajte mi pola kile sira."
        prompt: "Послушай и выбери перевод."
        options: ["Дайте мне полкило сыра.", "Мне нужно кило сыра.", "У вас есть сыр?"]
        answer: "Дайте мне полкило сыра."
      - id: "12c.1.2"
        type: choice
        say: "Koliko dugujem?"
        prompt: "Послушай и выбери перевод."
        options: ["Сколько с меня?", "Сколько стоит?", "Сколько всё вместе?"]
        answer: "Сколько с меня?"
      - id: "12c.1.3"
        type: choice
        say: "Kešom ili karticom?"
        prompt: "Послушай и выбери перевод."
        options: ["Наличными или картой?", "Мелочь есть?", "Чек нужен?"]
        answer: "Наличными или картой?"

  - id: "12c.2"
    kind: reading
    title: "В кафе"
    md: "12c/2-kafa.md"
    exercises:
      - id: "12c.2.1"
        type: choice
        prompt: "Сколько стоит кофе?"
        options: ["Сто пятьдесят динаров", "Сто динаров", "Триста динаров"]
        answer: "Сто пятьдесят динаров"
      - id: "12c.2.2"
        type: choice
        prompt: "Чем платит покупатель?"
        options: ["Картой", "Наличными", "Мелочью"]
        answer: "Картой"

  - id: "12c.3"
    kind: practice
    title: "Соедини"
    also_ok: ["sira"]
    exercises:
      - id: "12c.3.1"
        type: match
        prompt: "Соедини фразу и перевод"
        pairs:
          - ["Treba mi hleb", "Мне нужен хлеб"]
          - ["Kilo sira, molim", "Кило сыра, пожалуйста"]
          - ["Još nešto?", "Ещё что-нибудь?"]
          - ["To je sve", "Это всё"]
          - ["Kešom ili karticom?", "Наличными или картой?"]
          - ["Račun, molim", "Чек, пожалуйста"]

  - id: "12c.4"
    kind: practice
    title: "Диктант"
    also_ok: ["sira", "karticom"]
    exercises:
      - id: "12c.4.1"
        type: listen
        say: "Dajte mi jednu kafu, molim."
        prompt: "Запиши, что слышишь."
        accept: ["Dajte mi jednu kafu, molim."]
        ru: ["Дайте мне один кофе, пожалуйста."]
      - id: "12c.4.2"
        type: listen
        say: "To je sve. Koliko dugujem?"
        prompt: "Запиши, что слышишь."
        accept: ["To je sve. Koliko dugujem?"]
        ru: ["Это всё. Сколько с меня?"]
      - id: "12c.4.3"
        type: listen
        say: "Kešom ili karticom?"
        prompt: "Запиши, что слышишь."
        accept: ["Kešom ili karticom?"]
        ru: ["Наличными или картой?"]

  - id: "12c.5"
    kind: practice
    title: "Собери"
    also_ok: ["sira", "karticom"]
    exercises:
      - id: "12c.5.1"
        type: word_bank
        prompt: "Собери: «дайте мне полкило сыра»"
        bank: ["Dajte", "mi", "pola", "kile", "sira", "sir"]
        accept: ["Dajte mi pola kile sira."]
      - id: "12c.5.2"
        type: word_bank
        prompt: "Собери: «наличными или картой?»"
        bank: ["Kešom", "ili", "karticom", "račun"]
        accept: ["Kešom ili karticom?"]

  - id: "12c.6"
    kind: practice
    title: "Переведи"
    also_ok: ["karticom"]
    exercises:
      - id: "12c.6.1"
        type: translate
        prompt: "Это всё. Сколько с меня?"
        accept: ["To je sve. Koliko dugujem?", "To je sve, koliko dugujem?"]
      - id: "12c.6.2"
        type: translate
        prompt: "Картой."
        accept: ["Karticom."]
      - id: "12c.6.3"
        type: translate
        prompt: "У вас есть мелочь?"
        accept: ["Imate li sitno?", "Da li imate sitno?"]

  - id: "12c.7"
    kind: dialogue
    title: "В пекарне"
    scene: "Утро, ты заходишь в пекарню за хлебом. За прилавком продавщица."
    voice: f
    also_ok: ["karticom"]
    turns:
      - who: npc
        sr: "Dobar dan, izvolite?"
        ru: "Добрый день, слушаю вас?"

      - who: me
        sr: "Dobar dan. Treba mi hleb."
        ru: "Добрый день. Мне нужен хлеб."
        exercise:
          id: "12c.7.1"
          type: choice
          prompt: "Поздоровайся и скажи, что тебе нужен хлеб"
          options: ["Dobar dan. Treba mi hleb.", "Dobar dan. Samo gledam.", "Dobro veče. Treba mi hleb."]
          answer: "Dobar dan. Treba mi hleb."

      - who: npc
        sr: "Imamo hleb. Koliko komada?"
        ru: "Хлеб есть. Сколько штук?"

      - who: me
        sr: "Dva komada, molim."
        ru: "Две штуки, пожалуйста."
        exercise:
          id: "12c.7.2"
          type: choice
          prompt: "Скажи, что тебе нужно две штуки"
          options: ["Dva komada, molim.", "Dva kilo, molim.", "Jedno pakovanje, molim."]
          answer: "Dva komada, molim."

      - who: npc
        sr: "Još nešto?"
        ru: "Ещё что-нибудь?"

      - who: me
        sr: "To je sve. Koliko dugujem?"
        ru: "Это всё. Сколько с меня?"
        exercise:
          id: "12c.7.3"
          type: choice
          prompt: "Скажи, что это всё, и спроси, сколько с тебя"
          options: ["To je sve. Koliko dugujem?", "To je sve. Koliko košta kafa?", "Još ovo. Koliko dugujem?"]
          answer: "To je sve. Koliko dugujem?"

      - who: npc
        sr: "Sto dvadeset dinara. Kešom ili karticom?"
        ru: "Сто двадцать динаров. Наличными или картой?"

      - who: me
        sr: "Karticom."
        ru: "Картой."
        exercise:
          id: "12c.7.4"
          type: choice
          prompt: "Скажи, что платишь картой"
          options: ["Karticom.", "Kešom.", "Ne treba, hvala."]
          answer: "Karticom."

      - who: npc
        sr: "Izvolite račun. Prijatno!"
        ru: "Вот чек. Всего доброго!"
