lesson: "03"
title: "Молим, хвала"
subtitle: "вежливые слова, текст, диктант, проверка"
teaches:
  [molim, molim-vas, hvala, nema-na-cemu, izvini, oprosti, izvolite, nema-problema]

steps:
  - id: "03.1"
    kind: teach
    title: "Вежливые слова"
    md: "03/1-vezljivost.md"

  - id: "03.2"
    kind: practice
    title: "Спасибо, извините"
    exercises:
      - id: "03.2.1"
        type: choice
        prompt: "Тебе сказали «Hvala». Отвечаешь —"
        options: ["Nema na čemu.", "Molim vas.", "Prijatno."]
        answer: "Nema na čemu."
      - id: "03.2.2"
        type: word_bank
        prompt: "Собери просьбу: «извините, пожалуйста»"
        bank: ["Izvinite", "molim", "vas"]
        accept: ["Izvinite, molim vas."]
      - id: "03.2.3"
        type: word_bank
        prompt: "Собери: «без проблем»"
        bank: ["Nema", "problema"]
        accept: ["Nema problema."]

  - id: "03.3"
    kind: reading
    title: "Встретил знакомого"
    md: "03/3-citanje.md"
    exercises:
      - id: "03.3.1"
        type: choice
        prompt: "Как Марко отвечает на «Kako si?»"
        options: ["Dobro, hvala.", "Laku noć.", "Odakle si?"]
        answer: "Dobro, hvala."
      - id: "03.3.2"
        type: choice
        prompt: "Чем заканчивается разговор?"
        options: ["Ćao, prijatno!", "Dobro jutro!", "Molim?"]
        answer: "Ćao, prijatno!"

  - id: "03.4"
    kind: practice
    title: "Диктант"
    mixed: true
    exercises:
      - id: "03.4.1"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "Dobar dan, kako ste?"
        accept: ["Dobar dan, kako ste?"]
      - id: "03.4.2"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "Drago mi je."
        accept: ["Drago mi je."]
      - id: "03.4.3"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "Hvala, prijatno!"
        accept: ["Hvala, prijatno!"]

  - id: "03.5"
    kind: checkpoint
    title: "Проверка"
    exercises:
      - id: "03.5.1"
        type: choice
        prompt: "«Спасибо большое» —"
        options: ["Hvala lepo!", "Laku noć!", "Kako ide?"]
        answer: "Hvala lepo!"
      - id: "03.5.2"
        type: match
        prompt: "Соедини"
        pairs:
          - ["Zdravo", "Привет"]
          - ["Doviđenja", "До свидания"]
          - ["Izvinite", "Извините"]
          - ["Nema na čemu", "Не за что"]
      - id: "03.5.3"
        type: fill_blank
        prompt: "Вечер: «Dobro ___!»"
        accept: ["veče"]
      - id: "03.5.4"
        type: word_bank
        prompt: "Собери приветствие: «добрый вечер»"
        bank: ["Dobro", "veče"]
        accept: ["Dobro veče."]
      - id: "03.5.5"
        type: translate
        prompt: "Спасибо, всего доброго!"
        accept: ["Hvala, prijatno!"]
      - id: "03.5.6"
        type: free
        prompt: "Ты встретил знакомого утром. Поздоровайся, спроси как дела, попрощайся (3 фразы)."
        sample: "Dobro jutro! Kako si? … Vidimo se, ćao!"
