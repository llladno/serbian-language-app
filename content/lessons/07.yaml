lesson: "07"
title: "Мој, твој"
subtitle: "притяжательные, текст, проверка"
teaches: [moj, tvoj, njegov]

steps:
  - id: "07.1"
    kind: teach
    title: "Мой, твой, его"
    md: "07/1-moj-tvoj.md"

  - id: "07.2"
    kind: practice
    title: "Мой / твой"
    also_ok: ["njena"]
    exercises:
      - id: "07.2.1"
        type: choice
        prompt: "«Моя сестра» —"
        options: ["moja sestra", "moj sestra", "moje sestra"]
        answer: "moja sestra"
      - id: "07.2.2"
        type: choice
        prompt: "«Твой брат» —"
        options: ["tvoj brat", "tvoja brat", "tvoje brat"]
        answer: "tvoj brat"
      - id: "07.2.3"
        type: fill_blank
        prompt: "«Моё дитя» → ___ dete"
        accept: ["moje"]
      - id: "07.2.4"
        type: word_bank
        prompt: "Собери: «это мой папа»"
        bank: ["Ovo", "je", "moj", "tata"]
        accept: ["Ovo je moj tata."]
      - id: "07.2.5"
        type: fix_error
        prompt: "Moj mama."
        accept: ["Moja mama."]
      - id: "07.2.6"
        type: fix_error
        prompt: "Tvoja brat."
        accept: ["Tvoj brat."]

  - id: "07.3"
    kind: reading
    title: "Моя семья"
    md: "07/3-citanje.md"
    also_ok: ["radi", "brata", "sestru"]
    exercises:
      - id: "07.3.1"
        type: choice
        prompt: "Есть ли у автора брат?"
        options: ["Nema brata.", "Ima brata.", "Ima sestru."]
        answer: "Nema brata."
      - id: "07.3.2"
        type: choice
        prompt: "Кем работает папа?"
        options: ["Radi kao lekar.", "Radi kao konobar.", "Radi kao programer."]
        answer: "Radi kao lekar."

  - id: "07.4"
    kind: practice
    title: "Диктант"
    mixed: true
    also_ok: ["mamu", "tatu", "sestru"]
    exercises:
      - id: "07.4.1"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "Imam mamu i tatu."
        accept: ["Imam mamu i tatu."]
      - id: "07.4.2"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "Ovo je moj brat."
        accept: ["Ovo je moj brat."]
      - id: "07.4.3"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "Nemam sestru."
        accept: ["Nemam sestru."]

  - id: "07.5"
    kind: checkpoint
    title: "Проверка"
    also_ok: ["sestru", "brata"]
    exercises:
      - id: "07.5.1"
        type: choice
        prompt: "«Моя мама» —"
        options: ["moja mama", "moj mama", "moje mama"]
        answer: "moja mama"
      - id: "07.5.2"
        type: match
        prompt: "Соедини"
        pairs:
          - ["brat", "брат"]
          - ["ćerka", "дочь"]
          - ["roditelji", "родители"]
          - ["deda", "дедушка"]
      - id: "07.5.3"
        type: fill_blank
        prompt: "У меня есть сестра: «Imam ___.»"
        accept: ["sestru"]
      - id: "07.5.4"
        type: word_bank
        prompt: "Собери: «у меня нет брата»"
        bank: ["Nemam", "brata"]
        accept: ["Nemam brata."]
      - id: "07.5.5"
        type: translate
        prompt: "Это мой папа."
        accept: ["Ovo je moj tata."]
      - id: "07.5.6"
        type: free
        prompt: "Расскажи про свою семью: 3 фразы (кто есть, кого нет, кем кто-то работает)."
        sample: "Imam mamu, tatu i sestru. Nemam brata. Moja sestra radi kao lekar."
