lesson: "07"
title: "Мой, твой (Moj, tvoj)"
subtitle: "мой, твой, его, её: по роду того, о чём говоришь"
teaches: [moj, tvoj, njegov]

steps:
  - id: "07.11"
    kind: teach
    title: "Мой, моя"
    md: "07/11-moj-moja.md"

  - id: "07.12"
    kind: practice
    title: "Запомним: Мой, моя"
    exercises:
      - id: "07.12.1"
        type: choice
        prompt: "«Мой папа» —"
        options: ["moj tata", "moja tata", "moj mama"]
        answer: "moj tata"

  - id: "07.13"
    kind: teach
    title: "Моё"
    md: "07/13-moje.md"

  - id: "07.14"
    kind: practice
    title: "Запомним: Моё"
    exercises:
      - id: "07.14.1"
        type: choice
        prompt: "«Мой ребёнок» —"
        options: ["moje dete", "moj dete", "moja dete"]
        answer: "moje dete"

  - id: "07.15"
    kind: teach
    title: "Твой, твоя, твоё"
    md: "07/15-tvoj.md"

  - id: "07.16"
    kind: practice
    title: "Запомним: Твой, твоя, твоё"
    exercises:
      - id: "07.16.1"
        type: choice
        prompt: "«Твоя сестра» —"
        options: ["tvoja sestra", "tvoj sestra", "tvoje sestra"]
        answer: "tvoja sestra"

  - id: "07.17"
    kind: teach
    title: "Его, её"
    md: "07/17-njegov-njen.md"

  - id: "07.18"
    kind: practice
    title: "Запомним: Его, её"
    also_ok: ["njena"]
    exercises:
      - id: "07.18.1"
        type: choice
        prompt: "«Её сестра» —"
        options: ["njena sestra", "njegova sestra", "njen sestra"]
        answer: "njena sestra"

  - id: "07.19"
    kind: practice
    title: "Послушай и выбери"
    also_ok: ["njena"]
    exercises:
      - id: "07.19.1"
        type: choice
        say: "Ovo je moj tata."
        prompt: "Послушай и выбери перевод."
        options: ["Это мой папа.", "Это моя мама.", "Это мой брат."]
        answer: "Это мой папа."
      - id: "07.19.2"
        type: choice
        say: "Ovo je moja mama."
        prompt: "Послушай и выбери перевод."
        options: ["Это моя мама.", "Это твоя мама.", "Это её мама."]
        answer: "Это моя мама."
      - id: "07.19.3"
        type: choice
        say: "Ovo je tvoja sestra."
        prompt: "Послушай и выбери перевод."
        options: ["Это твоя сестра.", "Это моя сестра.", "Это его сестра."]
        answer: "Это твоя сестра."
      - id: "07.19.4"
        type: choice
        say: "Ovo je njegov brat."
        prompt: "Послушай и выбери перевод."
        options: ["Это его брат.", "Это её брат.", "Это мой брат."]
        answer: "Это его брат."

  - id: "07.20"
    kind: practice
    title: "Выбери форму"
    also_ok: ["njena"]
    exercises:
      - id: "07.20.1"
        type: choice
        prompt: "«Мой дедушка» —"
        options: ["moj deda", "moja deda", "moje deda"]
        answer: "moj deda"
      - id: "07.20.2"
        type: choice
        prompt: "«Его мама» —"
        options: ["njegova mama", "njegov mama", "njen mama"]
        answer: "njegova mama"
      - id: "07.20.3"
        type: choice
        prompt: "«Её брат» —"
        options: ["njen brat", "njegov brat", "njena brat"]
        answer: "njen brat"

  - id: "07.21"
    kind: practice
    title: "Соедини"
    also_ok: ["njena"]
    exercises:
      - id: "07.21.1"
        type: match
        prompt: "Соедини фразу и перевод"
        pairs:
          - ["moj brat", "мой брат"]
          - ["moja sestra", "моя сестра"]
          - ["moje dete", "мой ребёнок"]
          - ["tvoj tata", "твой папа"]
          - ["njegova mama", "его мама"]
          - ["njena baba", "её бабушка"]

  - id: "07.22"
    kind: practice
    title: "Собери"
    exercises:
      - id: "07.22.1"
        type: word_bank
        prompt: "Собери: «это моя сестра»"
        bank: ["Ovo", "je", "moja", "moj", "sestra"]
        accept: ["Ovo je moja sestra."]
      - id: "07.22.2"
        type: word_bank
        prompt: "Собери: «это твой брат»"
        bank: ["Ovo", "je", "tvoj", "tvoja", "brat"]
        accept: ["Ovo je tvoj brat."]

  - id: "07.23"
    kind: practice
    title: "Напиши"
    exercises:
      - id: "07.23.1"
        type: fill_blank
        prompt: "«Моя мама» → ___ mama."
        accept: ["moja"]
      - id: "07.23.2"
        type: fill_blank
        prompt: "«Твой ребёнок» → ___ dete."
        accept: ["tvoje"]
      - id: "07.23.3"
        type: fix_error
        prompt: "Moj mama."
        accept: ["Moja mama."]
      - id: "07.23.4"
        type: fix_error
        prompt: "Tvoja brat."
        accept: ["Tvoj brat."]
      - id: "07.23.5"
        type: translate
        prompt: "Это мой папа."
        accept: ["Ovo je moj tata.", "To je moj tata."]
      - id: "07.23.6"
        type: translate
        prompt: "Это твоя мама."
        accept: ["Ovo je tvoja mama.", "To je tvoja mama."]
