lesson: "01"
title: "Специфични гласови"
subtitle: "особые буквы č ć š ž đ dž lj nj, проверка"
teaches: [cokolada, cevapi, sesir, zaba, djak, dzem, ljubav, konj]

steps:
  - id: "01.1"
    kind: teach
    title: "Особые буквы"
    md: "01/1-slova.md"

  - id: "01.2"
    kind: practice
    title: "Читаем и слышим"
    exercises:
      - id: "01.2.1"
        type: choice
        prompt: "«Шоколад» по-сербски —"
        options: ["čokolada", "ćevapi", "konj"]
        answer: "čokolada"
      - id: "01.2.2"
        type: choice
        prompt: "Слово, которое значит «школьник», —"
        options: ["đak", "žaba", "konj"]
        answer: "đak"
      - id: "01.2.3"
        type: match
        prompt: "Соедини слово и перевод"
        pairs:
          - ["čokolada", "шоколад"]
          - ["ćevapi", "чевапи"]
          - ["šešir", "шляпа"]
          - ["žaba", "лягушка"]
          - ["đak", "школьник"]
          - ["džem", "варенье"]
      - id: "01.2.4"
        type: fill_blank
        prompt: "Лошадь по-сербски — ___"
        accept: ["konj"]
      - id: "01.2.5"
        type: fill_blank
        prompt: "Любовь по-сербски — ___"
        accept: ["ljubav"]
      - id: "01.2.6"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "konj"
        accept: ["konj"]
      - id: "01.2.7"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "čokolada"
        accept: ["čokolada"]
      - id: "01.2.8"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "ljubav"
        accept: ["ljubav"]
      - id: "01.2.9"
        type: translate
        prompt: "Как по-сербски «варенье»?"
        accept: ["džem"]
      - id: "01.2.10"
        type: translate
        prompt: "Как по-сербски «шляпа»?"
        accept: ["šešir"]
      - id: "01.2.11"
        type: free
        prompt: "Прочитай вслух все слова урока — проверь č, ć, š, ž, đ, dž, lj, nj."
        sample: "čokolada, ćevapi, šešir, žaba, đak, džem, ljubav, konj"

  - id: "01.3"
    kind: checkpoint
    title: "Проверка"
    exercises:
      - id: "01.3.1"
        type: choice
        prompt: "«Лягушка» по-сербски —"
        options: ["žaba", "šešir", "konj"]
        answer: "žaba"
      - id: "01.3.2"
        type: match
        prompt: "Соедини"
        pairs:
          - ["šešir", "шляпа"]
          - ["đak", "школьник"]
          - ["ljubav", "любовь"]
          - ["konj", "лошадь"]
      - id: "01.3.3"
        type: fill_blank
        prompt: "Шоколад по-сербски — ___"
        accept: ["čokolada"]
      - id: "01.3.4"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "žaba"
        accept: ["žaba"]
      - id: "01.3.5"
        type: translate
        prompt: "Как по-сербски «школьник»?"
        accept: ["đak"]
