lesson: "01"
title: "Особые звуки (Specifični glasovi)"
subtitle: "особые буквы č ć š ž đ dž lj nj, проверка"
script: latin   # teaches the letters themselves: stays Latin whatever script the learner reads in
teaches: [cokolada, cevapi, sesir, zaba, djak, dzem, ljubav, konj]

steps:
  - id: "01.1"
    kind: teach
    title: "Особые буквы"
    md: "01/1-slova.md"

  - id: "01.2"
    kind: practice
    title: "Читаем и слышим"
    exercises:
      - id: "01.2.1"
        type: choice
        prompt: "«Шоколад» по-сербски —"
        options: ["čokolada", "ćevapi", "konj"]
        answer: "čokolada"
      - id: "01.2.2"
        type: choice
        prompt: "Слово, которое значит «школьник», —"
        options: ["đak", "žaba", "konj"]
        answer: "đak"
      - id: "01.2.3"
        type: match
        prompt: "Соедини слово и перевод"
        pairs:
          - ["čokolada", "шоколад"]
          - ["ćevapi", "чевапи"]
          - ["šešir", "шляпа"]
          - ["žaba", "лягушка"]
          - ["đak", "школьник"]
          - ["džem", "варенье"]
      - id: "01.2.4"
        hint: "4 буквы; последние две — nj («нь» одним звуком)."
        type: fill_blank
        prompt: "Лошадь по-сербски — ___"
        accept: ["konj"]
      - id: "01.2.5"
        hint: "В начале lj («ль»), в конце -av, как в слове «слава»."
        type: fill_blank
        prompt: "Любовь по-сербски — ___"
        accept: ["ljubav"]
        explain: "«ljubav» — окончание -av, а не -ov, как в русском «любовь»."
      - id: "01.2.6"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "konj"
        accept: ["konj"]
        ru: ["конь", "лошадь"]
      - id: "01.2.7"
        hint: "Первая буква — č («ч»), не ć. Слово из списка урока: шоколад."
        type: listen
        prompt: "Запиши, что слышишь."
        say: "čokolada"
        accept: ["čokolada"]
        ru: ["шоколад"]
      - id: "01.2.8"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "ljubav"
        accept: ["ljubav"]
        ru: ["любовь"]
      - id: "01.2.9"
        hint: "Звук «дж» пишется двумя буквами d + ž (dž) — не đ и не dj. Всего 4 буквы."
        type: translate
        prompt: "Как по-сербски «варенье»?"
        accept: ["džem"]
        explain: "«džem» — через «dž», а не «đ»: похожие на слух, но разные буквы."
      - id: "01.2.10"
        hint: "Начинается с š («ш» с галочкой), всего 5 букв. Слово было в списке урока."
        type: translate
        prompt: "Как по-сербски «шляпа»?"
        accept: ["šešir"]
        explain: "«šešir» — обе буквы š, ш-е-ш-и-р."

  - id: "01.3"
    kind: checkpoint
    title: "Проверка"
    exercises:
      - id: "01.3.1"
        type: choice
        prompt: "«Лягушка» по-сербски —"
        options: ["žaba", "šešir", "konj"]
        answer: "žaba"
      - id: "01.3.2"
        type: match
        prompt: "Соедини"
        pairs:
          - ["šešir", "шляпа"]
          - ["đak", "школьник"]
          - ["ljubav", "любовь"]
          - ["konj", "лошадь"]
      - id: "01.3.3"
        type: fill_blank
        prompt: "Шоколад по-сербски — ___"
        accept: ["čokolada"]
      - id: "01.3.4"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "žaba"
        accept: ["žaba"]
        ru: ["лягушка", "жаба"]
      - id: "01.3.5"
        type: translate
        prompt: "Как по-сербски «школьник»?"
        accept: ["đak"]
