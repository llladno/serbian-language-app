lesson: "01"
title: "Особые звуки (Specifični glasovi)"
subtitle: "буквы с галочками: š ž č lj nj ć đ dž"
script: latin   # teaches the letters themselves: stays Latin whatever script the learner reads in
teaches: [cokolada, cevapi, sesir, zaba, djak, dzem, ljubav, konj]

steps:
  - id: "01.11"
    kind: teach
    title: "Ш и Ж — как в русском"
    md: "01/11-sh-zh.md"

  - id: "01.12"
    kind: practice
    title: "Запомним: Ш и Ж — как в русском"
    also_ok: ["auto"]
    exercises:
      - id: "01.12.1"
        type: choice
        prompt: "Слово, которое значит «шляпа», —"
        options: ["šešir", "žaba", "auto"]
        answer: "šešir"

  - id: "01.13"
    kind: teach
    title: "Ч, ЛЬ, НЬ"
    md: "01/13-ch-lj-nj.md"

  - id: "01.14"
    kind: practice
    title: "Запомним: Ч, ЛЬ, НЬ"
    exercises:
      - id: "01.14.1"
        type: choice
        prompt: "«Лошадь» по-сербски —"
        options: ["konj", "ljubav", "čokolada"]
        answer: "konj"

  - id: "01.15"
    kind: teach
    title: "Ć — мягче, чем Č"
    md: "01/15-c-soft.md"

  - id: "01.16"
    kind: practice
    title: "Запомним: Ć — мягче, чем Č"
    exercises:
      - id: "01.16.1"
        type: choice
        prompt: "Какое слово начинается с мягкого «ć»?"
        options: ["ćevapi", "čokolada", "šešir"]
        answer: "ćevapi"

  - id: "01.17"
    kind: teach
    title: "Đ и DŽ"
    md: "01/17-dj-dz.md"

  - id: "01.18"
    kind: practice
    title: "Запомним: Đ и DŽ"
    exercises:
      - id: "01.18.1"
        type: choice
        prompt: "Слово, которое значит «варенье», —"
        options: ["džem", "đak", "žaba"]
        answer: "džem"

  - id: "01.19"
    kind: practice
    title: "Послушай и выбери"
    exercises:
      - id: "01.19.1"
        type: choice
        say: "šešir"
        prompt: "Послушай и выбери перевод."
        options: ["шляпа", "лягушка", "лошадь"]
        answer: "шляпа"
      - id: "01.19.2"
        type: choice
        say: "čokolada"
        prompt: "Послушай и выбери перевод."
        options: ["шоколад", "чевапи", "любовь"]
        answer: "шоколад"
      - id: "01.19.3"
        type: choice
        say: "ćevapi"
        prompt: "Послушай и выбери перевод."
        options: ["чевапи", "шоколад", "школьник"]
        answer: "чевапи"
      - id: "01.19.4"
        type: choice
        say: "džem"
        prompt: "Послушай и выбери перевод."
        options: ["варенье", "школьник", "шляпа"]
        answer: "варенье"

  - id: "01.20"
    kind: practice
    title: "Соедини"
    exercises:
      - id: "01.20.1"
        type: match
        prompt: "Соедини слово и перевод"
        pairs:
          - ["šešir", "шляпа"]
          - ["žaba", "лягушка"]
          - ["čokolada", "шоколад"]
          - ["ljubav", "любовь"]
          - ["konj", "лошадь"]
          - ["đak", "школьник"]

  - id: "01.21"
    kind: practice
    title: "Какая буква?"
    also_ok: ["š", "ž", "č", "ć", "đ", "lj", "nj", "dž"]
    exercises:
      - id: "01.21.1"
        type: choice
        prompt: "Слово «лягушка»: ___aba. Нужна буква —"
        options: ["ž", "š", "č"]
        answer: "ž"
      - id: "01.21.2"
        type: choice
        prompt: "Слово «любовь»: ___ubav. Нужны буквы —"
        options: ["lj", "nj", "dž"]
        answer: "lj"

  - id: "01.22"
    kind: practice
    title: "Напиши"
    exercises:
      - id: "01.22.1"
        hint: "4 буквы; последние две — nj («нь» одним звуком)."
        type: fill_blank
        prompt: "Лошадь по-сербски — ___"
        accept: ["konj"]
      - id: "01.22.2"
        hint: "В начале lj («ль»), в конце -av, как в слове «слава»."
        type: fill_blank
        prompt: "Любовь по-сербски — ___"
        accept: ["ljubav"]
        explain: "«ljubav» — окончание -av, а не -ov, как в русском «любовь»."
      - id: "01.22.3"
        hint: "Начинается с š («ш» с галочкой), всего 5 букв. Слово было на слайде."
        type: translate
        prompt: "Как по-сербски «шляпа»?"
        accept: ["šešir"]
        explain: "«šešir» — обе буквы š, ш-е-ш-и-р."
