lesson: "05"
title: "Говорю и понимаю (Govorim i razumem)"
subtitle: "языки, не понимаю, помедленнее, теперь понимаю"
teaches: [govoriti, ruski, srpski, engleski, malo-mnogo, dobro-lose, razumeti, ne-razumem, polako, ponovite, sada]

steps:
  - id: "05.11"
    kind: teach
    title: "Говорю по-…"
    md: "05/11-govoriti.md"

  - id: "05.12"
    kind: practice
    title: "Запомним: Говорю по-…"
    exercises:
      - id: "05.12.1"
        type: choice
        prompt: "«Я говорю по-русски» —"
        options: ["Govorim ruski.", "Govorim na ruski.", "Govori ruski."]
        answer: "Govorim ruski."

  - id: "05.13"
    kind: teach
    title: "Немного, много, хорошо, плохо"
    md: "05/13-malo.md"

  - id: "05.14"
    kind: practice
    title: "Запомним: Немного, много, хорошо, плохо"
    exercises:
      - id: "05.14.1"
        type: choice
        prompt: "«Говорите ли по-сербски?» — «___»"
        options: ["Malo.", "Dobar dan.", "Izvolite."]
        answer: "Malo."

  - id: "05.15"
    kind: teach
    title: "Не понимаю"
    md: "05/15-ne-razumem.md"

  - id: "05.16"
    kind: practice
    title: "Запомним: Не понимаю"
    exercises:
      - id: "05.16.1"
        type: choice
        prompt: "Не понял собеседника. Говоришь —"
        options: ["Izvinite, ne razumem.", "Hvala lepo.", "Drago mi je."]
        answer: "Izvinite, ne razumem."

  - id: "05.17"
    kind: teach
    title: "Помедленнее, повторите"
    md: "05/17-polako.md"

  - id: "05.18"
    kind: practice
    title: "Запомним: Помедленнее, повторите"
    exercises:
      - id: "05.18.1"
        type: choice
        prompt: "Собеседник говорит слишком быстро. Просишь —"
        options: ["Polako, molim.", "Hvala lepo.", "Malo."]
        answer: "Polako, molim."

  - id: "05.19"
    kind: teach
    title: "Теперь понимаю"
    md: "05/19-sada.md"

  - id: "05.20"
    kind: practice
    title: "Запомним: Теперь понимаю"
    exercises:
      - id: "05.20.1"
        type: choice
        prompt: "Наконец понял. Говоришь —"
        options: ["Sada razumem.", "Ne razumem.", "Polako, molim."]
        answer: "Sada razumem."

  - id: "05.21"
    kind: practice
    title: "Послушай и выбери"
    exercises:
      - id: "05.21.1"
        type: choice
        say: "Govorim ruski."
        prompt: "Послушай и выбери перевод."
        options: ["Говорю по-русски.", "Говорю по-сербски.", "Понимаю."]
        answer: "Говорю по-русски."
      - id: "05.21.2"
        type: choice
        say: "Ne razumem."
        prompt: "Послушай и выбери перевод."
        options: ["Не понимаю.", "Понимаю.", "Повторите."]
        answer: "Не понимаю."
      - id: "05.21.3"
        type: choice
        say: "Polako, molim."
        prompt: "Послушай и выбери перевод."
        options: ["Помедленнее, пожалуйста.", "Повторите, пожалуйста.", "Извините."]
        answer: "Помедленнее, пожалуйста."
      - id: "05.21.4"
        type: choice
        say: "Sada razumem."
        prompt: "Послушай и выбери перевод."
        options: ["Теперь понимаю.", "Не понимаю.", "Немного."]
        answer: "Теперь понимаю."

  - id: "05.22"
    kind: practice
    title: "Что скажешь?"
    exercises:
      - id: "05.22.1"
        type: choice
        prompt: "«Govorite li srpski?» — «___»"
        options: ["Malo.", "Polako.", "Hvala lepo."]
        answer: "Malo."
      - id: "05.22.2"
        type: choice
        prompt: "Просишь повторить —"
        options: ["Ponovite, molim.", "Sada razumem.", "Malo."]
        answer: "Ponovite, molim."

  - id: "05.23"
    kind: practice
    title: "Соедини"
    exercises:
      - id: "05.23.1"
        type: match
        prompt: "Соедини слово и перевод"
        pairs:
          - ["govoriti", "говорить"]
          - ["ruski", "русский (язык)"]
          - ["srpski", "сербский (язык)"]
          - ["engleski", "английский (язык)"]
          - ["malo", "немного"]
          - ["ne razumem", "не понимаю"]

  - id: "05.24"
    kind: practice
    title: "Собери"
    exercises:
      - id: "05.24.1"
        type: word_bank
        prompt: "Собери: «говорю по-русски»"
        bank: ["Govorim", "ruski", "srpski"]
        accept: ["Govorim ruski."]
      - id: "05.24.2"
        type: word_bank
        prompt: "Собери: «извините, не понимаю»"
        bank: ["Izvinite", "ne", "razumem", "govorim"]
        accept: ["Izvinite, ne razumem."]

  - id: "05.25"
    kind: practice
    title: "Напиши"
    exercises:
      - id: "05.25.1"
        type: fill_blank
        prompt: "«Говоришь по-сербски?» → Govoriš ___?"
        accept: ["srpski"]
      - id: "05.25.2"
        hint: "Слово было на последнем слайде: четыре буквы, начинается на s."
        type: fill_blank
        prompt: "«Теперь понимаю» → ___ razumem."
        accept: ["Sada", "Sad"]
      - id: "05.25.3"
        type: translate
        prompt: "Помедленнее, пожалуйста."
        accept: ["Polako, molim.", "Polako, molim vas.", "Molim vas, polako."]
