lesson: "04"
title: "Бројеви, цена, сати"
subtitle: "числа 0–1000, цена, возраст, часы, телефон"
teaches:
  [
    sest, sedam, osam, devet, jedanaest, dvanaest, petnaest, trideset,
    cetrdeset, pedeset, dvesta, trista, godina, sat, koliko-je-sati,
    u-koliko-sati, pola-sata, podne, ponoc, ujutru, popodne, uvece, tacno,
    kafa,
  ]

steps:
  - id: "04.1"
    kind: teach
    title: "Числа 0–10"
    md: "04/1-nula-deset.md"

  - id: "04.2"
    kind: practice
    title: "Узнай число"
    exercises:
      - id: "04.2.1"
        type: choice
        prompt: "«7» —"
        options: ["sedam", "šest", "osam"]
        answer: "sedam"
      - id: "04.2.2"
        type: choice
        prompt: "«четыре» —"
        options: ["četiri", "četrdeset", "tri"]
        answer: "četiri"
      - id: "04.2.3"
        type: match
        prompt: "Соедини число и цифру"
        pairs:
          - ["jedan", "один"]
          - ["tri", "три"]
          - ["pet", "пять"]
          - ["deset", "десять"]
      - id: "04.2.4"
        type: fill_blank
        prompt: "Запиши словом: 6 → ___"
        accept: ["šest"]

  - id: "04.3"
    kind: teach
    title: "Числа 11–100"
    md: "04/3-do-sto.md"

  - id: "04.4"
    kind: practice
    title: "Считаем дальше"
    exercises:
      - id: "04.4.1"
        type: choice
        prompt: "«30» —"
        options: ["trideset", "trinaest", "tri"]
        answer: "trideset"
      - id: "04.4.2"
        type: choice
        prompt: "«15» —"
        options: ["petnaest", "pedeset", "pet"]
        answer: "petnaest"
      - id: "04.4.3"
        type: match
        prompt: "Соедини"
        pairs:
          - ["dvadeset", "двадцать"]
          - ["trideset", "тридцать"]
          - ["pedeset", "пятьдесят"]
          - ["sto", "сто"]
      - id: "04.4.4"
        type: fill_blank
        prompt: "«40» словом — ___"
        accept: ["četrdeset"]
      - id: "04.4.5"
        type: word_bank
        prompt: "Собери «35»"
        bank: ["trideset", "pet"]
        accept: ["trideset pet"]

  - id: "04.5"
    kind: teach
    title: "Число + существительное"
    md: "04/5-broj-imenica.md"

  - id: "04.6"
    kind: practice
    title: "Сколько чего"
    also_ok: ["kafe", "kafu"]
    exercises:
      - id: "04.6.1"
        type: choice
        prompt: "«два динара» —"
        options: ["dva dinara", "dva dinar", "dve dinara"]
        answer: "dva dinara"
      - id: "04.6.2"
        type: choice
        prompt: "«пять кофе» —"
        options: ["pet kafa", "pet kafe", "pet kafu"]
        answer: "pet kafa"
      - id: "04.6.3"
        type: match
        prompt: "Соедини"
        pairs:
          - ["jedan dinar", "1 динар"]
          - ["dva dinara", "2 динара"]
          - ["pet dinara", "5 динаров"]
      - id: "04.6.4"
        type: fill_blank
        prompt: "Дополни: «tri ___» (kafa, женский род)"
        accept: ["kafe"]

  - id: "04.7"
    kind: teach
    title: "Цена"
    md: "04/7-cena.md"

  - id: "04.8"
    kind: practice
    title: "Спроси цену"
    exercises:
      - id: "04.8.1"
        type: choice
        prompt: "«Сколько стоит?» —"
        options: ["Koliko košta?", "Koliko dugujem?", "Pošto je?"]
        answer: "Koliko košta?"
      - id: "04.8.2"
        type: choice
        prompt: "«Сколько всё вместе?» —"
        options: ["Koliko sve zajedno?", "Koliko košta?", "Koliko imaš godina?"]
        answer: "Koliko sve zajedno?"
      - id: "04.8.3"
        type: fill_blank
        prompt: "«Сколько с меня?» → Koliko ___?"
        accept: ["dugujem"]
      - id: "04.8.4"
        type: word_bank
        prompt: "Собери: «сколько стоит кофе?»"
        bank: ["Koliko", "košta", "kafa"]
        accept: ["Koliko košta kafa?"]

  - id: "04.9"
    kind: teach
    title: "Возраст"
    md: "04/9-godine.md"

  - id: "04.10"
    kind: practice
    title: "Сколько лет"
    exercises:
      - id: "04.10.1"
        type: choice
        prompt: "«Мне 30 лет» —"
        options: ["Imam trideset godina.", "Imam trideset godine.", "Imam trideset godinu."]
        answer: "Imam trideset godina."
      - id: "04.10.2"
        type: choice
        prompt: "«Сколько тебе лет?» —"
        options: ["Koliko imaš godina?", "Koliko imaš godine?", "Koliko si godina?"]
        answer: "Koliko imaš godina?"
      - id: "04.10.3"
        type: fill_blank
        prompt: "«Мне 22 года» → Imam dvadeset dve ___."
        accept: ["godine"]
      - id: "04.10.4"
        type: word_bank
        prompt: "Собери: «мне сорок лет»"
        bank: ["Imam", "četrdeset", "godina"]
        accept: ["Imam četrdeset godina."]

  - id: "04.11"
    kind: teach
    title: "Который час"
    md: "04/11-sati.md"

  - id: "04.12"
    kind: practice
    title: "Сколько времени"
    exercises:
      - id: "04.12.1"
        type: choice
        prompt: "«Который час?» —"
        options: ["Koliko je sati?", "U koliko sati?", "Koliko košta?"]
        answer: "Koliko je sati?"
      - id: "04.12.2"
        type: choice
        prompt: "«Во сколько?» —"
        options: ["U koliko sati?", "Koliko je sati?", "Koliko sati imaš?"]
        answer: "U koliko sati?"
      - id: "04.12.3"
        type: match
        prompt: "Соедини время и запись"
        pairs:
          - ["pola tri", "половина третьего"]
          - ["tri i petnaest", "четверть четвёртого"]
          - ["podne", "полдень"]
          - ["ponoć", "полночь"]
      - id: "04.12.4"
        type: fill_blank
        prompt: "«полдень» по-сербски — ___"
        accept: ["podne"]
      - id: "04.12.5"
        type: word_bank
        prompt: "Собери: «во сколько?»"
        bank: ["U", "koliko", "sati"]
        accept: ["U koliko sati?"]

  - id: "04.13"
    kind: teach
    title: "Телефон"
    md: "04/13-telefon.md"

  - id: "04.14"
    kind: practice
    title: "Номер и связь"
    also_ok: ["koji", "gde"]
    exercises:
      - id: "04.14.1"
        type: choice
        prompt: "«Напиши / позвони мне» —"
        options: ["Javi mi se.", "Javiću ti se.", "Koji je broj?"]
        answer: "Javi mi se."
      - id: "04.14.2"
        type: choice
        prompt: "«Какой у тебя номер?» —"
        options: ["Koji je tvoj broj?", "Koliko je broj?", "Gde je broj?"]
        answer: "Koji je tvoj broj?"
      - id: "04.14.3"
        type: fill_blank
        prompt: "«Пришлю тебе сообщение» → Poslaću ti ___."
        accept: ["poruku"]
      - id: "04.14.4"
        type: word_bank
        prompt: "Собери: «напиши мне»"
        bank: ["Javi", "mi", "se"]
        accept: ["Javi mi se."]

  - id: "04.15"
    kind: reading
    title: "В пекаре"
    md: "04/15-citanje.md"
    exercises:
      - id: "04.15.1"
        type: choice
        prompt: "Сколько стоит один кофе?"
        options: ["Sto pedeset dinara.", "Trista dinara.", "Sto dinara."]
        answer: "Sto pedeset dinara."
      - id: "04.15.2"
        type: choice
        prompt: "Чем платит покупатель?"
        options: ["Karticom.", "Kešom.", "Sitno."]
        answer: "Karticom."

  - id: "04.16"
    kind: practice
    title: "Диктант"
    mixed: true
    exercises:
      - id: "04.16.1"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "Koliko košta?"
        accept: ["Koliko košta?"]
      - id: "04.16.2"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "Imam trideset godina."
        accept: ["Imam trideset godina."]
      - id: "04.16.3"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "U koliko sati?"
        accept: ["U koliko sati?"]

  - id: "04.17"
    kind: checkpoint
    title: "Проверка"
    also_ok: ["kafe", "kafu"]
    exercises:
      - id: "04.17.1"
        type: choice
        prompt: "«8» —"
        options: ["osam", "sedam", "šest"]
        answer: "osam"
      - id: "04.17.2"
        type: match
        prompt: "Соедини"
        pairs:
          - ["sedam", "семь"]
          - ["dvanaest", "двенадцать"]
          - ["trideset", "тридцать"]
          - ["sto", "сто"]
      - id: "04.17.3"
        type: fill_blank
        prompt: "«мне 25 лет» → Imam dvadeset pet ___."
        accept: ["godina"]
      - id: "04.17.4"
        type: word_bank
        prompt: "Собери: «сколько стоит кофе?»"
        bank: ["Koliko", "košta", "kafa"]
        accept: ["Koliko košta kafa?"]
      - id: "04.17.5"
        type: translate
        prompt: "Сколько с меня?"
        accept: ["Koliko dugujem?"]
      - id: "04.17.6"
        type: free
        prompt: "Ты в пекаре: спроси цену кофе, скажи, сколько тебе лет, и спроси который час — 3 фразы."
        sample: "Koliko košta kafa? Imam trideset godina. Koliko je sati?"
