lesson: "04"
title: "Знакомство (Upoznavanje)"
subtitle: "как зовут, приятно познакомиться"
teaches: [kako-se-zoves, zovem-se, ja-sam, drago-mi-je, takodje]

steps:
  - id: "04.11"
    kind: teach
    title: "Как тебя зовут?"
    md: "04/11-kako-se-zoves.md"

  - id: "04.12"
    kind: practice
    title: "Запомним: Как тебя зовут?"
    exercises:
      - id: "04.12.1"
        type: choice
        prompt: "Спрашиваешь незнакомого человека, как его зовут —"
        options: ["Kako se zovete?", "Kako se zoveš?", "Kako ste?"]
        answer: "Kako se zovete?"

  - id: "04.13"
    kind: teach
    title: "Меня зовут…"
    md: "04/13-zovem-se.md"

  - id: "04.14"
    kind: practice
    title: "Запомним: Меня зовут…"
    exercises:
      - id: "04.14.1"
        type: choice
        prompt: "Назови своё имя —"
        options: ["Zovem se Ana.", "Kako se zoveš?", "Hvala lepo."]
        answer: "Zovem se Ana."

  - id: "04.15"
    kind: teach
    title: "Drago mi je"
    md: "04/15-drago-mi-je.md"

  - id: "04.16"
    kind: practice
    title: "Запомним: Drago mi je"
    exercises:
      - id: "04.16.1"
        type: choice
        prompt: "Тебе сказали «Drago mi je». Отвечаешь —"
        options: ["Takođe.", "Nema na čemu.", "Doviđenja."]
        answer: "Takođe."

  - id: "04.17"
    kind: practice
    title: "Послушай и выбери"
    exercises:
      - id: "04.17.1"
        type: choice
        say: "Kako se zoveš?"
        prompt: "Послушай и выбери перевод."
        options: ["Как тебя зовут?", "Как дела?", "Что ты говоришь?"]
        answer: "Как тебя зовут?"
      - id: "04.17.2"
        type: choice
        say: "Zovem se Ana."
        prompt: "Послушай и выбери перевод."
        options: ["Меня зовут Ана.", "Как тебя зовут?", "Приятно познакомиться."]
        answer: "Меня зовут Ана."
      - id: "04.17.3"
        type: choice
        say: "Drago mi je."
        prompt: "Послушай и выбери перевод."
        options: ["Приятно познакомиться.", "Большое спасибо.", "Извините."]
        answer: "Приятно познакомиться."
      - id: "04.17.4"
        type: choice
        say: "Takođe."
        prompt: "Послушай и выбери перевод."
        options: ["Взаимно.", "Не за что.", "До свидания."]
        answer: "Взаимно."

  - id: "04.18"
    kind: practice
    title: "Что скажешь?"
    exercises:
      - id: "04.18.1"
        type: choice
        prompt: "Знакомишься со сверстником. Спрашиваешь имя —"
        options: ["Kako se zoveš?", "Kako se zovete?", "Drago mi je."]
        answer: "Kako se zoveš?"
      - id: "04.18.2"
        type: choice
        prompt: "«Drago mi je.» — «___»"
        options: ["Takođe.", "Zovem se Ana.", "Molim vas."]
        answer: "Takođe."

  - id: "04.19"
    kind: practice
    title: "Соедини"
    exercises:
      - id: "04.19.1"
        type: match
        prompt: "Соедини фразу и перевод"
        pairs:
          - ["Kako se zoveš?", "Как тебя зовут?"]
          - ["Kako se zovete?", "Как вас зовут?"]
          - ["Zovem se Ana", "Меня зовут Ана"]
          - ["Ja sam Ana", "Я Ана"]
          - ["Drago mi je", "Приятно познакомиться"]
          - ["Takođe", "Взаимно"]

  - id: "04.20"
    kind: practice
    title: "Собери"
    exercises:
      - id: "04.20.1"
        type: word_bank
        prompt: "Собери: «меня зовут Ана»"
        bank: ["Zovem", "se", "Ana"]
        accept: ["Zovem se Ana."]
      - id: "04.20.2"
        type: word_bank
        prompt: "Собери вопрос: «как вас зовут?»"
        bank: ["Kako", "se", "zovete", "zoveš"]
        accept: ["Kako se zovete?"]

  - id: "04.21"
    kind: practice
    title: "Напиши"
    exercises:
      - id: "04.21.1"
        hint: "Начинается на zov-, для «ты» заканчивается на -š."
        type: fill_blank
        prompt: "Другу: «Kako se ___?»"
        accept: ["zoveš"]
      - id: "04.21.2"
        hint: "Всего три слова; «mi» и «je» звучат слитно, но пишутся раздельно."
        type: translate
        prompt: "Приятно познакомиться."
        accept: ["Drago mi je."]
