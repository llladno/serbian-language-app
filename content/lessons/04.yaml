lesson: "04"
title: "Это я (Jesam ja)"
subtitle: "глагол быть, откуда я, где живу"
teaches: [biti, zemlja, zovem-se, kako-se-zoves, ja-sam]

steps:
  - id: "04.1"
    kind: teach
    title: "Глагол «быть» — jesam"
    md: "04/1-jesam.md"

  - id: "04.2"
    kind: practice
    title: "sam / si / je"
    also_ok: ["nisam", "nisi", "nije", "student"]
    exercises:
      - id: "04.2.1"
        type: choice
        prompt: "«Я из России» —"
        options: ["Ja sam iz Rusije.", "Ja iz Rusije.", "Ja je iz Rusije."]
        answer: "Ja sam iz Rusije."
      - id: "04.2.2"
        type: choice
        prompt: "«Ана из Сербии» —"
        options: ["Ana je iz Srbije.", "Ana si iz Srbije.", "Ana sam iz Srbije."]
        answer: "Ana je iz Srbije."
      - id: "04.2.8"
        type: choice
        prompt: "«Ты не студент» —"
        options: ["Ti nisi student.", "Ti nije student.", "Ti ne si student."]
        answer: "Ti nisi student."
        explain: "Отрицание «быть» — одно слово: ni + форма, как в таблице (ti → nisi). «ne si» отдельно не говорят."
      - id: "04.2.3"
        type: fill_blank
        prompt: "Ti ___ student? (ты)"
        accept: ["si"]
      - id: "04.2.4"
        hint: "Отрицание «быть» — одно слово, оно начинается на ni-. Для «он» смотри правый столбец таблицы."
        type: fill_blank
        prompt: "«Он не студент» → On ___ student."
        accept: ["nije"]
        explain: "«nije» — «не есть», одно слово: не «ne» + «je» отдельно."
      - id: "04.2.5"
        type: word_bank
        prompt: "Собери: «я не студент»"
        bank: ["Ja", "nisam", "student"]
        accept: ["Ja nisam student."]
      - id: "04.2.6"
        hint: "Не хватает подлежащего и короткой формы «быть» для «я» (на -m). Перепиши предложение целиком."
        type: fix_error
        prompt: "Iz Rusije."
        accept: ["Ja sam iz Rusije.", "Iz Rusije sam."]
        explain: "Без подлежащего и «sam» это не предложение — добавь «Ja sam» (или «sam» в конце)."
      - id: "04.2.7"
        hint: "Шесть коротких форм — все в таблице теории (левый столбец). У «мы», «вы» и «они» форма начинается на s-."
        type: conjugate
        prompt: "biti — быть"
        forms: ["ja", "ti", "on/ona/ono", "mi", "vi", "oni/one/ona"]
        accept:
          - ["sam"]
          - ["si"]
          - ["je"]
          - ["smo"]
          - ["ste"]
          - ["su"]
        meta: "jesam"

  - id: "04.3"
    kind: teach
    title: "Имя, откуда я, где живу"
    md: "04/3-odakle.md"

  - id: "04.4"
    kind: practice
    title: "Откуда и где"
    also_ok: ["rusije", "srbije", "beogradu"]
    exercises:
      - id: "04.4.1"
        type: choice
        prompt: "«Откуда ты?» —"
        options: ["Odakle si?", "Odakle je?", "Odakle sam?"]
        answer: "Odakle si?"
      - id: "04.4.2"
        type: match
        prompt: "Соедини"
        pairs:
          - ["iz Rusije", "из России"]
          - ["iz Srbije", "из Сербии"]
          - ["živim u Novom Sadu", "живу в Нови-Саде"]
      - id: "04.4.3"
        type: fill_blank
        prompt: "Живу в Белграде: «Živim ___ Beogradu.»"
        accept: ["u"]
      - id: "04.4.4"
        type: word_bank
        prompt: "Собери: «я из Сербии»"
        bank: ["Ja", "sam", "iz", "Srbije"]
        accept: ["Ja sam iz Srbije."]
      - id: "04.4.5"
        type: word_bank
        prompt: "Собери: «меня зовут Ана»"
        bank: ["Zovem", "se", "Ana"]
        accept: ["Zovem se Ana."]
