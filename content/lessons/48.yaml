lesson: "48"
title: "Проверка 4а (Provera 4a)"
subtitle: "род, число, прилагательные, винительный, родительный"
teaches: []

steps:
  - id: "48.1"
    kind: reading
    title: "Выходные у Марко"
    md: "48/1-citanje.md"
    also_ok: ["belu", "svežeg", "starog", "kupuje", "kuće", "nemaju", "vikendom", "jabuka", "šećera", "kile", "mleka", "hleba", "prijatelje", "ponedeljka", "petka"]
    exercises:
      - id: "48.1.1"
        type: choice
        prompt: "Какой кофе пьёт Марко?"
        options: ["Crnu kafu bez šećera.", "Belu kafu sa mlekom.", "Hladnu kafu."]
        answer: "Crnu kafu bez šećera."
      - id: "48.1.2"
        type: choice
        prompt: "Почему он покупает старый хлеб?"
        options: ["Jer nema svežeg hleba.", "Jer je jeftin.", "Jer voli stari hleb."]
        answer: "Jer nema svežeg hleba."
      - id: "48.1.3"
        type: choice
        prompt: "Сколько буханок он покупает?"
        options: ["Dva komada.", "Pet komada.", "Deset komada."]
        answer: "Dva komada."
      - id: "48.1.4"
        type: choice
        prompt: "Когда у друзей есть время?"
        options: ["Vikendom.", "Od ponedeljka do petka.", "Uveče."]
        answer: "Vikendom."

  - id: "48.2"
    kind: practice
    title: "Род, число, прилагательные"
    mixed: true
    also_ok: ["nove", "nova", "novo", "velike", "stari", "moji", "moje", "sobe", "sela"]
    exercises:
      - id: "48.2.1"
        type: choice
        prompt: "«Это мои сёстры» —"
        options: ["Ovo su moje sestre.", "Ovo su moji sestre.", "Ovo je moje sestre."]
        answer: "Ovo su moje sestre."
      - id: "48.2.2"
        type: choice
        prompt: "«красная сумка» —"
        options: ["crvena torba", "crven torba", "crveno torba"]
        answer: "crvena torba"
      - id: "48.2.3"
        type: match
        prompt: "Соедини"
        pairs:
          - ["gradovi", "города"]
          - ["sobe", "комнаты"]
          - ["sela", "сёла"]
          - ["dani", "дни"]
      - id: "48.2.4"
        type: fill_blank
        prompt: "«Кофе дорогой» → Kafa je ___."
        accept: ["skupa"]
      - id: "48.2.5"
        type: fill_blank
        prompt: "«Дети дома» → ___ su kod kuće."
        accept: ["Deca"]
      - id: "48.2.6"
        type: word_bank
        prompt: "Собери: «Квартиры в городе дорогие»"
        bank: ["Stanovi", "u", "gradu", "su", "skupi", "skupa"]
        accept: ["Stanovi u gradu su skupi."]
      - id: "48.2.7"
        type: fix_error
        prompt: "Jedna brat i dve sestra."
        accept: ["Jedan brat i dve sestre."]
        explain: "«brat» мужской — jedan; после «dve» (2–4) нужна форма sestre."
      - id: "48.2.8"
        type: translate
        prompt: "Моя кухня белая, а кровать синяя."
        accept: ["Moja kuhinja je bela, a krevet je plav.", "Moja kuhinja je bela a krevet je plav."]

  - id: "48.3"
    kind: practice
    title: "Винительный"
    mixed: true
    also_ok: ["kupujem", "Anu", "psa", "decu", "knjige", "prijatelje", "ovu"]
    exercises:
      - id: "48.3.1"
        type: choice
        prompt: "«Я вижу сестру» —"
        options: ["Vidim sestru.", "Vidim sestra.", "Vidim sestre."]
        answer: "Vidim sestru."
      - id: "48.3.2"
        type: choice
        prompt: "«Я жду друга» —"
        options: ["Čekam prijatelja.", "Čekam prijatelj.", "Čekam prijateljem."]
        answer: "Čekam prijatelja."
      - id: "48.3.3"
        type: match
        prompt: "Соедини"
        pairs:
          - ["Pijem kafu.", "Пью кофе"]
          - ["Gledam film.", "Смотрю фильм"]
          - ["Vodim decu u školu.", "Веду детей в школу"]
          - ["Čitam knjige.", "Читаю книги"]
      - id: "48.3.4"
        type: fill_blank
        prompt: "«Мне нужна новая сумка» → Treba mi nova ___."
        accept: ["torba"]
        explain: "После «treba mi» — именительный: torba (а не torbu)."
      - id: "48.3.5"
        type: fill_blank
        prompt: "«Я иду в магазин» → Idem u ___."
        accept: ["prodavnicu"]
      - id: "48.3.6"
        type: word_bank
        prompt: "Собери: «Я ищу чёрную куртку»"
        bank: ["Tražim", "crnu", "jaknu", "crna", "jakna"]
        accept: ["Tražim crnu jaknu."]
      - id: "48.3.7"
        type: fix_error
        prompt: "Čekam Marko."
        accept: ["Čekam Marka."]
      - id: "48.3.8"
        type: translate
        prompt: "Я хочу эту сумку."
        accept: ["Želim ovu torbu."]

  - id: "48.4"
    kind: practice
    title: "Родительный"
    mixed: true
    also_ok: ["hleba", "mleka", "vode", "šećera", "stanice", "posla", "petka", "vremena", "dinara", "godina", "banke", "pošte"]
    exercises:
      - id: "48.4.1"
        type: choice
        prompt: "«Нет молока» —"
        options: ["Nema mleka.", "Nema mleko.", "Nema mleku."]
        answer: "Nema mleka."
      - id: "48.4.2"
        type: choice
        prompt: "«Пять динаров» —"
        options: ["pet dinara", "pet dinar", "pet dinari"]
        answer: "pet dinara"
      - id: "48.4.3"
        type: match
        prompt: "Соедини"
        pairs:
          - ["do stanice", "до остановки"]
          - ["bez šećera", "без сахара"]
          - ["posle posla", "после работы"]
          - ["preko puta pošte", "напротив почты"]
      - id: "48.4.4"
        type: fill_blank
        prompt: "«У меня нет времени» → Nemam ___."
        accept: ["vremena"]
      - id: "48.4.5"
        type: fill_blank
        prompt: "«бутылка воды» → flaša ___"
        accept: ["vode"]
      - id: "48.4.6"
        type: word_bank
        prompt: "Собери: «Мне тридцать лет»"
        bank: ["Imam", "trideset", "godina", "godine", "godinu"]
        accept: ["Imam trideset godina."]
      - id: "48.4.7"
        type: fix_error
        prompt: "Kafa bez šećer i pet dinar."
        accept: ["Kafa bez šećera i pet dinara."]
      - id: "48.4.8"
        type: translate
        prompt: "Дайте мне литр молока и кило яблок."
        accept: ["Dajte mi litar mleka i kilo jabuka."]

  - id: "48.5"
    kind: dialogue
    title: "U prodavnici odeće"
    scene: "Ты в магазине одежды. Нужна куртка, но денег немного."
    voice: f
    also_ok: ["zelenu", "jaknu", "jabuka", "hiljada", "hiljade", "plavu", "para", "tu"]
    turns:
      - who: npc
        sr: "Dobar dan, šta želite?"
        ru: "Добрый день, что желаете?"

      - who: me
        sr: "Dobar dan. Tražim zelenu jaknu."
        ru: "Добрый день. Ищу зелёную куртку."
        exercise:
          id: "48.5.1"
          type: choice
          prompt: "Поздоровайся и скажи, что ищешь зелёную куртку"
          options:
            - "Dobar dan. Tražim zelenu jaknu."
            - "Dobar dan. Tražim zelena jakna."
            - "Dobar dan. Treba mi zelenu jaknu."
          answer: "Dobar dan. Tražim zelenu jaknu."

      - who: npc
        sr: "Izvolite. Ova jakna košta šest hiljada dinara."
        ru: "Пожалуйста. Эта куртка стоит шесть тысяч динаров."

      - who: me
        sr: "To je skupo. Nemam mnogo para."
        ru: "Это дорого. У меня немного денег."
        exercise:
          id: "48.5.2"
          type: fill_blank
          prompt: "«У меня немного денег» → Nemam mnogo ___."
          accept: ["para"]

      - who: npc
        sr: "Imamo i jeftinu plavu jaknu. Košta dve hiljade dinara."
        ru: "У нас есть и дешёвая синяя куртка. Стоит две тысячи динаров."

      - who: me
        sr: "Dobro, uzimam plavu jaknu."
        ru: "Хорошо, беру синюю куртку."
        exercise:
          id: "48.5.3"
          type: translate
          prompt: "Скажи: «Хорошо, беру синюю куртку»"
          accept: ["Dobro, uzimam plavu jaknu.", "Dobro, uzimam tu plavu jaknu.", "Uzimam plavu jaknu."]

      - who: npc
        sr: "Izvolite račun. Prijatno!"
        ru: "Вот чек. Всего доброго!"

      - who: me
        sr: "Hvala! Doviđenja!"
        ru: "Спасибо! До свидания!"
        exercise:
          id: "48.5.4"
          type: choice
          prompt: "Поблагодари и попрощайся"
          options:
            - "Hvala! Doviđenja!"
            - "Laku noć! Doviđenja!"
            - "Molim! Doviđenja!"
          answer: "Hvala! Doviđenja!"

  - id: "48.6"
    kind: practice
    title: "Диктант"
    mixed: true
    also_ok: ["jaknu", "zelenu", "haljinu", "para", "jaja"]
    exercises:
      - id: "48.6.1"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "Nemam mnogo para."
        accept: ["Nemam mnogo para."]
        ru: ["У меня немного денег", "У меня мало денег", "У меня нет много денег"]
      - id: "48.6.2"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "Tražim zelenu haljinu."
        accept: ["Tražim zelenu haljinu."]
        ru: ["Я ищу зелёное платье", "Ищу зелёное платье"]
      - id: "48.6.3"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "Dajte mi pet jaja, molim."
        accept: ["Dajte mi pet jaja, molim."]
        ru: ["Дайте мне пять яиц, пожалуйста", "Пять яиц, пожалуйста", "Дайте мне, пожалуйста, пять яиц"]

  - id: "48.7"
    kind: checkpoint
    title: "Проверка"
    also_ok: ["vidim", "vidiš", "vidimo", "vidite", "vide", "novih", "prijatelja", "stanova", "vode"]
    exercises:
      - id: "48.7.1"
        type: conjugate
        prompt: "videti — видеть"
        forms: ["ja", "ti", "on/ona/ono", "mi", "vi", "oni/one/ona"]
        accept:
          - ["vidim"]
          - ["vidiš"]
          - ["vidi"]
          - ["vidimo"]
          - ["vidite"]
          - ["vide"]
        meta: "тип -im"
      - id: "48.7.2"
        type: choice
        prompt: "«много друзей» —"
        options: ["mnogo prijatelja", "mnogo prijatelji", "mnogo prijatelje"]
        answer: "mnogo prijatelja"
      - id: "48.7.3"
        type: match
        prompt: "Соедини"
        pairs:
          - ["Nema vode.", "Нет воды"]
          - ["Vidim vodu.", "Вижу воду"]
          - ["Treba mi voda.", "Мне нужна вода"]
          - ["Dajte mi vodu.", "Дайте мне воду"]
      - id: "48.7.4"
        type: fill_blank
        prompt: "«пять квартир» → pet ___"
        accept: ["stanova"]
      - id: "48.7.5"
        type: word_bank
        prompt: "Собери: «У меня пять новых книг»"
        bank: ["Imam", "pet", "novih", "knjiga", "nove", "knjige"]
        accept: ["Imam pet novih knjiga."]
      - id: "48.7.6"
        type: fix_error
        prompt: "Ovo je moji prijatelji."
        accept: ["Ovo su moji prijatelji."]
      - id: "48.7.7"
        type: translate
        prompt: "Я иду на работу после завтрака."
        accept: ["Idem na posao posle doručka.", "Posle doručka idem na posao."]
