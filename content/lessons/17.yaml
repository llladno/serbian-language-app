lesson: "17"
title: "Навике"
subtitle: "как часто, volim / moram da, проверка"
teaches:
  [obicno, uvek, ponekad, nikad, cesto, retko, rano, kasno, svaki-dan, volim-da, moram-da]

steps:
  - id: "17.1"
    kind: teach
    title: "Как часто"
    md: "17/1-koliko-cesto.md"

  - id: "17.2"
    kind: practice
    title: "Частота"
    exercises:
      - id: "17.2.1"
        type: choice
        prompt: "«Как часто ты работаешь?» — «___»"
        options: ["Svaki dan.", "Ujutru.", "U sedam."]
        answer: "Svaki dan."
      - id: "17.2.2"
        type: choice
        prompt: "«я никогда не сплю днём» —"
        options: ["Nikad ne spavam popodne.", "Nikad spavam popodne.", "Ne spavam popodne nikad ne."]
        answer: "Nikad ne spavam popodne."
      - id: "17.2.3"
        type: fill_blank
        prompt: "«обычно» по-сербски — ___"
        accept: ["obično"]
      - id: "17.2.4"
        type: word_bank
        prompt: "Собери: «я часто читаю»"
        bank: ["Često", "čitam"]
        accept: ["Često čitam."]

  - id: "17.3"
    kind: teach
    title: "volim da / moram da"
    md: "17/3-volim-da.md"

  - id: "17.4"
    kind: practice
    title: "Хочу и должен"
    exercises:
      - id: "17.4.1"
        type: choice
        prompt: "«я люблю читать» —"
        options: ["Volim da čitam.", "Volim čitam.", "Volim čitati da."]
        answer: "Volim da čitam."
      - id: "17.4.2"
        type: choice
        prompt: "«мне надо идти» —"
        options: ["Moram da idem.", "Moram idem.", "Moram ići da."]
        answer: "Moram da idem."
      - id: "17.4.3"
        type: fill_blank
        prompt: "«я хочу спать» → Hoću ___ spavam."
        accept: ["da"]
      - id: "17.4.4"
        type: word_bank
        prompt: "Собери: «я должен работать»"
        bank: ["Moram", "da", "radim"]
        accept: ["Moram da radim."]

  - id: "17.5"
    kind: reading
    title: "Обычный вторник"
    md: "17/5-citanje.md"
    also_ok: ["ručam", "odmara"]
    exercises:
      - id: "17.5.1"
        type: choice
        prompt: "Во сколько автор встаёт по будням?"
        options: ["U sedam.", "U devet.", "U osam."]
        answer: "U sedam."
      - id: "17.5.2"
        type: choice
        prompt: "Что автор делает по воскресеньям?"
        options: ["Odmara.", "Radi.", "Ide na posao."]
        answer: "Odmara."

  - id: "17.6"
    kind: practice
    title: "Диктант"
    mixed: true
    exercises:
      - id: "17.6.1"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "Ustajem u sedam."
        accept: ["Ustajem u sedam."]
      - id: "17.6.2"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "Radim svaki dan."
        accept: ["Radim svaki dan."]
      - id: "17.6.3"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "Volim da čitam."
        accept: ["Volim da čitam."]

  - id: "17.7"
    kind: practice
    title: "Спряжение"
    mixed: true
    exercises:
      - id: "17.7.1"
        type: conjugate
        prompt: "čitati — читать"
        forms: ["ja", "ti", "on/ona/ono", "mi", "vi", "oni/one/ona"]
        accept:
          - ["čitam"]
          - ["čitaš"]
          - ["čita"]
          - ["čitamo"]
          - ["čitate"]
          - ["čitaju"]
        meta: "тип -am"
      - id: "17.7.2"
        type: conjugate
        prompt: "gledati — смотреть"
        forms: ["ja", "ti", "on/ona/ono", "mi", "vi", "oni/one/ona"]
        accept:
          - ["gledam"]
          - ["gledaš"]
          - ["gleda"]
          - ["gledamo"]
          - ["gledate"]
          - ["gledaju"]
        meta: "тип -am"
      - id: "17.7.3"
        type: translate
        prompt: "Я читаю каждый день."
        accept: ["Čitam svaki dan."]

  - id: "17.8"
    kind: checkpoint
    title: "Проверка"
    exercises:
      - id: "17.8.1"
        type: choice
        prompt: "«я работаю каждый день» —"
        options: ["Radim svaki dan.", "Radim svaki dana.", "Radim svaka dan."]
        answer: "Radim svaki dan."
      - id: "17.8.2"
        type: match
        prompt: "Соедини"
        pairs:
          - ["ponedeljak", "понедельник"]
          - ["obično", "обычно"]
          - ["nikad", "никогда"]
          - ["vikend", "выходные"]
      - id: "17.8.3"
        type: fill_blank
        prompt: "«я люблю читать» → Volim ___ čitam."
        accept: ["da"]
      - id: "17.8.4"
        type: word_bank
        prompt: "Собери: «я встаю рано»"
        bank: ["Ustajem", "rano"]
        accept: ["Ustajem rano."]
      - id: "17.8.5"
        type: translate
        prompt: "Я встаю в семь."
        accept: ["Ustajem u sedam."]
      - id: "17.8.6"
        type: free
        prompt: "Расскажи свой будний день: 4 фразы (когда встаёшь, что делаешь утром, где работаешь, что вечером)."
        sample: "Ustajem u sedam. Doručkujem i idem na posao. Radim kao {job}. Uveče volim da čitam."
