lesson: "36"
title: "Проверка: планы и передвижение (Provera: planovi i kretanje)"
subtitle: "футур, инструментал, план на выходные"
teaches: []

steps:
  - id: "36.1"
    kind: reading
    title: "Марков викенд"
    md: "36/1-citanje.md"
    exercises:
      - id: "36.1.1"
        type: choice
        prompt: "На чём Марко поедет в субботу?"
        options: ["Vozom.", "Avionom.", "Autobusom."]
        answer: "Vozom."
      - id: "36.1.2"
        type: choice
        prompt: "Как он дойдёт до станции?"
        options: ["Pešice.", "Biciklom.", "Taksijem."]
        answer: "Pešice."
      - id: "36.1.3"
        type: choice
        prompt: "На чём он вернётся в воскресенье?"
        options: ["Autobusom.", "Vozom.", "Avionom."]
        answer: "Autobusom."

  - id: "36.2"
    kind: practice
    title: "Футур"
    mixed: true
    also_ok: ["piše", "putujem"]
    exercises:
      - id: "36.2.1"
        type: choice
        prompt: "«Я буду путешествовать завтра» —"
        options: ["Sutra ću da putujem.", "Juče sam putovao.", "Sutra sam putovao."]
        answer: "Sutra ću da putujem."
      - id: "36.2.2"
        type: match
        prompt: "Соедини"
        pairs:
          - ["ću", "я буду"]
          - ["ćemo", "мы будем"]
          - ["neću", "я не буду"]
          - ["radiću", "я буду работать (слитно)"]
      - id: "36.2.3"
        type: fill_blank
        prompt: "«Она будет писать» → Ona će da ___."
        accept: ["piše"]
      - id: "36.2.4"
        type: word_bank
        prompt: "Собери: «мы будем работать завтра»"
        bank: ["Mi", "ćemo", "da", "radimo", "sutra"]
        accept: ["Mi ćemo da radimo sutra."]
      - id: "36.2.5"
        type: translate
        prompt: "Когда ты будешь в городе?"
        accept: ["Kad ćeš biti u gradu?", "Kada ćeš biti u gradu?"]

  - id: "36.3"
    kind: practice
    title: "Транспорт и вывески"
    mixed: true
    also_ok: ["autom"]
    exercises:
      - id: "36.3.1"
        type: choice
        prompt: "«Еду на велосипеде» —"
        options: ["Vozim se biciklom.", "Vozim se bicikl.", "Idem bicikl."]
        answer: "Vozim se biciklom."
      - id: "36.3.2"
        type: match
        prompt: "Соедини"
        pairs:
          - ["izlaz", "выход"]
          - ["sledeći", "следующий"]
          - ["peron", "платформа"]
          - ["parking", "парковка"]
      - id: "36.3.3"
        type: fill_blank
        prompt: "«Еду на машине» → Idem ___."
        accept: ["autom"]
      - id: "36.3.4"
        type: fix_error
        prompt: "Idem avion."
        accept: ["Idem avionom.", "Letim avionom."]
        explain: "транспорт — в инструментале: avionom, не avion."
      - id: "36.3.5"
        type: translate
        prompt: "Когда приходит следующий автобус?"
        accept: ["Kad dolazi sledeći autobus?"]

  - id: "36.4"
    kind: checkpoint
    title: "План на выходные"
    exercises:
      - id: "36.4.1"
        type: free
        prompt: "Расскажи о своих планах на следующие выходные: куда поедешь, на чём, что будешь делать — 4–5 фраз."
        sample: "U subotu ću da putujem vozom kod sestre. Stanica je blizu, ići ću pešice. U nedelju ću da se vratim autobusom."

  - id: "36.5"
    kind: practice
    title: "Диктант"
    mixed: true
    exercises:
      - id: "36.5.1"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "Sutra ću da radim."
        accept: ["Sutra ću da radim."]
      - id: "36.5.2"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "Idem autobusom."
        accept: ["Idem autobusom."]
      - id: "36.5.3"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "Kad dolazi sledeći autobus?"
        accept: ["Kad dolazi sledeći autobus?"]
