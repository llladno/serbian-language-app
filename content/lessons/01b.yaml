lesson: "01b"
title: "Повторение: особые звуки (Ponavljanje)"
subtitle: "восемь букв и восемь слов вместе"
script: latin   # teaches the letters themselves: stays Latin whatever script the learner reads in
teaches: []

steps:
  - id: "01b.1"
    kind: practice
    title: "Послушай и выбери"
    exercises:
      - id: "01b.1.1"
        type: choice
        say: "žaba"
        prompt: "Послушай и выбери перевод."
        options: ["лягушка", "шляпа", "лошадь"]
        answer: "лягушка"
      - id: "01b.1.2"
        type: choice
        say: "ljubav"
        prompt: "Послушай и выбери перевод."
        options: ["любовь", "лошадь", "варенье"]
        answer: "любовь"
      - id: "01b.1.3"
        type: choice
        say: "đak"
        prompt: "Послушай и выбери перевод."
        options: ["школьник", "варенье", "шоколад"]
        answer: "школьник"
      - id: "01b.1.4"
        type: choice
        say: "ćevapi"
        prompt: "Послушай и выбери перевод."
        options: ["чевапи", "шоколад", "шляпа"]
        answer: "чевапи"

  - id: "01b.2"
    kind: practice
    title: "Соедини"
    exercises:
      - id: "01b.2.1"
        type: match
        prompt: "Соедини слово и перевод"
        pairs:
          - ["ćevapi", "чевапи"]
          - ["džem", "варенье"]
          - ["ljubav", "любовь"]
          - ["konj", "лошадь"]
          - ["čokolada", "шоколад"]
          - ["đak", "школьник"]

  - id: "01b.3"
    kind: practice
    title: "Какая буква?"
    also_ok: ["š", "ž", "č", "ć", "đ", "lj", "nj", "dž"]
    exercises:
      - id: "01b.3.1"
        type: choice
        prompt: "Слово «школьник»: ___ak. Нужна буква —"
        options: ["đ", "dž", "ž"]
        answer: "đ"
      - id: "01b.3.2"
        type: choice
        prompt: "Слово «варенье»: ___em. Нужны буквы —"
        options: ["dž", "đ", "š"]
        answer: "dž"

  - id: "01b.4"
    kind: practice
    title: "Диктант"
    exercises:
      - id: "01b.4.1"
        type: listen
        say: "konj"
        prompt: "Запиши, что слышишь."
        accept: ["konj"]
        ru: ["конь", "лошадь"]
      - id: "01b.4.2"
        hint: "Первая буква — č («ч»), не ć."
        type: listen
        say: "čokolada"
        prompt: "Запиши, что слышишь."
        accept: ["čokolada"]
        ru: ["шоколад"]
      - id: "01b.4.3"
        type: listen
        say: "ljubav"
        prompt: "Запиши, что слышишь."
        accept: ["ljubav"]
        ru: ["любовь"]

  - id: "01b.5"
    kind: practice
    title: "Переведи"
    exercises:
      - id: "01b.5.1"
        type: translate
        prompt: "Как по-сербски «школьник»?"
        accept: ["đak"]
      - id: "01b.5.2"
        hint: "Звук «дж» пишется двумя буквами d + ž (dž), не đ и не dj. Всего 4 буквы."
        type: translate
        prompt: "Как по-сербски «варенье»?"
        accept: ["džem"]
        explain: "«džem» — через «dž», а не «đ»: похожие на слух, но разные буквы."
