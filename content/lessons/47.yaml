lesson: "47"
title: "Родительный II (Genitiv II)"
subtitle: "количество и мн. ч.: pet dinara, litar mleka"
teaches: [flasa, casa, solja, par, dosta, nekoliko, vise, manje, puno]

steps:
  - id: "47.1"
    kind: teach
    title: "Один, два-четыре, пять"
    md: "47/1-brojevi.md"

  - id: "47.2"
    kind: practice
    title: "Dva dinara, pet dinara"
    also_ok: ["dinara", "dinar", "sata", "sati", "godina", "minuta", "dana", "sobe"]
    exercises:
      - id: "47.2.1"
        type: choice
        prompt: "«один динар» —"
        options: ["jedan dinar", "jedan dinara", "jedan dinari"]
        answer: "jedan dinar"
      - id: "47.2.2"
        type: choice
        prompt: "«два динара» —"
        options: ["dva dinara", "dva dinar", "dva dinari"]
        answer: "dva dinara"
      - id: "47.2.3"
        type: choice
        prompt: "«пять динаров» —"
        options: ["pet dinara", "pet dinar", "pet dinari"]
        answer: "pet dinara"
      - id: "47.2.4"
        type: choice
        prompt: "«две комнаты» —"
        options: ["dve sobe", "dve soba", "dva sobe"]
        answer: "dve sobe"
        explain: "«soba» женского рода, поэтому «dve»; после 2–4 — родительный единственного: sobe."
      - id: "47.2.5"
        type: match
        prompt: "Соедини"
        pairs:
          - ["jedan dan", "один день"]
          - ["dva dana", "два дня"]
          - ["pet dana", "пять дней"]
          - ["dvadeset dana", "двадцать дней"]
      - id: "47.2.6"
        type: fill_blank
        prompt: "«три часа» → tri ___"
        accept: ["sata"]
      - id: "47.2.7"
        type: fill_blank
        prompt: "«пять часов» → pet ___"
        accept: ["sati"]
        explain: "Для 5+ нужен родительный множественного: sat → sati (а после 2–4 — sata)."
      - id: "47.2.8"
        type: fill_blank
        prompt: "«мне тридцать лет» → Imam trideset ___."
        accept: ["godina"]
      - id: "47.2.9"
        type: word_bank
        prompt: "Собери: «Сто динаров»"
        bank: ["Sto", "dinara", "dinar", "dinari"]
        accept: ["Sto dinara."]
      - id: "47.2.10"
        type: fix_error
        prompt: "Pet dinar."
        accept: ["Pet dinara."]
        explain: "После числа 5 и больше — родительный множественного: dinara."
      - id: "47.2.11"
        type: translate
        prompt: "Это стоит сто двадцать динаров."
        accept: ["To košta sto dvadeset dinara."]

  - id: "47.3"
    kind: teach
    title: "Мера и количество"
    md: "47/3-mera.md"

  - id: "47.4"
    kind: practice
    title: "Litar mleka, mnogo vremena"
    also_ok: ["mleka", "šećera", "vode", "vremena", "ljudi", "jabuka", "kafe", "soka", "sira"]
    exercises:
      - id: "47.4.1"
        type: choice
        prompt: "«литр молока» —"
        options: ["litar mleka", "litar mleko", "litar mleku"]
        answer: "litar mleka"
      - id: "47.4.2"
        type: choice
        prompt: "«чашка кофе» —"
        options: ["šolja kafe", "šolja kafa", "šolja kafu"]
        answer: "šolja kafe"
      - id: "47.4.3"
        type: choice
        prompt: "«много времени» —"
        options: ["mnogo vremena", "mnogo vreme", "mnogo vremenu"]
        answer: "mnogo vremena"
      - id: "47.4.4"
        type: choice
        prompt: "«мало сахара» —"
        options: ["malo šećera", "malo šećer", "malo šećeru"]
        answer: "malo šećera"
      - id: "47.4.5"
        type: match
        prompt: "Соедини"
        pairs:
          - ["flaša vode", "бутылка воды"]
          - ["čaša soka", "стакан сока"]
          - ["komad sira", "кусок сыра"]
          - ["kutija čaja", "коробка чая"]
      - id: "47.4.6"
        type: fill_blank
        prompt: "«бутылка воды» → flaša ___"
        accept: ["vode"]
      - id: "47.4.7"
        type: fill_blank
        prompt: "«много людей» → mnogo ___"
        accept: ["ljudi"]
      - id: "47.4.8"
        type: fill_blank
        prompt: "«Сколько у тебя времени?» → Koliko ___ imaš?"
        accept: ["vremena"]
      - id: "47.4.9"
        type: word_bank
        prompt: "Собери: «Дайте мне литр молока»"
        bank: ["Dajte", "mi", "litar", "mleka", "mleko"]
        accept: ["Dajte mi litar mleka."]
      - id: "47.4.10"
        type: fix_error
        prompt: "Dajte mi litar mleko."
        accept: ["Dajte mi litar mleka."]
        explain: "После слова меры — родительный: mleko → mleka."
      - id: "47.4.11"
        type: translate
        prompt: "Мне нужен килограмм яблок."
        accept: ["Treba mi kilo jabuka.", "Treba mi kilogram jabuka."]

  - id: "47.5"
    kind: teach
    title: "Родительный множественного"
    md: "47/5-mnozina-gen.md"

  - id: "47.6"
    kind: practice
    title: "Pet knjiga, mnogo prijatelja"
    also_ok: ["knjiga", "prijatelja", "stanova", "godina", "kuća", "jaja", "ljudi", "velikih", "novih", "sestara", "parkova"]
    exercises:
      - id: "47.6.1"
        type: choice
        prompt: "«пять книг» —"
        options: ["pet knjiga", "pet knjige", "pet knjigu"]
        answer: "pet knjiga"
      - id: "47.6.2"
        type: choice
        prompt: "«много друзей» —"
        options: ["mnogo prijatelja", "mnogo prijatelji", "mnogo prijatelje"]
        answer: "mnogo prijatelja"
      - id: "47.6.3"
        type: choice
        prompt: "«пять квартир» —"
        options: ["pet stanova", "pet stana", "pet stanovi"]
        answer: "pet stanova"
        explain: "Короткое мужское слово (один слог) берёт -ova: stan → stanova."
      - id: "47.6.4"
        type: choice
        prompt: "«десять лет» —"
        options: ["deset godina", "deset godine", "deset godinu"]
        answer: "deset godina"
      - id: "47.6.5"
        type: match
        prompt: "Соедини"
        pairs:
          - ["pet kuća", "пять домов"]
          - ["pet jaja", "пять яиц"]
          - ["pet stanova", "пять квартир"]
          - ["mnogo ljudi", "много людей"]
      - id: "47.6.6"
        type: fill_blank
        prompt: "«пять больших комнат» → pet velikih ___"
        accept: ["soba"]
      - id: "47.6.7"
        type: fill_blank
        prompt: "«много новых книг» → mnogo ___ knjiga"
        accept: ["novih"]
        explain: "Прилагательное в родительном множественного — всегда -ih."
      - id: "47.6.8"
        type: fill_blank
        prompt: "«пять сестёр» → pet ___"
        accept: ["sestara"]
        explain: "В женском слове с группой согласных перед -a вставляется ещё одно «a»: sestra → sestara."
      - id: "47.6.9"
        type: word_bank
        prompt: "Собери: «У меня пять друзей»"
        bank: ["Imam", "pet", "prijatelja", "prijatelji", "prijatelje"]
        accept: ["Imam pet prijatelja."]
      - id: "47.6.10"
        type: fix_error
        prompt: "Imam pet prijatelji."
        accept: ["Imam pet prijatelja."]
      - id: "47.6.11"
        type: translate
        prompt: "В городе много новых парков."
        accept:
          - "U gradu ima mnogo novih parkova."
          - "U gradu ima puno novih parkova."
          - "U gradu je mnogo novih parkova."

  - id: "47.7"
    kind: reading
    title: "В магазине"
    md: "47/7-citanje.md"
    also_ok: ["mleka", "kile", "sira", "hleba", "jabuka", "flašu", "jaja", "dinara", "para", "vremena", "prodavnicu", "litra"]
    exercises:
      - id: "47.7.1"
        type: choice
        prompt: "Сколько молока она покупает?"
        options: ["Litar.", "Pola litra.", "Dva litra."]
        answer: "Litar."
      - id: "47.7.2"
        type: choice
        prompt: "Зачем ей яйца?"
        options: ["Jer pravi palačinke.", "Jer voli jaja.", "Jer nema hleba."]
        answer: "Jer pravi palačinke."
      - id: "47.7.3"
        type: choice
        prompt: "Сколько стоит всё?"
        options: ["Trista dvadeset dinara.", "Sto dvadeset dinara.", "Trista dinara."]
        answer: "Trista dvadeset dinara."

  - id: "47.8"
    kind: dialogue
    title: "Na pijaci"
    scene: "Ты на рынке. Продавец спрашивает, что тебе нужно."
    voice: m
    also_ok: ["jabuka", "mleka", "dinara", "dvesta", "litra"]
    turns:
      - who: npc
        sr: "Dobar dan, izvolite?"
        ru: "Добрый день, слушаю?"

      - who: me
        sr: "Dobar dan. Dajte mi kilo jabuka, molim."
        ru: "Добрый день. Дайте мне килограмм яблок, пожалуйста."
        exercise:
          id: "47.8.1"
          type: choice
          prompt: "Поздоровайся и попроси килограмм яблок"
          options:
            - "Dobar dan. Dajte mi kilo jabuka, molim."
            - "Dobar dan. Dajte mi kilo jabuke, molim."
            - "Dobar dan. Dajte mi kilo jabuku, molim."
          answer: "Dobar dan. Dajte mi kilo jabuka, molim."
          explain: "После слова меры — родительный множественного: jabuka → jabuka (то же слово, но падеж другой)."

      - who: npc
        sr: "Izvolite. Još nešto?"
        ru: "Пожалуйста. Ещё что-нибудь?"

      - who: me
        sr: "Da, dva litra mleka."
        ru: "Да, два литра молока."
        exercise:
          id: "47.8.2"
          type: fill_blank
          prompt: "«два литра молока» → Da, dva litra ___."
          accept: ["mleka"]

      - who: npc
        sr: "Dobro. To je sto dvadeset dinara."
        ru: "Хорошо. С вас сто двадцать динаров."

      - who: me
        sr: "Evo dvesta dinara."
        ru: "Вот двести динаров."
        exercise:
          id: "47.8.3"
          type: translate
          prompt: "Скажи: «Вот двести динаров»"
          accept: ["Evo dvesta dinara.", "Izvolite dvesta dinara.", "Izvolite, dvesta dinara."]

      - who: npc
        sr: "Izvolite kusur i račun. Prijatno!"
        ru: "Вот сдача и чек. Всего доброго!"

      - who: me
        sr: "Hvala! Prijatno!"
        ru: "Спасибо! Всего доброго!"
        exercise:
          id: "47.8.4"
          type: choice
          prompt: "Поблагодари и пожелай хорошего дня"
          options:
            - "Hvala! Prijatno!"
            - "Laku noć! Prijatno!"
            - "Molim! Prijatno!"
          answer: "Hvala! Prijatno!"

  - id: "47.9"
    kind: practice
    title: "Диктант"
    mixed: true
    also_ok: ["minuta", "mleka", "jabuka", "godina", "litra"]
    exercises:
      - id: "47.9.1"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "Pet minuta pešice."
        accept: ["Pet minuta pešice."]
        ru: ["Пять минут пешком", "Пешком пять минут", "Пять минут пешком."]
      - id: "47.9.2"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "Dva litra mleka i kilo jabuka."
        accept: ["Dva litra mleka i kilo jabuka."]
        ru: ["Два литра молока и килограмм яблок", "Два литра молока и кило яблок"]
      - id: "47.9.3"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "Imam trideset godina."
        accept: ["Imam trideset godina."]
        ru: ["Мне тридцать лет", "Мне тридцать", "У меня тридцать лет"]
