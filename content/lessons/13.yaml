lesson: "13"
title: "Рекламација"
subtitle: "возврат, очередь, текст, диалог, проверка"
teaches: []

steps:
  - id: "13.1"
    kind: teach
    title: "Что-то не так"
    md: "13/1-reklamacija.md"

  - id: "13.2"
    kind: practice
    title: "Возврат"
    also_ok: ["mogu"]
    exercises:
      - id: "13.2.1"
        type: choice
        prompt: "«Это испорчено» —"
        options: ["Ovo je pokvareno.", "Ovo je sveže.", "Ovo je otvoreno."]
        answer: "Ovo je pokvareno."
      - id: "13.2.2"
        type: choice
        prompt: "«Могу вернуть?» —"
        options: ["Mogu li da vratim?", "Mogu li da zamenim?", "Mogu li da tražim?"]
        answer: "Mogu li da vratim?"
      - id: "13.2.3"
        type: fill_blank
        prompt: "«Где написан срок годности?» → Gde piše rok ___?"
        accept: ["trajanja"]
      - id: "13.2.4"
        type: word_bank
        prompt: "Собери: «могу поменять?»"
        bank: ["Mogu", "li", "da", "zamenim"]
        accept: ["Mogu li da zamenim?"]

  - id: "13.3"
    kind: teach
    title: "Очередь и часы"
    md: "13/3-red.md"

  - id: "13.4"
    kind: practice
    title: "В очереди"
    exercises:
      - id: "13.4.1"
        type: choice
        prompt: "Входя в очередь, спрашиваешь —"
        options: ["Ko je poslednji?", "Dobar dan!", "Prijatno."]
        answer: "Ko je poslednji?"
      - id: "13.4.2"
        type: choice
        prompt: "«Открыто или закрыто?» —"
        options: ["Otvoreno ili zatvoreno?", "Radno vreme?", "Koliko košta?"]
        answer: "Otvoreno ili zatvoreno?"
      - id: "13.4.3"
        type: match
        prompt: "Соедини"
        pairs:
          - ["red", "очередь"]
          - ["otvoreno", "открыто"]
          - ["zatvoreno", "закрыто"]
          - ["radno vreme", "часы работы"]
      - id: "13.4.4"
        type: fill_blank
        prompt: "«Я за вами» → Ja sam ___ vama."
        accept: ["za"]

  - id: "13.5"
    kind: reading
    title: "В пекарне очередь"
    md: "13/5-citanje.md"
    exercises:
      - id: "13.5.1"
        type: choice
        prompt: "Чем платит покупатель?"
        options: ["Kešom.", "Karticom.", "Sitno."]
        answer: "Kešom."
      - id: "13.5.2"
        type: choice
        prompt: "Сколько всего?"
        options: ["Sto deset dinara.", "Sto dinara.", "Deset dinara."]
        answer: "Sto deset dinara."

  - id: "13.6"
    kind: practice
    title: "Диктант"
    mixed: true
    exercises:
      - id: "13.6.1"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "Treba mi hleb."
        accept: ["Treba mi hleb."]
      - id: "13.6.2"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "Koliko dugujem?"
        accept: ["Koliko dugujem?"]
      - id: "13.6.3"
        type: listen
        prompt: "Запиши, что слышишь."
        say: "To je sve, hvala."
        accept: ["To je sve, hvala."]

  - id: "13.7"
    kind: checkpoint
    title: "Проверка"
    exercises:
      - id: "13.7.1"
        type: choice
        prompt: "Где купить хлеб?"
        options: ["pekara", "apoteka", "pijaca"]
        answer: "pekara"
      - id: "13.7.2"
        type: match
        prompt: "Соедини"
        pairs:
          - ["prodavnica", "магазин"]
          - ["kesa", "пакет"]
          - ["kusur", "сдача"]
          - ["račun", "чек"]
      - id: "13.7.3"
        type: fill_blank
        prompt: "«У вас есть молоко?» → Da li ___ mleko?"
        accept: ["imate"]
      - id: "13.7.4"
        type: word_bank
        prompt: "Собери: «дайте мне полкило сыра»"
        bank: ["Dajte", "mi", "pola", "kile", "sira"]
        accept: ["Dajte mi pola kile sira."]
      - id: "13.7.5"
        type: translate
        prompt: "Дайте мне полкило сыра."
        accept: ["Dajte mi pola kile sira."]
      - id: "13.7.6"
        type: free
        prompt: "Зайди в магазин: поздоровайся, попроси хлеб и молоко, расплатись — 3–4 фразы."
        sample: "Dobar dan! Treba mi hleb i mleko. Koliko dugujem? Karticom, može?"

  - id: "13.8"
    kind: dialogue
    title: "У пекари"
    scene: "Ты зашёл в пекару за хлебом. За прилавком — продавщица."
    voice: f
    turns:
      - who: npc
        sr: "Dobar dan, izvolite?"
        ru: "Добрый день, слушаю вас?"

      - who: me
        sr: "Dobar dan. Treba mi hleb."
        ru: "Добрый день. Мне нужен хлеб."
        exercise:
          id: "13.8.1"
          type: choice
          prompt: "Поздоровайся и скажи, что тебе нужен хлеб"
          options:
            - "Dobar dan. Treba mi hleb."
            - "Dobar dan. Treba mi kafa."
            - "Laku noć. Treba mi hleb."
          answer: "Dobar dan. Treba mi hleb."
          explain: "«Laku noć» говорят на ночь — в пекару утром это прозвучит странно."

      - who: npc
        sr: "Imamo svež hleb. Koliko komada?"
        ru: "У нас свежий хлеб. Сколько штук?"

      - who: me
        sr: "Dva komada, molim."
        ru: "Две штуки, пожалуйста."
        exercise:
          id: "13.8.2"
          type: fill_blank
          prompt: "«Две штуки, пожалуйста» → ___ komada, molim."
          accept: ["Dva"]
          explain: "«komad» — счётное слово: dva komada, tri komada."

      - who: npc
        sr: "Još nešto?"
        ru: "Ещё что-нибудь?"

      - who: me
        sr: "To je sve. Koliko košta?"
        ru: "Это всё. Сколько стоит?"
        exercise:
          id: "13.8.3"
          type: choice
          prompt: "Скажи, что это всё, и спроси цену"
          options:
            - "To je sve. Koliko košta?"
            - "To je sve. Koliko je sati?"
            - "Još nešto? Koliko košta?"
          answer: "To je sve. Koliko košta?"
          explain: "«Koliko je sati?» — это про время, а не про цену."

      - who: npc
        sr: "Sto dvadeset dinara."
        ru: "Сто двадцать динаров."

      - who: me
        sr: "Može karticom?"
        ru: "Можно картой?"
        exercise:
          id: "13.8.4"
          type: translate
          prompt: "Спроси, можно ли картой"
          accept: ["Može karticom?", "Da li može karticom?", "Mogu karticom?"]

      - who: npc
        sr: "Može. Izvolite račun. Prijatno!"
        ru: "Можно. Вот чек. Всего доброго!"
