lesson: "13"
title: "Что-то не так (Reklamacija)"
subtitle: "испорчено, вернуть, поменять, чек"
teaches: [pokvareno, svez, rok-trajanja, moci, vratiti, zameniti]

steps:
  - id: "13.11"
    kind: teach
    title: "Испорчено или свежее"
    md: "13/11-pokvareno.md"

  - id: "13.12"
    kind: practice
    title: "Запомним: Испорчено или свежее"
    also_ok: ["sveže"]
    exercises:
      - id: "13.12.1"
        type: choice
        prompt: "«Это испорчено» —"
        options: ["Ovo je pokvareno.", "Ovo je sveže.", "Ovo je pekara."]
        answer: "Ovo je pokvareno."

  - id: "13.13"
    kind: teach
    title: "Вернуть"
    md: "13/13-vratiti.md"

  - id: "13.14"
    kind: practice
    title: "Запомним: Вернуть"
    exercises:
      - id: "13.14.1"
        type: choice
        prompt: "«Могу вернуть?» —"
        options: ["Mogu li da vratim?", "Ovo je pokvareno.", "Treba mi hleb."]
        answer: "Mogu li da vratim?"

  - id: "13.15"
    kind: teach
    title: "Поменять"
    md: "13/15-zameniti.md"

  - id: "13.16"
    kind: practice
    title: "Запомним: Поменять"
    also_ok: ["vratim"]
    exercises:
      - id: "13.16.1"
        type: choice
        prompt: "«Могу поменять?» —"
        options: ["Mogu li da zamenim?", "Mogu li da vratim?", "Samo gledam."]
        answer: "Mogu li da zamenim?"

  - id: "13.17"
    kind: teach
    title: "Чек"
    md: "13/17-racun.md"

  - id: "13.18"
    kind: practice
    title: "Запомним: Чек"
    exercises:
      - id: "13.18.1"
        type: choice
        prompt: "«У вас есть чек?» —"
        options: ["Imate li račun?", "Imate li sitno?", "Da li imate jaja?"]
        answer: "Imate li račun?"

  - id: "13.19"
    kind: practice
    title: "Послушай и выбери"
    also_ok: ["vratim", "zamenim"]
    exercises:
      - id: "13.19.1"
        type: choice
        say: "Ovo je pokvareno."
        prompt: "Послушай и выбери перевод."
        options: ["Это испорчено.", "Это свежее.", "Это дорого."]
        answer: "Это испорчено."
      - id: "13.19.2"
        type: choice
        say: "Mogu li da vratim?"
        prompt: "Послушай и выбери перевод."
        options: ["Могу вернуть?", "Могу поменять?", "Можно картой?"]
        answer: "Могу вернуть?"
      - id: "13.19.3"
        type: choice
        say: "Mogu li da zamenim?"
        prompt: "Послушай и выбери перевод."
        options: ["Могу поменять?", "Могу вернуть?", "Можно чек?"]
        answer: "Могу поменять?"
      - id: "13.19.4"
        type: choice
        say: "Imate li račun?"
        prompt: "Послушай и выбери перевод."
        options: ["У вас есть чек?", "У вас есть мелочь?", "У вас есть пакет?"]
        answer: "У вас есть чек?"

  - id: "13.20"
    kind: practice
    title: "Что скажешь?"
    also_ok: ["vratim", "zamenim"]
    exercises:
      - id: "13.20.1"
        type: choice
        prompt: "Молоко испортилось. Ты говоришь —"
        options: ["Ovo je pokvareno.", "Ovo je sveže.", "Samo gledam."]
        answer: "Ovo je pokvareno."
      - id: "13.20.2"
        type: choice
        prompt: "Ты хочешь вернуть товар —"
        options: ["Mogu li da vratim?", "Mogu li da zamenim?", "Kešom ili karticom?"]
        answer: "Mogu li da vratim?"
      - id: "13.20.3"
        type: choice
        prompt: "Ты хочешь обменять товар —"
        options: ["Mogu li da zamenim?", "Mogu li da vratim?", "Imate li račun?"]
        answer: "Mogu li da zamenim?"

  - id: "13.21"
    kind: practice
    title: "Соедини"
    also_ok: ["sveže"]
    exercises:
      - id: "13.21.1"
        type: match
        prompt: "Соедини слово и перевод"
        pairs:
          - ["pokvareno", "испорчено"]
          - ["sveže", "свежее"]
          - ["rok trajanja", "срок годности"]
          - ["vratiti", "вернуть"]
          - ["zameniti", "поменять"]
          - ["račun", "чек"]

  - id: "13.22"
    kind: practice
    title: "Собери"
    also_ok: ["vratim", "zamenim"]
    exercises:
      - id: "13.22.1"
        type: word_bank
        prompt: "Собери: «могу вернуть?»"
        bank: ["Mogu", "li", "da", "vratim", "zamenim"]
        accept: ["Mogu li da vratim?"]
      - id: "13.22.2"
        type: word_bank
        prompt: "Собери: «у вас есть чек?»"
        bank: ["Imate", "li", "račun", "sitno"]
        accept: ["Imate li račun?"]

  - id: "13.23"
    kind: practice
    title: "Напиши"
    also_ok: ["zamenim", "sveže"]
    exercises:
      - id: "13.23.1"
        type: fill_blank
        prompt: "«Это испорчено» → Ovo je ___."
        accept: ["pokvareno"]
      - id: "13.23.2"
        type: fill_blank
        prompt: "«Могу поменять?» → Mogu li da ___?"
        accept: ["zamenim"]
      - id: "13.23.3"
        type: translate
        prompt: "Это испорчено."
        accept: ["Ovo je pokvareno.", "To je pokvareno."]
      - id: "13.23.4"
        type: translate
        prompt: "Могу вернуть?"
        accept: ["Mogu li da vratim?"]
