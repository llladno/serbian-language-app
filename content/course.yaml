lessons:
  "00":
    title: "Кириллица и латиница (Ćirilica i latinica)"
    subtitle: "два писма, једно произношење"
    file: "lessons/00.yaml"
  "01":
    title: "Особые звуки (Specifični glasovi)"
    subtitle: "особые буквы č ć š ž đ dž lj nj, проверка"
    file: "lessons/01.yaml"
  "02":
    title: "Привет! (Zdravo!)"
    subtitle: "приветствия, как дела, ты/вы"
    file: "lessons/02.yaml"
  "03":
    title: "Пожалуйста, спасибо (Molim, hvala)"
    subtitle: "вежливые слова, текст, диктант, проверка"
    file: "lessons/03.yaml"
  "04":
    title: "Это я (Jesam ja)"
    subtitle: "глагол быть, откуда я, где живу"
    file: "lessons/04.yaml"
  "05":
    title: "Говорим и работаем (Govorimo i radimo)"
    subtitle: "языки, профессии, текст, диалог, проверка"
    file: "lessons/05.yaml"
  "06":
    title: "Семья (Porodica)"
    subtitle: "семья, imam / nemam"
    file: "lessons/06.yaml"
  "07":
    title: "Мой, твой (Moj, tvoj)"
    subtitle: "притяжательные, текст, проверка"
    file: "lessons/07.yaml"
  "08":
    title: "Числа (Brojevi)"
    subtitle: "числа 0–100 и число+существительное"
    file: "lessons/08.yaml"
  "09":
    title: "Цена и возраст (Cena i godine)"
    subtitle: "цена, возраст"
    file: "lessons/09.yaml"
  "10":
    title: "Часы и телефон (Sati i telefon)"
    subtitle: "часы, телефон, текст, проверка"
    file: "lessons/10.yaml"
  "11":
    title: "В магазин (U prodavnicu)"
    subtitle: "магазин, первые слова"
    file: "lessons/11.yaml"
  "12":
    title: "Количество и оплата (Količina i plaćanje)"
    subtitle: "сколько, ещё что-нибудь, оплата"
    file: "lessons/12.yaml"
  "13":
    title: "Возврат товара (Reklamacija)"
    subtitle: "возврат, очередь, текст, диалог, проверка"
    file: "lessons/13.yaml"
  "14":
    title: "Проверка 1а (Provera 1a)"
    subtitle: "приветствия, семья, числа/цена/время"
    file: "lessons/14.yaml"
  "15":
    title: "Проверка 1б (Provera 1b)"
    subtitle: "в магазине, ролёвки"
    file: "lessons/15.yaml"
  "16":
    title: "Повседневность (Svakodnevnica)"
    subtitle: "настоящее время, мой день, дни недели"
    file: "lessons/16.yaml"
  "17":
    title: "Привычки (Navike)"
    subtitle: "как часто, volim / moram da, проверка"
    file: "lessons/17.yaml"
  "18":
    title: "Квартира (Stan)"
    subtitle: "дом, комнаты, вещи"
    file: "lessons/18.yaml"
  "19":
    title: "В / на (U / na)"
    subtitle: "предлоги места, ima/nema, проверка"
    file: "lessons/19.yaml"
  "20":
    title: "Еда дома (Hrana kod kuće)"
    subtitle: "еда, напитки"
    file: "lessons/20.yaml"
  "21":
    title: "Я голоден (Gladan sam)"
    subtitle: "голоден / хочу пить, в кафе"
    file: "lessons/21.yaml"
  "22":
    title: "Счёт, пожалуйста (Račun, molim)"
    subtitle: "счёт, вкусно?, проверка"
    file: "lessons/22.yaml"
  "23":
    title: "Вопросы 1 (Pitanja 1)"
    subtitle: "да/нет-вопрос, вопросительные слова, koji/kakav/čiji"
    file: "lessons/23.yaml"
  "24":
    title: "Почему? (Zašto?)"
    subtitle: "почему, переспрос"
    file: "lessons/24.yaml"
  "25":
    title: "Город (Grad)"
    subtitle: "где что, как пройти, проверка"
    file: "lessons/25.yaml"
  "26":
    title: "Погода (Vreme)"
    subtitle: "погода, тепло/холодно, времена года"
    file: "lessons/26.yaml"
  "27":
    title: "Мне нравится (Sviđa mi se)"
    subtitle: "нравится, природа, проверка"
    file: "lessons/27.yaml"
  "28":
    title: "Проверка 2а (Provera 2a)"
    subtitle: "мой день, дом, еда/кафе"
    file: "lessons/28.yaml"
  "29":
    title: "Проверка 2б (Provera 2b)"
    subtitle: "город, погода, ролёвки"
    file: "lessons/29.yaml"
  "30":
    title: "Прошлое I (Prošlost I)"
    subtitle: "перфект — ja/ti/on, глаголы на -o/-la/-lo"
    file: "lessons/30.yaml"
  "31":
    title: "Прошлое II (Prošlost II)"
    subtitle: "перфект — mi/vi/oni, отрицание, порядок слов"
    file: "lessons/31.yaml"
  "32":
    title: "Проверка: прошлое (Provera: prošlost)"
    subtitle: "перфект, вид глагола, текст, рассказ о вчера"
    file: "lessons/32.yaml"
  "33":
    title: "Планы (Planovi)"
    subtitle: "футур ću/ćeš, da-конструкция, čim/kad"
    file: "lessons/33.yaml"
  "34":
    title: "Передвижение (Kretanje)"
    subtitle: "транспорт, instrumental, прошедшее: išao, došao, mogao"
    file: "lessons/34.yaml"
  "35":
    title: "Вывески и транспорт (Natpisi i prevoz)"
    subtitle: "вывески, следующий автобус, направления"
    file: "lessons/35.yaml"
  "36":
    title: "Проверка: планы и передвижение (Provera: planovi i kretanje)"
    subtitle: "футур, инструментал, план на выходные"
    file: "lessons/36.yaml"
  "37":
    title: "Договорённости и приёмы (Dogovori i termini)"
    subtitle: "записаться, позвать, договориться о времени"
    file: "lessons/37.yaml"
  "38":
    title: "Отмена и извинения (Otkazivanje i izvinjenje)"
    subtitle: "перенести, отменить, извиниться"
    file: "lessons/38.yaml"
  "39":
    title: "Тело и здоровье (Telo i zdravlje)"
    subtitle: "части тела, самочувствие, у врача"
    file: "lessons/39.yaml"
  "40":
    title: "В аптеке (U apoteci)"
    subtitle: "симптомы, boli me, рецепт, лекарства"
    file: "lessons/40.yaml"
  "41":
    title: "Проверка 3 (Provera 3)"
    subtitle: "весь уровень 3, большие ролёвки"
    file: "lessons/41.yaml"
  "42":
    title: "Род и число (Rod i broj)"
    subtitle: "мужской, женский, средний род; множественное число"
    file: "lessons/42.yaml"
  "43":
    title: "Какой? (Kakav?)"
    subtitle: "прилагательные: dobar / dobra / dobro, описать человека и вещь"
    file: "lessons/43.yaml"
  "44":
    title: "Винительный I (Akuzativ I)"
    subtitle: "кого? что? — vidim ženu, kupujem hleb"
    file: "lessons/44.yaml"
  "45":
    title: "Покупки и заказ (Kupovina i narudžbina)"
    subtitle: "винительный в магазине и кафе, с прилагательными"
    file: "lessons/45.yaml"
  "46":
    title: "Родительный I (Genitiv I)"
    subtitle: "нет, из, до, от, у — nema hleba, do stanice"
    file: "lessons/46.yaml"
  "47":
    title: "Родительный II (Genitiv II)"
    subtitle: "количество и мн. ч.: pet dinara, litar mleka"
    file: "lessons/47.yaml"
  "48":
    title: "Проверка 4а (Provera 4a)"
    subtitle: "род, число, прилагательные, винительный, родительный"
    file: "lessons/48.yaml"
  "49":
    title: "Локатив (Lokativ)"
    subtitle: "где и о ком: u sobi, na trgu, o filmu"
    file: "lessons/49.yaml"
  "50":
    title: "Квартира и город (Stan i grad)"
    subtitle: "снять жильё, объяснить где что"
    file: "lessons/50.yaml"
  "51":
    title: "Дательный (Dativ)"
    subtitle: "кому? — dajem sestri, sviđa mi se, treba mi"
    file: "lessons/51.yaml"
  "52":
    title: "Просьбы и помощь (Molbe i pomoć)"
    subtitle: "попросить, помочь, подарить"
    file: "lessons/52.yaml"
  "53":
    title: "Творительный (Instrumental)"
    subtitle: "с кем? чем? — sa prijateljem, nožem"
    file: "lessons/53.yaml"
  "54":
    title: "Местоимения по падежам (Zamenice po padežima)"
    subtitle: "я, ты, он, она, мы, вы, они — во всех падежах"
    file: "lessons/54.yaml"
  "55":
    title: "Друзья и планы (Prijatelji i planovi)"
    subtitle: "встретиться, пригласить, договориться; hajde da"
    file: "lessons/55.yaml"
  "56":
    title: "Переписка (Poruke)"
    subtitle: "сообщения, обращения, «стриженая» латиница"
    file: "lessons/56.yaml"
  "57":
    title: "Порядковые числа и даты (Redni brojevi i datumi)"
    subtitle: "prvi, drugi, treći; datum, sprat"
    file: "lessons/57.yaml"
  "58":
    title: "Проверка 4б (Provera 4b)"
    subtitle: "локатив, дательный, творительный, местоимения"
    file: "lessons/58.yaml"
  "59":
    title: "Большая проверка 4 (Velika provera 4)"
    subtitle: "все падежи, ролёвки"
    file: "lessons/59.yaml"
  "60":
    title: "Чувства (Osećanja)"
    subtitle: "как ты себя чувствуешь, базовые эмоции"
  "61":
    title: "Мнения (Mišljenja)"
    subtitle: "mislim da, slažem se, нравится / раздражает"
  "62":
    title: "Рассказ о себе I (Priča o sebi I)"
    subtitle: "биография, детство, школа"
  "63":
    title: "Рассказ о себе II (Priča o sebi II)"
    subtitle: "взрослая жизнь, планы"
  "64":
    title: "Телефон (Telefon)"
    subtitle: "звонки, javiću se, договориться о звонке"
  "65":
    title: "Проблемы (Problemi)"
    subtitle: "жалоба, что сломалось, kvar"
  "66":
    title: "Решения (Rešenja)"
    subtitle: "вызвать мастера, договориться о ремонте, сроки"
  "67":
    title: "Проверка 5а (Provera 5a)"
    subtitle: "чувства, мнения, рассказ о себе, телефон, проблемы"
  "68":
    title: "Свободное время (Slobodno vreme)"
    subtitle: "хобби, спорт, приглашения, hajde da"
  "69":
    title: "Работа I (Posao I)"
    subtitle: "рабочее место, задачи, коллеги, rok"
  "70":
    title: "Работа II (Posao II)"
    subtitle: "собеседование, резюме, sastanak"
  "71":
    title: "Бумаги (Papirologija)"
    subtitle: "банк, карта, boravak"
  "72":
    title: "Адрес и документы (Adresa i dokumenti)"
    subtitle: "prijava adrese, документы"
  "73":
    title: "Стандартный и новосадский (Standard i novosadski)"
    subtitle: "войводинские словечки, кофейная культура"
  "74":
    title: "Small talk (Small talk)"
    subtitle: "поддержать беседу, реагировать, вставные фразы"
  "75":
    title: "Длинный разговор (Dug razgovor)"
    subtitle: "рассказать историю целиком, беглость"
  "76":
    title: "Читаю и слушаю (Čitanje i slušanje)"
    subtitle: "новости, вывески, сериалы без субтитров"
  "77":
    title: "Большая проверка (Velika provera)"
    subtitle: "итоговые ролёвки, план дальше"
