# Решения по ударениям, которые scripts/check_stress.py считает закрытыми.
#
# Сюда попадает слово, где Wiktionary (хорватская норма) расходится с курсом, но
# проверка показала, что курс прав — например, у носителя или в сербском
# словаре с ударениями. Если прав Wiktionary — исправь `transcription` в
# vocab.yaml, запись здесь не нужна: расхождение исчезнет само.
#
# `transcription` — ровно как в vocab.yaml. Изменится транскрипция — решение
# теряет силу и слово вернётся в очередь (docs/stress-queue.md).
# `source` обязателен: кто и по чему проверил. Выдумывать нельзя.
#
# keep:
#   - latin: putovati
#     transcription: "пу́товати"
#     source: "кто / что / дата"
#     note: "сербская норма: ПУ-товати"
keep: []
