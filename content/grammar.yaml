# Грамматические карточки для повторения (SRS) — независимо от словаря.
# lesson: урок, где правило вводится (задаёт порядок открытия новых карточек,
# как lesson у vocab.yaml). front/note — заголовок и подсказка карточки.
# items: список отдельных вопросов ("прошпрягай для ti", "какой род") —
# на каждом повторении показывается ОДИН случайный item, ответ проверяется
# по-настоящему (как fill_blank), а не самооценкой.

- id: "jesam"
  front: "jesam — быть, презент (настоящее время)"
  note: "ja sam, ti si, on/ona/ono je, mi smo, vi ste, oni/one/ona su"
  lesson: "04"
  example_sr: "Ja sam iz Rusije."
  example_ru: "Я из России."
  items:
    - prompt: "ja (я)"
      accept: ["sam"]
    - prompt: "ti (ты)"
      accept: ["si"]
    - prompt: "on/ona/ono (он/она/оно)"
      accept: ["je"]
    - prompt: "mi (мы)"
      accept: ["smo"]
    - prompt: "vi (вы)"
      accept: ["ste"]
    - prompt: "oni/one/ona (они)"
      accept: ["su"]

- id: "imati"
  front: "imati — иметь, презент (настоящее время, + nemati)"
  note: "отрицание — отдельный глагол nemati: nemam, nemaš, nema…"
  lesson: "06"
  example_sr: "Imam brata. Nemam sestru."
  example_ru: "У меня есть брат. У меня нет сестры."
  items:
    - prompt: "ja (я)"
      accept: ["imam"]
    - prompt: "ti (ты)"
      accept: ["imaš"]
    - prompt: "on/ona/ono (он/она/оно)"
      accept: ["ima"]
    - prompt: "mi (мы)"
      accept: ["imamo"]
    - prompt: "vi (вы)"
      accept: ["imate"]
    - prompt: "oni/one/ona (они)"
      accept: ["imaju"]

- id: "moj-tvoj"
  front: "moj / tvoj — согласование по роду"
  note: "притяжательное согласуется с родом предмета, не с говорящим"
  lesson: "07"
  example_sr: "Moja mama, moj tata, moje dete."
  example_ru: "Моя мама, мой папа, моё дитя."
  items:
    - prompt: "moj + mama (ж.р.)"
      accept: ["moja"]
    - prompt: "moj + tata (м.р.)"
      accept: ["moj"]
    - prompt: "moj + dete (ср.р.)"
      accept: ["moje"]
    - prompt: "tvoj + brat (м.р.)"
      accept: ["tvoj"]
    - prompt: "tvoj + sestra (ж.р.)"
      accept: ["tvoja"]
    - prompt: "tvoj + dete (ср.р.)"
      accept: ["tvoje"]

- id: "prezent-am"
  front: "презент, тип -am: čitati — читать (настоящее время)"
  note: "тип -am: znati, gledati, slušati…"
  lesson: "16"
  example_sr: "Čitam knjigu."
  example_ru: "Я читаю книгу."
  items:
    - prompt: "ja (я)"
      accept: ["čitam"]
    - prompt: "ti (ты)"
      accept: ["čitaš"]
    - prompt: "on/ona/ono (он/она/оно)"
      accept: ["čita"]
    - prompt: "mi (мы)"
      accept: ["čitamo"]
    - prompt: "vi (вы)"
      accept: ["čitate"]
    - prompt: "oni/one/ona (они)"
      accept: ["čitaju"]

- id: "prezent-im"
  front: "презент, тип -im: raditi — работать (настоящее время)"
  note: "тип -im: živeti, govoriti, učiti, misliti…"
  lesson: "16"
  example_sr: "Radim ceo dan."
  example_ru: "Я работаю весь день."
  items:
    - prompt: "ja (я)"
      accept: ["radim"]
    - prompt: "ti (ты)"
      accept: ["radiš"]
    - prompt: "on/ona/ono (он/она/оно)"
      accept: ["radi"]
    - prompt: "mi (мы)"
      accept: ["radimo"]
    - prompt: "vi (вы)"
      accept: ["radite"]
    - prompt: "oni/one/ona (они)"
      accept: ["rade"]

- id: "prezent-em"
  front: "презент, тип -em: pisati — писать (настоящее время)"
  note: "тип -em: ići → idem, razumeti → razumem (неправильные по основе)"
  lesson: "16"
  example_sr: "Pišem poruku."
  example_ru: "Я пишу сообщение."
  items:
    - prompt: "ja (я)"
      accept: ["pišem"]
    - prompt: "ti (ты)"
      accept: ["pišeš"]
    - prompt: "on/ona/ono (он/она/оно)"
      accept: ["piše"]
    - prompt: "mi (мы)"
      accept: ["pišemo"]
    - prompt: "vi (вы)"
      accept: ["pišete"]
    - prompt: "oni/one/ona (они)"
      accept: ["pišu"]

- id: "u-na"
  front: "u / na — где (место)"
  note: "u — «внутри», na — «на поверхности» или у некоторых мест по традиции (na poslu, na fakultetu)"
  lesson: "19"
  example_sr: "Knjiga je na stolu, a ja sam u sobi."
  example_ru: "Книга на столе, а я в комнате."
  items:
    - prompt: "___ sobi (в комнате)"
      accept: ["u"]
    - prompt: "___ kući (дома)"
      accept: ["u"]
    - prompt: "___ gradu (в городе)"
      accept: ["u"]
    - prompt: "___ poslu (на работе)"
      accept: ["na"]
    - prompt: "___ stolu (на столе)"
      accept: ["na"]
    - prompt: "___ ulici (на улице)"
      accept: ["na"]

- id: "koji-kakav-ciji"
  front: "koji / kakav / čiji — три «какой»"
  note: "koji — который (из ряда), kakav — какой (по качеству), čiji — чей; все три меняются по роду"
  lesson: "23"
  example_sr: "Koji autobus? Kakav je stan? Čiji je ovo ključ?"
  example_ru: "Какой автобус? Какая квартира? Чей это ключ?"
  items:
    - prompt: "который — м.р."
      accept: ["koji"]
    - prompt: "который — ж.р."
      accept: ["koja"]
    - prompt: "который — ср.р."
      accept: ["koje"]
    - prompt: "какой (по качеству) — м.р."
      accept: ["kakav"]
    - prompt: "какой (по качеству) — ж.р."
      accept: ["kakva"]
    - prompt: "какой (по качеству) — ср.р."
      accept: ["kakvo"]
    - prompt: "чей — м.р."
      accept: ["čiji"]
    - prompt: "чей — ж.р."
      accept: ["čija"]
    - prompt: "чей — ср.р."
      accept: ["čije"]

- id: "perfekt"
  front: "перфект — прошедшее время: raditi (работать)"
  note: "sam/si/je (урок 04) + причастие: инфинитив без -ti + -o/-la/-lo, по роду того, о ком речь"
  lesson: "30"
  example_sr: "Radio sam juče."
  example_ru: "Я работал вчера."
  items:
    - prompt: "ja, radio je muškarac (я, говорит мужчина)"
      accept: ["radio sam"]
    - prompt: "ja, radila je žena (я, говорит женщина)"
      accept: ["radila sam"]
    - prompt: "ti, muškarac (ты, о мужчине)"
      accept: ["radio si"]
    - prompt: "ti, žena (ты, о женщине)"
      accept: ["radila si"]
    - prompt: "on (он)"
      accept: ["radio je"]
    - prompt: "ona (она)"
      accept: ["radila je"]

- id: "vid-glagola"
  front: "вид глагола: kupovati / kupiti — покупать / купить"
  note: "несовершенный (процесс) vs. совершенный (законченное действие) — как в русском; в перфекте спрягаются одинаково"
  lesson: "30"
  example_sr: "Kupovao sam hleb. Kupio sam hleb."
  example_ru: "Я покупал хлеб (процесс). Я купил хлеб (сделано)."
  items:
    - prompt: "покупал (процесс, муж.)"
      accept: ["kupovao sam"]
    - prompt: "купил (результат, муж.)"
      accept: ["kupio sam"]
    - prompt: "покупала (процесс, жен.)"
      accept: ["kupovala sam"]
    - prompt: "купила (результат, жен.)"
      accept: ["kupila sam"]

- id: "futur"
  front: "футур — будущее время: raditi (работать)"
  note: "ću/ćeš/će/ćemo/ćete/će + da + наст. время (ću da radim) или + инфинитив (ću raditi, слитно — radiću)"
  lesson: "33"
  example_sr: "Sutra ću da radim."
  example_ru: "Я буду работать завтра."
  items:
    - prompt: "ja (я)"
      accept: ["ću da radim", "radiću", "ću raditi"]
    - prompt: "ti (ты)"
      accept: ["ćeš da radiš", "radićeš", "ćeš raditi"]
    - prompt: "on/ona (он/она)"
      accept: ["će da radi", "radiće", "će raditi"]
    - prompt: "mi (мы)"
      accept: ["ćemo da radimo", "radićemo", "ćemo raditi"]
    - prompt: "vi (вы)"
      accept: ["ćete da radite", "radićete", "ćete raditi"]
    - prompt: "oni (они)"
      accept: ["će da rade", "radiće", "će raditi"]

- id: "instrumental-transport"
  front: "инструментал транспорта: autobus → autobusom"
  note: "к основе добавь -om (или -em после č/ć/š/ž/j/lj/nj); у слов на -a/-o окончание заменяется: sestra → sestrom, auto → autom"
  lesson: "34"
  example_sr: "Idem autobusom."
  example_ru: "Я еду на автобусе."
  items:
    - prompt: "voz (поезд)"
      accept: ["vozom"]
    - prompt: "avion (самолёт)"
      accept: ["avionom"]
    - prompt: "auto (машина)"
      accept: ["autom"]
    - prompt: "bicikl (велосипед)"
      accept: ["biciklom"]
    - prompt: "taksi (такси)"
      accept: ["taksijem"]
    - prompt: "sestra (сестра) — «с сестрой»"
      accept: ["sestrom", "sa sestrom"]

- id: "mnozina"
  front: "множественное число: stan → stanovi, sestra → sestre, pivo → piva"
  note: "м. длинное +i (lekar → lekari), м. короткое +ovi/evi (stan → stanovi, ključ → ključevi), ж. -a → -e, ср. -o/-e → -a; исключения: dan → dani, dete → deca, čovek → ljudi"
  lesson: "42"
  example_sr: "Ovo su moje sestre."
  example_ru: "Это мои сёстры."
  items:
    - prompt: "stan (квартира) — много"
      accept: ["stanovi"]
    - prompt: "sestra (сестра) — много"
      accept: ["sestre"]
    - prompt: "pivo (пиво) — много"
      accept: ["piva"]
    - prompt: "student (студент) — много"
      accept: ["studenti"]
    - prompt: "ključ (ключ) — много"
      accept: ["ključevi"]
    - prompt: "dan (день) — много"
      accept: ["dani"]

- id: "prilagatelno-rod"
  front: "прилагательное по роду: nov / nova / novo, мн. novi / nove / nova"
  note: "прилагательное совпадает с существительным в роде, числе и падеже; м. ед. ч. — без окончания, перед и после je"
  lesson: "43"
  example_sr: "Stan je nov. Soba je nova."
  example_ru: "Квартира новая. Комната новая."
  items:
    - prompt: "nov + soba (комната) — «новая комната»"
      accept: ["nova soba"]
    - prompt: "nov + selo (село) — «новое село»"
      accept: ["novo selo"]
    - prompt: "dobar + kafa (кофе) — «хороший кофе»"
      accept: ["dobra kafa"]
    - prompt: "«Квартира дорогая»: Stan je ___ (skup)"
      accept: ["skup"]
    - prompt: "torbe (сумки, мн.) — «новые сумки»"
      accept: ["nove torbe"]

- id: "akuzativ"
  front: "винительный: koga? šta? — sestra → sestru, brat → brata, hleb → hleb"
  note: "ж. на -a: -a → -u; м. одушевлённое: +a; м. вещь и ср. — без изменений; мн.: -e (м., ж.), -a (ср.). Идти «куда?» (u, na) — тоже винительный"
  lesson: "44"
  example_sr: "Vidim sestru i brata."
  example_ru: "Вижу сестру и брата."
  items:
    - prompt: "sestra (сестра) — «вижу ...»"
      accept: ["sestru"]
    - prompt: "knjiga (книга) — «читаю ...»"
      accept: ["knjigu"]
    - prompt: "brat (брат, человек) — «вижу ...»"
      accept: ["brata"]
    - prompt: "hleb (хлеб, вещь) — «покупаю ...»"
      accept: ["hleb"]
    - prompt: "škola (школа) — «иду в ...»"
      accept: ["školu", "u školu"]
    - prompt: "prijatelji (друзья) — «вижу ...»"
      accept: ["prijatelje"]

- id: "treba-mi"
  front: "treba mi / trebaju mi: слово — в именительном"
  note: "после «tražim, želim, dajte mi, za mene» — винительный; после «treba mi» — именительный (это подлежащее)"
  lesson: "45"
  example_sr: "Treba mi nova torba. Trebaju mi nove cipele."
  example_ru: "Мне нужна новая сумка. Мне нужны новые туфли."
  items:
    - prompt: "nova torba — «Мне нужна ...»"
      accept: ["treba mi nova torba"]
    - prompt: "nove cipele — «Мне нужны ...»"
      accept: ["trebaju mi nove cipele"]
    - prompt: "crna torba — «Я ищу ...»"
      accept: ["tražim crnu torbu"]

- id: "genitiv"
  front: "родительный: kogo? čega? — hleb → hleba, voda → vode, mleko → mleka"
  note: "м. +a, ж. -a → -e, ср. -o/-e → -a (vreme → vremena, dete → deteta); после nema/nemam, iz, do, od, kod, bez, pored, blizu, iza, ispred, posle, pre"
  lesson: "46"
  example_sr: "Nema hleba. Kafa bez šećera."
  example_ru: "Нет хлеба. Кофе без сахара."
  items:
    - prompt: "hleb — «нет ...»"
      accept: ["hleba"]
    - prompt: "voda — «нет ...»"
      accept: ["vode"]
    - prompt: "mleko — «нет ...»"
      accept: ["mleka"]
    - prompt: "vreme — «нет ...»"
      accept: ["vremena"]
    - prompt: "stanica — «до ...»"
      accept: ["stanice", "do stanice"]
    - prompt: "šećer — «без ...»"
      accept: ["šećera", "bez šećera"]

- id: "broj-imenica"
  front: "число + существительное: 1 — именительный, 2–4 — родительный ед., 5+ — родительный мн."
  note: "как в русском: один рубль, два рубля, пять рублей. jedan dinar, dva dinara, pet dinara; tri sata, pet sati; dve sobe, pet soba"
  lesson: "47"
  example_sr: "Jedan dinar, dva dinara, pet dinara."
  example_ru: "Один динар, два динара, пять динаров."
  items:
    - prompt: "dinar: 1"
      accept: ["jedan dinar"]
    - prompt: "dinar: 2"
      accept: ["dva dinara"]
    - prompt: "dinar: 5"
      accept: ["pet dinara"]
    - prompt: "sat: 3"
      accept: ["tri sata"]
    - prompt: "sat: 5"
      accept: ["pet sati"]
    - prompt: "godina: 30 (мне 30 лет)"
      accept: ["trideset godina", "imam trideset godina"]

- id: "lokativ"
  front: "локатив: gde? o čemu? — grad → u gradu, soba → u sobi, selo → na selu"
  note: "м., ср. +u (-o/-e → -u); ж. -a → -i (k→c, g→z, h→s: apoteka → apoteci); прилагательное -om (м., ср.), -oj (ж.); идти (куда?) — винительный, быть (где?) — локатив"
  lesson: "49"
  example_sr: "Živim u malom gradu."
  example_ru: "Живу в маленьком городе."
  items:
    - prompt: "grad — «в ...»"
      accept: ["gradu", "u gradu"]
    - prompt: "soba — «в ...»"
      accept: ["sobi", "u sobi"]
    - prompt: "selo — «в ...» (на ...)"
      accept: ["selu", "na selu"]
    - prompt: "apoteka — «в ...»"
      accept: ["apoteci", "u apoteci"]
    - prompt: "posao — «на ...» (работе)"
      accept: ["poslu", "na poslu"]
    - prompt: "veliki grad — «в большом городе»"
      accept: ["u velikom gradu"]

- id: "dativ"
  front: "дательный: kome? čemu? — sestra → sestri, brat → bratu"
  note: "по форме совпадает с локативом, но стоит без предлога; сокращённые формы: mi, ti, mu, joj, nam, vam, im"
  lesson: "51"
  example_sr: "Pišem sestri. Sviđa mi se ova torba."
  example_ru: "Пишу сестре. Мне нравится эта сумка."
  items:
    - prompt: "sestra — «пишу ...»"
      accept: ["sestri"]
    - prompt: "brat — «пишу ...»"
      accept: ["bratu"]
    - prompt: "dete — «даю ...»"
      accept: ["detetu"]
    - prompt: "ja (мне) — «Sviđa ___ se»"
      accept: ["mi"]
    - prompt: "ona (ей) — «Pišem ___»"
      accept: ["joj"]
    - prompt: "oni (им) — «Pišem ___»"
      accept: ["im"]

- id: "imperativ"
  front: "просьба (повелительное): čekati → čekaj / čekajte, pisati → piši / pišite"
  note: "-ati: -aj / -ajte; остальные: -i / -ite; отрицание — ne + форма: ne žurite"
  lesson: "52"
  example_sr: "Pišite mi, molim vas."
  example_ru: "Пишите мне, пожалуйста."
  items:
    - prompt: "čekati — «подождите» (вы)"
      accept: ["čekajte"]
    - prompt: "čekati — «подожди» (ты)"
      accept: ["čekaj"]
    - prompt: "pisati — «пишите» (вы)"
      accept: ["pišite"]
    - prompt: "slušati — «слушайте» (вы)"
      accept: ["slušajte"]

- id: "instrumental"
  front: "творительный: s kim? čim? — brat → bratom, sestra → sestrom"
  note: "м., ср. -om (после č, ć, š, ž, j — -em); ж. -a → -om; прилагательное -im (м., ср.), -om (ж.); sa = с; subotom = по субботам"
  lesson: "53"
  example_sr: "Idem sa sestrom. Pijem kafu sa mlekom."
  example_ru: "Иду с сестрой. Пью кофе с молоком."
  items:
    - prompt: "sestra — «с ...»"
      accept: ["sestrom", "sa sestrom"]
    - prompt: "prijatelj — «с ...»"
      accept: ["prijateljem", "sa prijateljem"]
    - prompt: "mleko — «кофе с ...»"
      accept: ["mlekom", "sa mlekom"]
    - prompt: "olovka — «пишу ...»"
      accept: ["olovkom"]
    - prompt: "novi prijatelj — «с новым другом»"
      accept: ["sa novim prijateljem"]

- id: "zamenice"
  front: "местоимения: ja, ti, on, ona, mi, vi, oni во всех падежах"
  note: "две формы: короткая (без ударения, на втором месте) и длинная (после предлога): me/mene, te/tebe, ga/njega, je/nju, nas, vas, ih/njih; mi/meni, ti/tebi, mu/njemu, joj/njoj, nam/nama, vam/vama, im/njima; instr.: mnom, tobom, njim, njom"
  lesson: "54"
  example_sr: "Vidim te. Pišem ti. Idem sa tobom."
  example_ru: "Вижу тебя. Пишу тебе. Иду с тобой."
  items:
    - prompt: "я вижу тебя: Vidim ___"
      accept: ["te"]
    - prompt: "я пишу тебе: Pišem ___"
      accept: ["ti"]
    - prompt: "я вижу её: Vidim ___"
      accept: ["je"]
    - prompt: "я пишу ей: Pišem ___"
      accept: ["joj"]
    - prompt: "со мной: sa ___"
      accept: ["mnom"]
    - prompt: "для тебя: za ___"
      accept: ["tebe"]

- id: "vokativ"
  front: "вокатив (обращение): Ana → Ano, brat → brate, mama → mamo"
  note: "ж. на -a: -o; м. на согласную: +e (Petar → Petre); м. на -o и -a не меняются; в речи часто остаётся имя как есть"
  lesson: "56"
  example_sr: "Zdravo, Ano! Hvala, sestro!"
  example_ru: "Привет, Ана! Спасибо, сестра!"
  items:
    - prompt: "Ana — «Привет, ___!»"
      accept: ["Ano"]
    - prompt: "sestra — «Спасибо, ___!»"
      accept: ["sestro"]
    - prompt: "brat — «Извини, ___»"
      accept: ["brate"]
    - prompt: "mama — «Доброе утро, ___!»"
      accept: ["mamo"]

- id: "redni-brojevi"
  front: "порядковые числа и даты: peti maj, petog maja"
  note: "prvi, drugi, treći, četvrti, peti…; число + -i (dvanaesti); дата «когда» — порядковое и месяц в родительном: petog maja; этаж — na trećem spratu"
  lesson: "57"
  example_sr: "Termin je petog marta. Živim na trećem spratu."
