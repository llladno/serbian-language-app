lesson: "05"
blocks:
  - id: "A"
    title: "Где это купить?"
    instruction: "Впиши магазин: pekara / mesara / apoteka / piljara / trafika. В ответе — одно слово."
    exercises:
      - id: "05-A-1"
        type: fill_blank
        prompt: "hleb i burek — ___"
        accept: ["pekara", "u pekari"]
      - id: "05-A-2"
        type: fill_blank
        prompt: "meso — ___"
        accept: ["mesara", "u mesari"]
      - id: "05-A-3"
        type: fill_blank
        prompt: "lekovi — ___"
        accept: ["apoteka", "u apoteci"]
      - id: "05-A-4"
        type: fill_blank
        prompt: "voće i povrće — ___"
        accept: ["piljara", "pijaca", "u piljari"]
      - id: "05-A-5"
        type: fill_blank
        prompt: "novine i voda na kiosku — ___"
        accept: ["trafika"]

  - id: "B"
    title: "Переведи на сербский"
    instruction: "Латиницей. Регистр и финальная пунктуация не важны."
    exercises:
      - id: "05-B-1"
        type: translate
        prompt: "У вас есть свежий хлеб?"
        accept:
          - "Da li imate svež hleb?"
          - "Imate li svež hleb?"
          - "Da li imate svez hleb?"
      - id: "05-B-2"
        type: translate
        prompt: "Дайте мне полкило помидоров."
        accept:
          - "Dajte mi pola kile paradajza."
          - "Pola kile paradajza, molim."
      - id: "05-B-3"
        type: translate
        prompt: "Два куска бурека, пожалуйста."
        accept:
          - "Dva komada bureka, molim."
          - "Dva bureka, molim."
      - id: "05-B-4"
        type: translate
        prompt: "Это всё, спасибо."
        accept:
          - "To je sve, hvala."
          - "Samo to, hvala."
      - id: "05-B-5"
        type: translate
        prompt: "Сколько с меня?"
        accept:
          - "Koliko dugujem?"
          - "Koliko sve zajedno?"
      - id: "05-B-6"
        type: translate
        prompt: "Пакет не нужен, спасибо."
        accept:
          - "Kesa ne treba, hvala."
          - "Ne treba kesa, hvala."
          - "Bez kese, hvala."
      - id: "05-B-7"
        type: translate
        prompt: "Можно картой?"
        accept:
          - "Može karticom?"
          - "Moze karticom?"
          - "Da li može karticom?"
      - id: "05-B-8"
        type: translate
        prompt: "Чек, пожалуйста."
        accept:
          - "Račun, molim."
          - "Racun, molim."
      - id: "05-B-9"
        type: translate
        prompt: "Это испорчено, могу поменять?"
        accept:
          - "Ovo je pokvareno, mogu li da zamenim?"
          - "Ovo je pokvareno, mogu li da zamenim"
          - "Ovo je pokvareno, mogu li zameniti?"
      - id: "05-B-10"
        type: translate
        prompt: "Кто последний? (в очереди)"
        accept:
          - "Ko je poslednji?"
          - "Ko je zadnji?"

  - id: "C"
    title: "Реплика продавца — твой ответ"
    instruction: "Впиши подходящую вставку."
    exercises:
      - id: "05-C-1"
        type: fill_blank
        prompt: "— Izvolite? — ___ mi pola kile sira. (вежливая просьба «дайте»)"
        accept: ["Dajte", "Daćete"]
      - id: "05-C-2"
        type: fill_blank
        prompt: "— Još nešto? — Ne, to je ___."
        accept: ["sve"]
      - id: "05-C-3"
        type: fill_blank
        prompt: "— Kešom ili karticom? — ___."
        accept: ["Karticom", "Kešom", "Kesom"]
      - id: "05-C-4"
        type: fill_blank
        prompt: "— Imate li sitno? — Nemam, ___. (извинись одним словом)"
        accept: ["izvinite"]
      - id: "05-C-5"
        type: fill_blank
        prompt: "— Kesa? — ___ jedna. (согласись: «можно»)"
        accept: ["Može", "Moze"]
      - id: "05-C-6"
        type: fill_blank
        prompt: "Tražim mleko, ali ne znam gde je. — Pitam prodavca: „___ imate mleko?“"
        accept: ["da li"]

  - id: "D"
    title: "Разыграй ситуацию"
    instruction: "Одна–две реплики по-сербски, потом сверься с образцом."
    exercises:
      - id: "05-D-1"
        type: free
        prompt: "Зашёл в пекару. Поздоровайся и попроси один хлеб и два бурека."
        sample: "Dobar dan! Jedan hleb i dva bureka, molim."
      - id: "05-D-2"
        type: free
        prompt: "Продавец назвал сумму. Спроси, можно ли картой, и попроси чек."
        sample: "Može karticom? Račun, molim."
      - id: "05-D-3"
        type: free
        prompt: "Йогурт оказался просроченным. Скажи об этом и попроси замену."
        sample: "Ovo je pokvareno, isteko je rok. Mogu li da zamenim?"

  - id: "E"
    title: "Исправь ошибку"
    instruction: "Запиши правильный вариант целиком."
    exercises:
      - id: "05-E-1"
        type: fix_error
        prompt: "Daj mi pola kilo jabuka."
        accept: ["Daj mi pola kile jabuka.", "Dajte mi pola kile jabuka."]
        explain: "«pola» + род. падеж: «pola kile»."
      - id: "05-E-2"
        type: fix_error
        prompt: "Koliko košta ovo sve zajedno? Karticom mogu?"
        accept: ["Koliko košta ovo sve zajedno? Mogu li karticom?", "Koliko sve zajedno? Može karticom?"]
        explain: "Вопрос про оплату: «Mogu li karticom?» / «Može karticom?»."
      - id: "05-E-3"
        type: fix_error
        prompt: "Ja tražim za hleb."
        accept: ["Tražim hleb.", "Trazim hleb."]
        explain: "«tražiti» — без предлога: «tražim hleb»."
      - id: "05-E-4"
        type: fix_error
        prompt: "To je sve, ništa manje."
        accept: ["To je sve, ništa više.", "To je sve, nista vise."]
        explain: "«больше ничего» = «ništa više»."
      - id: "05-E-5"
        type: fix_error
        prompt: "Idem u magacin da kupim mleko."
        accept: ["Idem u prodavnicu da kupim mleko.", "Idem u market da kupim mleko."]
        explain: "«magacin» — склад. Магазин — «prodavnica»."

  - id: "F"
    title: "Диктант"
    instruction: "Послушай и запиши, что слышишь. Латиницей, с диакритикой (č, ć, š, ž, đ)."
    exercises:
      - id: "05-F-1"
        type: listen
        say: "Ko je poslednji?"
        accept: ["Ko je poslednji?"]
      - id: "05-F-2"
        type: listen
        say: "Treba mi hleb."
        accept: ["Treba mi hleb."]
      - id: "05-F-3"
        type: listen
        say: "Dajte mi jednu kesu."
        accept: ["Dajte mi jednu kesu."]
      - id: "05-F-4"
        type: listen
        say: "To je sve, hvala."
        accept: ["To je sve, hvala."]
