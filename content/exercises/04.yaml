lesson: "04"
blocks:
  - id: "A"
    title: "Запиши число словами"
    instruction: "Латиницей, как читается вслух. Между разрядами — без «i»."
    exercises:
      - id: "04-A-1"
        type: translate
        prompt: "7"
        accept: ["sedam"]
      - id: "04-A-2"
        type: translate
        prompt: "15"
        accept: ["petnaest"]
      - id: "04-A-3"
        type: translate
        prompt: "40"
        accept: ["četrdeset", "cetrdeset"]
      - id: "04-A-4"
        type: translate
        prompt: "200"
        accept: ["dvesta", "dvesto"]
      - id: "04-A-5"
        type: translate
        prompt: "348"
        accept: ["trista četrdeset osam", "trista cetrdeset osam"]
      - id: "04-A-6"
        type: translate
        prompt: "1250"
        accept: ["hiljadu dvesta pedeset"]
      - id: "04-A-7"
        type: translate
        prompt: "2500"
        accept: ["dve hiljade petsto"]

  - id: "B"
    title: "Переведи на сербский"
    instruction: "Латиницей. Числа — словами."
    exercises:
      - id: "04-B-1"
        type: translate
        prompt: "Сколько стоит?"
        accept: ["Koliko košta?", "Koliko kosta?", "Pošto je?"]
      - id: "04-B-2"
        type: translate
        prompt: "Сколько всё вместе?"
        accept: ["Koliko sve zajedno?", "Koliko je sve zajedno?"]
      - id: "04-B-3"
        type: translate
        prompt: "Триста пятьдесят динаров."
        accept: ["Trista pedeset dinara.", "Trista pedeset dinara"]
      - id: "04-B-4"
        type: translate
        prompt: "У меня нет мелочи."
        accept: ["Nemam sitno.", "Nemam sitnog."]
      - id: "04-B-5"
        type: translate
        prompt: "Картой можно?"
        accept: ["Može karticom?", "Moze karticom?", "Da li može karticom?"]
      - id: "04-B-6"
        type: translate
        prompt: "Сколько тебе лет?"
        accept: ["Koliko imaš godina?", "Koliko imas godina?"]
      - id: "04-B-7"
        type: translate
        prompt: "Мне тридцать два года."
        accept: ["Imam trideset dve godine.", "Imam 32 godine."]
        explain: "…2 → «godine» (двойственное число)."
      - id: "04-B-8"
        type: translate
        prompt: "Дочке три года."
        accept: ["Ćerka ima tri godine.", "Cerka ima tri godine."]
      - id: "04-B-9"
        type: translate
        prompt: "Чек, пожалуйста."
        accept: ["Račun, molim.", "Racun, molim.", "Molim vas račun."]
      - id: "04-B-10"
        type: translate
        prompt: "Напиши мне. (позвони/сообщи)"
        accept: ["Javi mi se.", "Javite mi se."]

  - id: "C"
    title: "Поставь слово в нужную форму"
    instruction: "В ответе — только слово в скобках, в правильной форме."
    exercises:
      - id: "04-C-1"
        type: fill_blank
        prompt: "pet (dinar) ___"
        accept: ["dinara"]
        explain: "5+ → родительный мн.: «dinara»."
      - id: "04-C-2"
        type: fill_blank
        prompt: "dva (dinar) ___"
        accept: ["dinara"]
        explain: "2, 3, 4 → форма как род. ед.: «dinara»."
      - id: "04-C-3"
        type: fill_blank
        prompt: "jedna (kafa) ___"
        accept: ["kafa"]
      - id: "04-C-4"
        type: fill_blank
        prompt: "tri (kafa) ___"
        accept: ["kafe"]
      - id: "04-C-5"
        type: fill_blank
        prompt: "deset (godina) ___"
        accept: ["godina"]
      - id: "04-C-6"
        type: fill_blank
        prompt: "Imam dvadeset jednu (godina) ___."
        accept: ["godinu"]
        explain: "…1 (кроме 11) → ед. ч.: «godinu»."

  - id: "D"
    title: "Скажи по-сербски"
    instruction: "Одна реплика, потом сверься с образцом."
    exercises:
      - id: "04-D-1"
        type: free
        prompt: "Спроси цену булочки в пекаре."
        sample: "Pošto je kifla? / Koliko košta kifla?"
      - id: "04-D-2"
        type: free
        prompt: "Продавец сказал «280 динаров». Спроси, можно ли картой, и что нет мелочи."
        sample: "Može karticom? Nemam sitno."
      - id: "04-D-3"
        type: free
        prompt: "Продиктуй вслух номер: 064 123 45 67."
        sample: "nula šest četiri, jedan dva tri, četiri pet, šest sedam"

  - id: "E"
    title: "Исправь ошибку"
    instruction: "Запиши правильный вариант целиком."
    exercises:
      - id: "04-E-1"
        type: fix_error
        prompt: "Imam dve sto dinara."
        accept: ["Imam dvesta dinara."]
        explain: "200 — одно слово «dvesta»."
      - id: "04-E-2"
        type: fix_error
        prompt: "Košta hiljada dinara."
        accept: ["Košta hiljadu dinara.", "Kosta hiljadu dinara."]
        explain: "В счёте — «hiljadu»."
      - id: "04-E-3"
        type: fix_error
        prompt: "Imam trideset dve godina."
        accept: ["Imam trideset dve godine."]
        explain: "…2 → «godine»."
      - id: "04-E-4"
        type: fix_error
        prompt: "Koliko imaš godine?"
        accept: ["Koliko imaš godina?", "Koliko imas godina?"]
        explain: "В вопросе о возрасте — «godina» (род. мн.)."
      - id: "04-E-5"
        type: fix_error
        prompt: "Pet dinar, molim."
        accept: ["Pet dinara, molim."]
        explain: "5+ → «dinara»."
