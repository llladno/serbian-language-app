lesson: "01"
blocks:
  - id: "A"
    title: "Переведи на сербский (латиница)"
    instruction: "Пиши латиницей. Регистр и финальная пунктуация не важны."
    exercises:
      - id: "01-A-1"
        type: translate
        prompt: "Привет! Как дела?"
        accept:
          - "Zdravo! Kako si?"
          - "Ćao! Kako si?"
        explain: "«Ćao» — неформально, тоже подходит."
      - id: "01-A-2"
        type: translate
        prompt: "Доброе утро! Меня зовут Гриша."
        accept:
          - "Dobro jutro! Zovem se Griša."
          - "Dobro jutro! Ja sam Griša."
          - "Dobro jutro! Zovem se Grisha."
        explain: "«Zovem se…» или «Ja sam…» — оба варианта нейтральны."
      - id: "01-A-3"
        type: translate
        prompt: "Я из России, но живу в Нови-Саде."
        accept:
          - "Ja sam iz Rusije, ali živim u Novom Sadu."
          - "Iz Rusije sam, ali živim u Novom Sadu."
      - id: "01-A-4"
        type: translate
        prompt: "Извините, как вас зовут?"
        accept:
          - "Izvinite, kako se zovete?"
          - "Oprostite, kako se zovete?"
      - id: "01-A-5"
        type: translate
        prompt: "Очень приятно. — Взаимно."
        accept:
          - "Drago mi je. — Takođe."
          - "Drago mi je. Takođe."
          - "Drago mi je. — I meni je drago."
        explain: "«Takođe» = «взаимно, тоже». Можно и «I meni je drago»."
      - id: "01-A-6"
        type: translate
        prompt: "Спасибо большое! — Не за что."
        accept:
          - "Hvala lepo! — Nema na čemu."
          - "Hvala lepo! Nema na čemu."
          - "Hvala puno! — Nema na čemu."
      - id: "01-A-7"
        type: translate
        prompt: "Я не устал. (муж. род)"
        accept:
          - "Nisam umoran."
          - "Ja nisam umoran."
        explain: "«umoran» = усталый (не «умный»!)."
      - id: "01-A-8"
        type: translate
        prompt: "Ты из Белграда? — Нет. (краткий ответ глаголом)"
        accept:
          - "Da li si iz Beograda? — Nisam."
          - "Jesi li iz Beograda? — Nisam."
          - "Da li si iz Beograda? Nisam."
        explain: "Краткий ответ — повтором глагола: «Nisam.», не «Ne»."

  - id: "B"
    title: "Вставь нужную форму глагола jesam (краткую или отрицание)"
    instruction: "В ответе — только вставляемое слово."
    exercises:
      - id: "01-B-1"
        type: fill_blank
        prompt: "Ja ___ iz Rusije."
        accept: ["sam"]
      - id: "01-B-2"
        type: fill_blank
        prompt: "Da li ___ umoran? (ti)"
        accept: ["si"]
      - id: "01-B-3a"
        type: fill_blank
        prompt: "Milan ___ iz Novog Sada."
        accept: ["je"]
      - id: "01-B-3b"
        type: fill_blank
        prompt: "On ___ iz Beograda. (отрицание)"
        accept: ["nije"]
      - id: "01-B-4"
        type: fill_blank
        prompt: "Mi ___ kolege."
        accept: ["smo"]
      - id: "01-B-5"
        type: fill_blank
        prompt: "Danas ___ slobodan. (я)"
        accept: ["sam"]

  - id: "C"
    title: "Исправь ошибку"
    instruction: "Запиши правильный вариант целиком."
    exercises:
      - id: "01-C-1"
        type: fix_error
        prompt: "Sam iz Rusije."
        accept:
          - "Ja sam iz Rusije."
          - "Iz Rusije sam."
        explain: "Краткая форма не может стоять первой в предложении."
      - id: "01-C-2"
        type: fix_error
        prompt: "Ja nije umoran."
        accept: ["Ja nisam umoran."]
        explain: "«nije» — это on/ona/ono. Для «ja» → «nisam»."
      - id: "01-C-3"
        type: fix_error
        prompt: "Kako se zovete ti?"
        accept:
          - "Kako se zoveš?"
          - "Kako se zovete?"
        explain: "Либо «zoveš» (ти), либо «zovete» (ви) — без лишнего местоимения."

  - id: "D"
    title: "Мини-ситуация"
    instruction: "Напиши реплики, потом сверься с образцом."
    exercises:
      - id: "01-D-1"
        type: free
        prompt: "Ты заходишь в пекару утром. Поздоровайся, а на выходе — попрощайся (2 реплики)."
        sample: "— Dobro jutro!  …  — Hvala, prijatno! / Doviđenja!"

  - id: "E"
    title: "Диктант"
    instruction: "Послушай и запиши, что слышишь. Латиницей, с диакритикой (č, ć, š, ž, đ)."
    exercises:
      - id: "01-E-1"
        type: listen
        say: "Dobar dan, kako ste?"
        accept: ["Dobar dan, kako ste?"]
      - id: "01-E-2"
        type: listen
        say: "Ja sam iz Rusije."
        accept: ["Ja sam iz Rusije."]
      - id: "01-E-3"
        type: listen
        say: "Drago mi je, ja sam Ana."
        accept: ["Drago mi je, ja sam Ana."]
      - id: "01-E-4"
        type: listen
        say: "Vidimo se, prijatno!"
        accept: ["Vidimo se, prijatno!"]
